        else if (name === 'k_norm' || name.includes('k_norm')) child.params = KV * hd;
        // Sparse attention index projections (MiniMax-M3)
        else if (trieKey.includes('index_q_proj') || name.includes('index_q_proj')) {
          const idxN = this.sparseAttnCfg.sparse_num_index_heads || 4;
          const idxD = this.sparseAttnCfg.sparse_index_dim || 128;
          child.params = H * idxN * idxD;
          child.shape = [H, idxN * idxD];
        }
        else if (trieKey.includes('index_k_proj') || name.includes('index_k_proj')) {
          const idxN = this.sparseAttnCfg.sparse_num_index_heads || 4;
          const idxD = this.sparseAttnCfg.sparse_index_dim || 128;
          child.params = H * idxN * idxD;
          child.shape = [H, idxN * idxD];
        }
        else if (trieKey.includes('index_q_norm') || name.includes('index_q_norm')) {
          const idxN = this.sparseAttnCfg.sparse_num_index_heads || 4;
          const idxD = this.sparseAttnCfg.sparse_index_dim || 128;
          child.params = idxN * idxD;
          child.shape = [idxN * idxD];
        }
        else if (trieKey.includes('index_k_norm') || name.includes('index_k_norm')) {
          const idxN = this.sparseAttnCfg.sparse_num_index_heads || 4;
          const idxD = this.sparseAttnCfg.sparse_index_dim || 128;
          child.params = idxN * idxD;
          child.shape = [idxN * idxD];
        }
      }
      // MLP projections (common to all layer types) — use childI for shared_experts
      // Handles both gate_proj/up_proj/down_proj and w1/w2/w3 naming
      // Check both display name and raw trie key
      if (child.params === 0 || child.params === undefined) {
        if (name === 'gate_proj' || trieKey === 'w1' || name.includes('gate_proj') || trieKey.includes('w1')) child.params = H * childI;
        else if (name === 'up_proj' || trieKey === 'w3' || name.includes('up_proj') || trieKey.includes('w3')) child.params = H * childI;
        else if (name === 'down_proj' || trieKey === 'w2' || name.includes('down_proj') || trieKey.includes('w2')) child.params = childI * H;
        else if (name.includes('eh_proj') || name === 'phi') child.params = H * H;
        else if (name === 'e_proj' || name.includes('e_proj')) child.params = H * H;
        else if (name.includes('shared_head')) child.params = H * H + H;
        // MoE Gate (Router)
        else if (name === 'gate' || (name.includes('gate') && !name.includes('proj') && !name.includes('shared') && !name.includes('w1'))) {
          child.params = H * (this.numExperts || 1);
        }
        // Norms
        else if (child.shape && child.shape.length === 1 && (name.includes('norm') || name.includes('layernorm'))) {
          child.params = child.shape[0];
        }
      }
      // Recursively process grandchildren — needed for nested modules like
      // shared_experts (children: gate_proj/up_proj/down_proj)
      // and experts (children: Expert N → gate_proj/up_proj/down_proj)
      if (child.children && child.children.length > 0 && child.params === 0) {
        this._setLeafParams(child, layerIdx, name, isLinear, isLowRank, isMoE, childI);
        // After setting leaf params, recalculate this child's params from its children
        if (child.children && child.children.length > 0 && child.params === 0) {
          child.params = child.children.reduce((s, c) => s + (c.params || 0), 0);
        }
      }
    }
  }

  _hasMoE(trieNode) {
    const childKeys = Object.keys(trieNode.children || {});
    for (const k of childKeys) {
      const sub = trieNode.children[k];
      if (k === 'experts' || k === 'block_sparse_moe' || k === 'sparse_moe') return true;
      if (sub.children && (sub.children.experts || sub.children.block_sparse_moe)) return true;
      // Check deeper: block_sparse_moe.experts
      if (sub.children && sub.children.block_sparse_moe && sub.children.block_sparse_moe.children && sub.children.block_sparse_moe.children.experts) return true;
    }
    return false;
  }

  // Set params on MoE expert children (handles both w1/w2/w3 and gate_proj/up_proj/down_proj naming)
  _setMoEExpertParams(expertGroupNode, isBlockSparseMoe) {
    if (!expertGroupNode.children) return;
    const H = this.H;
    const I = this.isMoE ? this.moeI : this.I;

    // Find the experts container within this group (may be the group itself or a nested "Experts" node)
    let expertsContainer = expertGroupNode;
    // If there's a nested "Experts (N)" node, dig into it
    const nestedExperts = expertGroupNode.children.find(c => c.type === 'moe' && c.isLayerGroup && c.name.includes('Experts'));
    if (nestedExperts) {
      expertsContainer = nestedExperts;
    }

    // Set params on each expert
    for (const expert of expertsContainer.children || []) {
      if (!expert.children) continue;
      for (const proj of expert.children) {
        const name = (proj.name || '').toLowerCase();
        if (name === 'w1' || name.includes('gate_proj')) {
          proj.params = H * I;
          proj.shape = [H, I];
          proj.details = { ...proj.details, shape: `${H}×${I}`, note: 'expert gate' };
          this._setLeafShapeFromParent(proj, H, I);
        } else if (name === 'w2' || name.includes('down_proj')) {
          proj.params = I * H;
          proj.shape = [I, H];
          proj.details = { ...proj.details, shape: `${I}×${H}`, note: 'expert down' };
          this._setLeafShapeFromParent(proj, I, H);
        } else if (name === 'w3' || name.includes('up_proj')) {
          proj.params = H * I;
          proj.shape = [H, I];
          proj.details = { ...proj.details, shape: `${H}×${I}`, note: 'expert up' };
          this._setLeafShapeFromParent(proj, H, I);
        }
      }
      // Set expert total params
      expert.params = expert.children.reduce((s, c) => s + (c.params || 0), 0);
    }
    // Set experts container total params
    if (nestedExperts) {
      nestedExperts.params = nestedExperts.children.reduce((s, c) => s + (c.params || 0), 0);
    }

    // Handle shared experts
    const sharedExp = expertGroupNode.children.find(c => c.name.includes('Shared Expert'));
    if (sharedExp && sharedExp.children) {
      const sharedI = this.sharedExpI || this.sharedInterI || I;
      for (const proj of sharedExp.children) {
        const name = (proj.name || '').toLowerCase();
        if (name === 'w1' || name.includes('gate_proj')) { proj.params = H * sharedI; proj.shape = [H, sharedI]; this._setLeafShapeFromParent(proj, H, sharedI); }
        else if (name === 'w2' || name.includes('down_proj')) { proj.params = sharedI * H; proj.shape = [sharedI, H]; this._setLeafShapeFromParent(proj, sharedI, H); }
        else if (name === 'w3' || name.includes('up_proj')) { proj.params = H * sharedI; proj.shape = [H, sharedI]; this._setLeafShapeFromParent(proj, H, sharedI); }
      }
      sharedExp.params = sharedExp.children.reduce((s, c) => s + (c.params || 0), 0);
    }

    // Handle gate/router — use actual expert count from the container
    const gateNode = expertGroupNode.children.find(c => c.name.includes('Gate'));
    if (gateNode) {
      // Derive expert count from the actual number of expert nodes (or config)
      const actualExpCount = nestedExperts
        ? nestedExperts.children.filter(c => c.children).length
        : (this.numExperts || 1);
      // Check if there's a summary node for capped experts
      const summaryNode = nestedExperts
        ? nestedExperts.children.find(c => c.name && c.name.includes('more experts'))
        : null;
      const summaryCount = summaryNode ? Math.round(summaryNode.params / (3 * H * I)) : 0;
      const totalExpCount = actualExpCount + summaryCount;
      gateNode.params = H * (totalExpCount || this.numExperts || 1);
      gateNode.shape = [H, totalExpCount || this.numExperts || 1];
    }

    // Set group total params
    expertGroupNode.params = expertGroupNode.children.reduce((s, c) => s + (c.params || 0), 0);
  }


  _classify(key, depth) {
    const map = {
      'embed_tokens': { type: 'embedding', icon: '🔤' },
      'embed': { type: 'embedding', icon: '🔤' },
      'lm_head': { type: 'output', icon: '🎯' },
      'head': { type: 'output', icon: '🎯' },
      'visual': { type: 'vision', icon: '👁' },
      'vision_tower': { type: 'vision', icon: '👁' },
      'vision_model': { type: 'vision', icon: '👁' },
      'multi_modal_projector': { type: 'projector', icon: '🔗' },
      'patch_merge_mlp': { type: 'projector', icon: '🔗' },
      'language_model': { type: 'model', icon: '🏛' },
      'model': { type: 'model', icon: '🏛' },
      'mtp': { type: 'mtp', icon: '🔮' },
      'self_attn': { type: 'attention', icon: '⚡' },
      'linear_attn': { type: 'linear_attn', icon: '🌀' },

  // ---- Config-driven fallback (when no safetensors) ----
  _buildFromConfig() {
    const c = this.config;
    const tree = {
      name: (c.architectures || [])[0] || `${c.model_type || 'Model'}`,
      type: 'model', icon: '🏛', params: 0,
      details: {
        model_type: c.model_type,
        architectures: (c.architectures || []).join(', '),
        hidden_size: this.H, num_layers: this.L, attention_heads: this.A,
        kv_heads: this.KV, head_dim: this.headDim, intermediate_size: this.I,
        vocab_size: this.V, max_context: c.max_position_embeddings,
        is_moe: this.isMoE, num_experts: this.numExperts,
        experts_per_tok: this.expertsPerTok, moe_intermediate_size: this.moeI,
        n_shared_experts: this.numSharedExp, shared_expert_size: this.sharedExpI,
        first_k_dense_replace: this.firstKDense, routed_scaling_factor: this.routedScale,
        q_lora_rank: this.qLora, kv_lora_rank: this.kvLora,
        qk_nope_head_dim: this.qkNope, qk_rope_head_dim: this.qkRope, v_head_dim: this.vHead,
        index_n_heads: this.idxN, index_head_dim: this.idxHead, index_topk: this.idxTopk,
        param_sink_number: this.paramSink,
        use_mhc: this.useMHC, mhc_num_stream: this.mhcStreams,
        sandwich_norm: this.sandwichNorm,
        sliding_window: this.slidingWindow,
        dsa_layers: this.dsaLayers.length, swa_layers: this.swaLayers.length,
        multimodal: this.isVLM, tie_embeddings: this.tieEmbed,
        dtype: c.dtype || c.torch_dtype || 'float32',
      },
      children: []
    };

    // LM Head
    if (!this.tieEmbed) {
      tree.children.push({
        name: 'LM Head', type: 'output', icon: '🎯', params: this.H * this.V,
        shape: [this.H, this.V], details: { shape: `${this.H}x${this.V}`, bias: false }
      });
    }
    // Final norm
    tree.children.push({
      name: 'Final RMSNorm', type: 'norm', icon: '📊', params: this.H, shape: [this.H],
      details: { type: 'rms', eps: this.rmsEps }
    });

    if (this.isVLM && this.vc) {
      const vc = this.vc;
      tree.children.push({
        name: 'Vision Encoder', type: 'vision', icon: '👁', params: 0,
        details: { hidden_size: vc.hidden_size, depth: vc.depth, num_heads: vc.num_heads, patch_size: vc.patch_size, intermediate_size: vc.intermediate_size },
        children: [
          { name: 'Patch Embed', type: 'vision', icon: '🔲', params: vc.in_channels * vc.hidden_size * vc.patch_size * vc.patch_size, details: {} },
          { name: `ViT Blocks (${vc.depth})`, type: 'vision', icon: '🔄', isLayerGroup: true, layerCount: vc.depth, params: 0, details: {}, children: Array.from({length: vc.depth}, (_,i) => this._vitBlock(i, vc)) },
          { name: 'Merger', type: 'vision', icon: '🔗', params: vc.hidden_size * vc.out_hidden_size * vc.spatial_merge_size * vc.spatial_merge_size, details: {} },
        ]
      });
    }

    // Transformer layers
    const layerChildren = [];
    for (let i = 0; i < this.L; i++) {
      const lt = (c.layer_types || [])[i];
      const isLinear = lt === 'linear_attention';
      const isDSA = this.dsaLayers.includes(i);
      const isSWA = this.swaLayers.includes(i);
      if (isLinear) layerChildren.push(this._buildLinearLayer(i));
      else if (this.qLora > 0 || isDSA) layerChildren.push(this._buildFullLayer(i));  // low-rank / DSA
      else layerChildren.push(this._buildFullLayer(i));
    }
    tree.children.push({
      name: 'Transformer Layers', type: 'layer-group', icon: '📚',
      isLayerGroup: true, layerCount: this.L, params: 0,
      details: { count: this.L, dsa_layers: this.dsaLayers.length, swa_layers: this.swaLayers.length, dense_mlp_layers: this.firstKDense },
      children: layerChildren
    });

    // MTP / NextN
    if (this.mtpLayers > 0) {
      tree.children.push({
        name: 'MTP Head', type: 'mtp', icon: '🔮', params: this.mtpLayers * (this.H * this.V + this.H),
        details: { num_layers: this.mtpLayers },
        children: Array.from({length: this.mtpLayers}, (_,i) => ({
          name: `MTP Layer ${i}`, type: 'mtp', icon: '🔮', params: this.H * this.V + this.H,
          details: {},
          children: [
            { name: 'embed', type: 'embedding', icon: '🔤', shape: [this.V, this.H], params: this.H * this.V, details: {} },
            { name: 'enorm', type: 'norm', icon: '📊', shape: [this.H], params: this.H, details: { type: 'rms', eps: this.rmsEps } },
          ]
        }))
      });
    }

    // Merge MHC (if applicable)
    if (this.useMHC) {
      tree.children.push({
        name: 'Merge MHC Module', type: 'other', icon: '🔗',
        params: this.mhcStreams * this.H + this.mhcStreams * this.H + this.H + this.H * this.H,
        details: { num_streams: this.mhcStreams },
        children: [
          { name: 'branch_alpha_pre', type: 'other', icon: '🔗', params: this.mhcStreams, details: {} },
          { name: 'branch_beta_pre', type: 'other', icon: '🔗', params: this.mhcStreams, details: {} },
          { name: 'norm_gamma', type: 'norm', icon: '📊', params: this.H, details: {} },
          { name: 'phi', type: 'other', icon: '🔗', params: this.H * this.H, details: {} },
        ]
      });
    }

    // Embedding
    tree.children.push({
      name: 'Embedding', type: 'embedding', icon: '🔤', params: this.V * this.H,
      shape: [this.V, this.H], details: { shape: `${this.V}x${this.H}` }
    });

    return tree;
  }

  _buildLayer(i, isLinear) {
    if (isLinear) return this._buildLinearLayer(i);
    return this._buildFullLayer(i);
  }

  _buildFullLayer(i) {
    const H = this.H, A = this.A, KV = this.KV, hd = this.headDim;
    const isDenseMLP = i < this.firstKDense;
    const I = (this.isMoE && !isDenseMLP) ? this.moeI : this.I;
    const isLowRank = this.qLora > 0;

    // Attention params
    let attnP;
    if (isLowRank) {
      const qA = H * this.qLora;
      const qB = this.qLora * A * (this.qkNope + this.qkRope);
      const kvA = H * (this.kvLora + this.qkRope);
      const kvB = this.kvLora * A * (this.qkNope + this.vHead);
      const oP = A * (this.qkNope + this.qkRope) * H;
      const idxP = this.qLora * this.idxN * this.idxHead + this.kvLora * this.idxN * this.idxHead + this.idxN * this.idxHead * A + this.idxN * this.idxHead;
      const convP = H * H;  // compresskv_conv approx
      const sinkP = this.paramSink * A * this.vHead + this.paramSink * this.qkRope;
      attnP = qA + qB + kvA + kvB + oP + idxP + convP + sinkP + this.qLora + this.kvLora;
    } else {
      const qP = H * (A * hd), kP = H * (KV * hd), vP = H * (KV * hd), oP = (A * hd) * H;
      attnP = qP + kP + vP + oP;
    }
    const normP = H;
    let ffnP;
    if (this.isMoE && !isDenseMLP) {
      ffnP = this.numExperts * 3 * H * I + 3 * H * (this.sharedExpI || I) + H * this.numExperts;
    } else { ffnP = 3 * H * I; }
    const mhcP = this.useMHC ? (this.mhcStreams * H + this.mhcStreams * H + H + H * H) * 2 + H * H : 0;
    const blockPostP = this.blockPostLnIdx.includes(i) ? H : 0;
    const total = attnP + ffnP + 2 * normP + mhcP + blockPostP;

    const attnLabel = isLowRank ? 'DSA (Low-Rank)' : 'Full Attn';
    const mlpLabel = (this.isMoE && !isDenseMLP) ? `MoE (${this.numExperts} exp, top-${this.expertsPerTok})` : 'Dense MLP';

    const children = [];
    if (this.blockPostLnIdx.includes(i)) {
      children.push({ name: 'Block Post LayerNorm', type: 'norm', icon: '📊', params: H, details: { type: 'rms', eps: this.rmsEps } });
    }
    children.push({ name: 'Input RMSNorm', type: 'norm', icon: '📊', params: normP, details: { type: 'rms', eps: this.rmsEps } });

    if (isLowRank) {
      children.push({
        name: `Self-Attention (${attnLabel})`, type: 'attention', icon: '👁', params: attnP,
        details: { q_lora: this.qLora, kv_lora: this.kvLora, qk_nope: this.qkNope, qk_rope: this.qkRope, v_head: this.vHead, indexer_heads: this.idxN, indexer_topk: this.idxTopk },
        children: [
          { name: 'q_a_proj', type: 'attention', icon: '⬇', shape: [H, this.qLora], params: H * this.qLora, details: { shape: `${H}x${this.qLora}` } },
          { name: 'q_a_layernorm', type: 'norm', icon: '📊', params: this.qLora, details: { type: 'rms' } },
          { name: 'q_b_proj', type: 'attention', icon: '⬆', shape: [this.qLora, A*(this.qkNope+this.qkRope)], params: this.qLora * A * (this.qkNope + this.qkRope), details: {} },
          { name: 'kv_a_proj_with_mqa', type: 'attention', icon: '⬇', params: H * (this.kvLora + this.qkRope), details: {} },
          { name: 'kv_a_layernorm', type: 'norm', icon: '📊', params: this.kvLora, details: { type: 'rms' } },
          { name: 'kv_b_proj', type: 'attention', icon: '⬆', params: this.kvLora * A * (this.qkNope + this.vHead), details: {} },
          { name: 'Indexer', type: 'attention', icon: '🔍', params: this.qLora * this.idxN * this.idxHead, details: { n_heads: this.idxN, head_dim: this.idxHead, topk: this.idxTopk },
            children: [
              { name: 'wq_b', type: 'attention', icon: '⬆', params: this.qLora * this.idxN * this.idxHead, details: {} },
              { name: 'wk', type: 'attention', icon: '⬆', params: this.kvLora * this.idxN * this.idxHead, details: {} },
              { name: 'weights_proj', type: 'attention', icon: '⚖', params: this.idxN * this.idxHead * A, details: {} },
              { name: 'k_norm', type: 'norm', icon: '📊', params: this.idxN * this.idxHead, details: { type: 'rms' } },
            ]
          },
          { name: 'compresskv_conv', type: 'attention', icon: '🗜', params: H * H, details: {} },
          { name: 'o_proj', type: 'attention', icon: '⬆', params: A * (this.qkNope + this.qkRope) * H, details: {} },
          { name: 'o_conv', type: 'attention', icon: '🗜', params: H * H, details: {} },
          { name: 'param_sink_compressed_kv', type: 'attention', icon: '💾', params: this.paramSink * A * this.vHead, details: {} },
          { name: 'param_sink_k_pe', type: 'attention', icon: '💾', params: this.paramSink * this.qkRope, details: {} },
          { name: 'qa_conv', type: 'attention', icon: '🗜', params: this.qLora * this.qLora, details: {} },
        ]
      });
    } else {
      const qP = H * (A * hd), kP = H * (KV * hd), vP = H * (KV * hd), oP = (A * hd) * H;
      children.push({
        name: `Self-Attention (${attnLabel})`, type: 'attention', icon: '👁', params: qP + kP + vP + oP,
        details: { num_heads: A, kv_heads: KV, head_dim: hd },
        children: [
          { name: 'q_proj', type: 'attention', icon: '❓', shape: [H, A*hd], params: qP, details: { weight: `${H}x${A*hd}` } },
          { name: 'q_norm', type: 'norm', icon: '📊', params: hd, details: { type: 'rms' } },
          { name: 'k_proj', type: 'attention', icon: '🔑', shape: [H, KV*hd], params: kP, details: { weight: `${H}x${KV*hd}` } },
          { name: 'k_norm', type: 'norm', icon: '📊', params: hd, details: { type: 'rms' } },
          { name: 'v_proj', type: 'attention', icon: '💎', shape: [H, KV*hd], params: vP, details: { weight: `${H}x${KV*hd}` } },
          { name: 'o_proj', type: 'attention', icon: '📤', shape: [A*hd, H], params: oP, details: { weight: `${A*hd}x${H}` } },
        ]
      });
    }

    if (this.useMHC) {
      children.push({
        name: 'Attn MHC Module', type: 'other', icon: '🔗', params: this.mhcStreams * H + this.mhcStreams * H + H + H * H,
        details: { num_streams: this.mhcStreams },
        children: [
          { name: 'branch_alpha', type: 'other', icon: '🔗', params: this.mhcStreams, details: {} },
          { name: 'branch_beta', type: 'other', icon: '🔗', params: this.mhcStreams, details: {} },
          { name: 'norm_gamma', type: 'norm', icon: '📊', params: H, details: {} },
          { name: 'phi', type: 'other', icon: '🔗', params: H * H, details: {} },
        ]
      });
      children.push({ name: 'eh_proj', type: 'other', icon: '🔗', params: H * H, details: {} });
    }

    children.push({ name: 'Post-Attn RMSNorm', type: 'norm', icon: '📊', params: normP, details: { type: 'rms', eps: this.rmsEps } });
    if (this.sandwichNorm) children.push({ name: 'Pre-MLP RMSNorm', type: 'norm', icon: '📊', params: normP, details: { type: 'rms', eps: this.rmsEps } });
    children.push(this._buildMLP(I, isDenseMLP));
    if (this.useMHC) {
      children.push({
        name: 'MLP MHC Module', type: 'other', icon: '🔗', params: this.mhcStreams * H + this.mhcStreams * H + H + H * H,
        details: { num_streams: this.mhcStreams },
        children: [
          { name: 'branch_alpha', type: 'other', icon: '🔗', params: this.mhcStreams, details: {} },
          { name: 'branch_beta', type: 'other', icon: '🔗', params: this.mhcStreams, details: {} },
          { name: 'norm_gamma', type: 'norm', icon: '📊', params: H, details: {} },
          { name: 'phi', type: 'other', icon: '🔗', params: H * H, details: {} },
        ]
      });
    }
    if (this.sandwichNorm) children.push({ name: 'Post-MLP RMSNorm', type: 'norm', icon: '📊', params: normP, details: { type: 'rms', eps: this.rmsEps } });

    return {
      name: `Layer ${i} (${attnLabel}, ${mlpLabel})`, type: 'layer', icon: '🔧', _layerType: 'full', params: total,
      details: { hidden_size: H, attention_heads: A, kv_heads: KV, head_dim: hd, is_moe: this.isMoE && !isDenseMLP, is_low_rank: isLowRank, has_mhc: this.useMHC, has_block_post_ln: this.blockPostLnIdx.includes(i) },
      children
    };
  }

  _buildLinearLayer(i) {
    const H = this.H;
    const isDenseMLP = i < this.firstKDense;
    const I = (this.isMoE && !isDenseMLP) ? this.moeI : this.I;
    const linKH = this.linKH || this.A, linVH = this.linVH || this.A;
    const keyDim = this.linKeyDim || 128, valDim = this.linValDim || 128;
    const convK = this.convK || 4;
    const qkvOut = linKH * keyDim, vOut = linVH * valDim, zOut = linVH * valDim;
    const qkvP = H * qkvOut, aP = H * qkvOut, bP = H * vOut, zP = H * zOut;
    const convP = convK * qkvOut, aLogP = linKH * keyDim, dtBiasP = linKH;
    const normP_inner = linVH * valDim, outProjP = zOut * H;
    const attnP = qkvP + aP + bP + zP + convP + aLogP + dtBiasP + normP_inner + outProjP;
    const normP = H;
    let ffnP;
    if (this.isMoE && !isDenseMLP) { ffnP = this.numExperts * 3 * H * I + 3 * H * (this.sharedExpI || I) + H * this.numExperts; }
    else { ffnP = 3 * H * I; }
    const mhcP = this.useMHC ? (this.mhcStreams * H + this.mhcStreams * H + H + H * H) * 2 + H * H : 0;
    const total = attnP + ffnP + 2 * normP + mhcP;
    const mlpLabel = (this.isMoE && !isDenseMLP) ? `MoE (${this.numExperts} exp, top-${this.expertsPerTok})` : 'Dense MLP';
    return {
      name: `Layer ${i} (Linear Attn, ${mlpLabel})`, type: 'layer', icon: '🔧', _layerType: 'linear', params: total,
      details: { hidden_size: H, key_heads: linKH, value_heads: linVH, key_dim: keyDim, value_dim: valDim, conv_kernel: convK, is_moe: this.isMoE && !isDenseMLP },
      children: [
        { name: 'Input RMSNorm', type: 'norm', icon: '📊', params: normP, details: { type: 'rms', eps: this.rmsEps } },
        { name: 'Linear Attention (Mamba SSM)', type: 'linear_attn', icon: '🌀', _layerType: 'linear', params: attnP, details: { key_heads: linKH, value_heads: linVH, key_dim: keyDim, value_dim: valDim },
          children: [
            { name: 'in_proj_qkv', type: 'linear_attn', icon: '❓', params: qkvP, details: { weight: `${H}x${qkvOut}` } },
            { name: 'in_proj_a', type: 'linear_attn', icon: '🔑', params: aP, details: { weight: `${H}x${qkvOut}` } },
            { name: 'in_proj_b', type: 'linear_attn', icon: '💎', params: bP, details: { weight: `${H}x${vOut}` } },
            { name: 'in_proj_z', type: 'linear_attn', icon: '🚪', params: zP, details: { weight: `${H}x${zOut}` } },
            { name: '1D Conv (conv1d)', type: 'linear_attn', icon: '📊', params: convP, details: { kernel: convK } },
            { name: 'A_log', type: 'linear_attn', icon: '🔄', params: aLogP, details: { note: 'log state matrix' } },
            { name: 'dt_bias', type: 'linear_attn', icon: '📊', params: dtBiasP, details: { note: 'dt bias' } },
            { name: 'norm', type: 'norm', icon: '📊', params: normP_inner, details: { type: 'rms' } },
            { name: 'out_proj', type: 'linear_attn', icon: '📤', params: outProjP, details: { weight: `${zOut}x${H}` } },
          ]},
        { name: 'Post-Attn RMSNorm', type: 'norm', icon: '📊', params: normP, details: { type: 'rms', eps: this.rmsEps } },
        this._buildMLP(I, isDenseMLP),
      ]
    };
  }

  _buildMLP(I, isDenseMLP) {
    const H = this.H;
    if (this.isMoE && !isDenseMLP) {
      const perExp = 3 * H * I;
      const sharedI = this.sharedExpI || I;
      const sharedP = 3 * H * sharedI;
      const routerP = H * this.numExperts;
      const total = this.numExperts * perExp + sharedP + routerP + H;
      return {
        name: 'MoE MLP', type: 'ffn', icon: '🔀', params: total,
        details: { is_moe: true, num_experts: this.numExperts, experts_per_tok: this.expertsPerTok, moe_intermediate_size: I, shared_expert_size: sharedI },
        children: [
          { name: 'gate (router)', type: 'norm', icon: '🚪', params: routerP, details: { weight: `${H}×${this.numExperts}`, note: 'routes tokens to experts' } },
          { name: 'shared_expert_gate', type: 'norm', icon: '🚪', params: H, details: {} },
          { name: `Experts (${this.numExperts})`, type: 'moe', icon: '🎲', isLayerGroup: true, layerCount: this.numExperts, params: this.numExperts * perExp, details: { per_expert: perExp },
            children: Array.from({length: this.numExperts}, (_, i) => ({
              name: `Expert ${i}`, type: 'ffn', icon: '🔧', params: perExp, details: { gate_proj: `${H}×${I}`, up_proj: `${H}×${I}`, down_proj: `${I}×${H}` },
              children: [
                { name: 'gate_proj', type: 'ffn', icon: '🚪', params: H * I, details: { weight: `${H}×${I}` } },
                { name: 'up_proj', type: 'ffn', icon: '⬆', params: H * I, details: { weight: `${H}×${I}` } },
                { name: 'down_proj', type: 'ffn', icon: '⬇', params: I * H, details: { weight: `${I}×${H}` } },
              ]
            }))
          },
          { name: 'Shared Expert', type: 'ffn', icon: '🤝', params: sharedP, details: { gate_proj: `${H}×${sharedI}`, up_proj: `${H}×${sharedI}`, down_proj: `${sharedI}×${H}` },
            children: [
              { name: 'gate_proj', type: 'ffn', icon: '🚪', params: H * sharedI, details: {} },
              { name: 'up_proj', type: 'ffn', icon: '⬆', params: H * sharedI, details: {} },
              { name: 'down_proj', type: 'ffn', icon: '⬇', params: sharedI * H, details: {} },
            ]
          },
        ]
      };
    }
    return {
      name: 'MLP (SwiGLU)', type: 'ffn', icon: '🔀', params: 3 * H * I, details: { gate: `${H}×${I}`, up: `${H}×${I}`, down: `${I}×${H}` },
      children: [
        { name: 'gate_proj', type: 'ffn', icon: '🚪', params: H * I, details: { weight: `${H}×${I}` } },
        { name: 'up_proj', type: 'ffn', icon: '⬆', params: H * I, details: { weight: `${H}×${I}` } },
        { name: 'down_proj', type: 'ffn', icon: '⬇', params: I * H, details: { weight: `${I}×${H}` } },
      ]
    };
  }

  _vitBlock(i, vc) {
    const H = vc.hidden_size, I = vc.intermediate_size, nh = vc.num_heads || 16;
    const qkvP = 3 * H * H, projP = H * H, fc1P = H * I, fc2P = I * H;
    const normP = 2 * H;
    const total = qkvP + projP + fc1P + fc2P + 2 * normP + 3 * H + H + I + H;
    return {
      name: `ViT Block ${i}`, type: 'vision', icon: '🔄', params: total, details: { hidden_size: H, num_heads: nh, intermediate_size: I, has_bias: true },
      children: [
        { name: 'Norm 1', type: 'norm', icon: '📊', params: normP, details: { type: 'layer_norm', eps: 1e-6 } },
        { name: 'Attention', type: 'attention', icon: '⚡', params: qkvP + projP + 3 * H + H, details: { num_heads: nh, qkv: 'fused' },
          children: [
            { name: 'qkv (fused)', type: 'attention', icon: '❓', shape: [H, 3*H], params: qkvP + 3*H, details: { weight: `${H}×${3*H}`, bias: 3*H } },
            { name: 'proj', type: 'attention', icon: '📤', shape: [H, H], params: projP + H, details: { weight: `${H}×${H}`, bias: H } },
          ]},
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { type: 'add' } },
        { name: 'Norm 2', type: 'norm', icon: '📊', params: normP, details: { type: 'layer_norm', eps: 1e-6 } },
        { name: 'MLP', type: 'ffn', icon: '🔀', params: fc1P + fc2P + I + H, details: { fc1: `${H}×${I}`, fc2: `${I}×${H}`, activation: vc.hidden_act || 'gelu' },
          children: [
            { name: 'linear_fc1', type: 'ffn', icon: '⬆', params: fc1P + I, details: { weight: `${H}×${I}`, bias: I } },
            { name: 'linear_fc2', type: 'ffn', icon: '⬇', params: fc2P + H, details: { weight: `${I}×${H}`, bias: H } },
          ]},
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { type: 'add' } },
      ]
    };
  }

  _calcParams(node) {
    if (node.params === undefined || node.params === 0) {
      if (node.children && node.children.length > 0) {
        node.params = node.children.reduce((s, c) => s + this._calcParams(c), 0);
      } else {
        node.params = node.params || 0;
      }
    }
    return node.params;
  }

  _reverseTree(node) {
    if (node.children && node.children.length > 0) {
      // Don't reverse:
      // - layer-internal children (already in input→output order)
      // - vision subtrees (built in correct order from safetensors)
      if (node.type !== 'layer' && node.type !== 'vision' && node.type !== 'projector') {
        node.children.reverse();
      }
      node.children.forEach(c => this._reverseTree(c));
    }
  }
}
function formatParams(n) {
  if (n === 0) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toString();
}

function formatBytes(n) {
  if (!n) return '—';
  const f = n * 4;
  if (f >= 1e9) return (f / 1e9).toFixed(2) + ' GB';
  if (f >= 1e6) return (f / 1e6).toFixed(2) + ' MB';
  return (f / 1e3).toFixed(1) + ' KB';
}

function getNodeColor(type) {
  const colors = {
    model: '#ff9d00', embedding: '#3b82f6', encoder: '#8b5cf6', decoder: '#8b5cf6',
    layer: '#10b981', attention: '#f97316', linear_attn: '#14b8a6', full_attn: '#f97316',
    ffn: '#06b6d4', mlp: '#06b6d4', norm: '#ef4444', head: '#8b5cf6',
    vision: '#ec4899', mtp: '#6366f1', moe: '#8b5cf6', other: '#6b7280'
  };
  return colors[type] || '#6b7280';
}

// ============================================================
//  Tree Renderer
// ============================================================
class TreeRenderer {
  constructor(container, detailPanel) {
    this.container = container;
    this.detailPanel = detailPanel;
    this.selectedNode = null;
    this.nodeMap = new Map();
    this.layerRange = { start: 0, end: -1 };
    this.headTailCount = 6; // Show first 6 + last 6, collapse middle
  }

  render(tree) {
    this.container.innerHTML = '';
    this.nodeMap.clear();
    this._renderNode(tree, this.container, 0, 'root');
  }

  _renderNode(node, parent, depth, path) {
    const nodeEl = document.createElement('div');
    nodeEl.className = 'tree-node';
    nodeEl.dataset.path = path;

    const row = document.createElement('div');
    row.className = 'node-row';
    row.dataset.path = path;

    const isLayerGroup = node.isLayerGroup && node.layerCount > this.headTailCount;
    let visibleChildren = node.children || [];
    let showPagination = false;
    let middleStart = -1, middleEnd = -1, middleChildren = [];

    if (isLayerGroup) {
      const total = node.layerCount;
      const allChildren = node.children || [];
      const head = this.headTailCount;
      const tail = this.headTailCount;
      
      if (this.layerRange.end >= 0) {
        // Custom range mode — use start/end slice
        const start = this.layerRange.start;
        const end = Math.min(this.layerRange.end, node.layerCount);
        visibleChildren = allChildren.slice(start, end);
        showPagination = true;
      } else if (total > head + tail + 1) {
        // Head-tail mode: show first N + collapsible middle + last N
        const headChildren = allChildren.slice(0, head);
        const tailChildren = allChildren.slice(total - tail);
        middleChildren = allChildren.slice(head, total - tail);
        middleStart = head;
        middleEnd = total - tail - 1;
        // visibleChildren will be rendered in three parts below
        visibleChildren = headChildren; // head portion first
        showPagination = true;
      } else {
        // Not enough layers to collapse — show all
        showPagination = true;
      }
    }

    const hasChildren = visibleChildren.length > 0 || middleChildren.length > 0;
    const isExpanded = depth < 2;

    // Layer type strip for hybrid attention
    if (node._layerType) {
      const strip = document.createElement('div');
      strip.className = `layer-type-strip ${node._layerType}`;
      strip.title = node._layerType === 'linear' ? 'Linear Attention (GLA)' : 'Full Attention';
      row.appendChild(strip);
    }
    // Inherit layer type for attention sub-nodes so they show the color strip too
    if (!node._layerType && node.type && (node.type === 'attention' || node.type === 'linear_attn')) {
      const isLinearType = node.type === 'linear_attn' || (node.name && node.name.toLowerCase().includes('linear'));
      const strip = document.createElement('div');
      strip.className = `layer-type-strip ${isLinearType ? 'linear' : 'full'}`;
      strip.title = isLinearType ? 'Linear Attention component' : 'Full Attention component';
      row.appendChild(strip);
    }

    // Toggle arrow
    const toggle = document.createElement('div');
    toggle.className = 'node-toggle' + (hasChildren ? (isExpanded ? ' expanded' : '') : ' leaf');
    toggle.textContent = '▶';
    row.appendChild(toggle);

    // Icon
    const icon = document.createElement('div');
    icon.className = `node-icon ${node.type || 'other'}`;
    icon.textContent = node.icon || '📦';
    row.appendChild(icon);

    // Label
    const label = document.createElement('div');
    label.className = 'node-label';
    label.textContent = node.name;
    row.appendChild(label);

    // Type tag
    if (node.type) {
      const tag = document.createElement('span');
      tag.className = `node-type-tag type-tag ${node.type}`;
      tag.textContent = node.type;
      row.appendChild(tag);
    }

    // Shape
    if (node.shape) {
      const shape = document.createElement('div');
      shape.className = 'node-shape';
      shape.textContent = `[${node.shape.join(' × ')}]`;
      row.appendChild(shape);
    }

    // Params badge
    const paramsBadge = document.createElement('div');
    paramsBadge.className = 'node-params' + (node.params === 0 ? ' zero' : '');
    paramsBadge.textContent = formatParams(node.params);
    row.appendChild(paramsBadge);

    // Click handler
    row.addEventListener('click', (e) => {
      if (e.target === toggle || e.target === icon) {
        this._toggleNode(nodeEl, visibleChildren, node, depth, path);
      } else {
        this._selectNode(node, row);
      }
    });

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      this._toggleNode(nodeEl, visibleChildren, node, depth, path);
    });

    nodeEl.appendChild(row);

    // Pagination bar removed — head/tail collapse is self-explanatory

    // Children container
    if (hasChildren) {
      const childContainer = document.createElement('div');
      childContainer.className = 'children-container';
      childContainer.style.display = isExpanded ? 'block' : 'none';
      if (isExpanded) {
        childContainer.style.maxHeight = '9999px';
      } else {
        childContainer.style.maxHeight = '0';
      }
      nodeEl.appendChild(childContainer);

      nodeEl._childContainer = childContainer;
      nodeEl._children = visibleChildren;
      nodeEl._node = node;
      nodeEl._depth = depth;
      nodeEl._path = path;
      nodeEl._rendered = isExpanded;

      if (isExpanded) {
        // For layer groups, render head + divider + tail
        const isLayerGroup2 = node.isLayerGroup && node.layerCount > this.headTailCount;
        if (isLayerGroup2 && node.children.length > this.headTailCount * 2 + 1) {
          this._renderLayerGroupChildren(node, childContainer, depth, path);
        } else {
          visibleChildren.forEach((child, i) => {
            this._renderNode(child, childContainer, depth + 1, `${path}.${i}`);
          });
        }
      }

      if (isExpanded) toggle.classList.add('expanded');
    }

    this.nodeMap.set(path, { node, element: nodeEl, row });
    parent.appendChild(nodeEl);
  }

  _toggleNode(nodeEl, visibleChildren, node, depth, path) {
    const childContainer = nodeEl._childContainer;
    if (!childContainer) return;

    const toggle = nodeEl.querySelector('.node-toggle');
    const isExpanded = childContainer.style.display === 'block';

    if (isExpanded) {
      childContainer.style.maxHeight = childContainer.scrollHeight + 'px';
      requestAnimationFrame(() => {
        childContainer.style.maxHeight = '0';
        childContainer.style.display = 'none';
      });
      toggle.classList.remove('expanded');
    } else {
      childContainer.style.display = 'block';
      childContainer.style.maxHeight = '0';

      if (!nodeEl._rendered) {
        // For layer groups, render head + divider + tail
        const isLayerGroup = node.isLayerGroup && node.layerCount > this.headTailCount;
        if (isLayerGroup && node.children.length > this.headTailCount * 2 + 1) {
          this._renderLayerGroupChildren(node, childContainer, depth, path);
        } else {
          visibleChildren.forEach((child, i) => {
            this._renderNode(child, childContainer, depth + 1, `${path}.${i}`);
          });
        }
        nodeEl._rendered = true;
      }

      requestAnimationFrame(() => {
        childContainer.style.maxHeight = '9999px';
      });
      toggle.classList.add('expanded');
    }
  }

  _renderLayerGroupChildren(node, childContainer, depth, path) {
    const allChildren = node.children || [];
    const total = allChildren.length;
    const head = this.headTailCount;
    const tail = this.headTailCount;
    const headChildren = allChildren.slice(0, head);
    const middleChildren = allChildren.slice(head, total - tail);
    const middleStart = head;
    const middleEnd = total - tail - 1;

    // Render head
    headChildren.forEach((child, i) => {
      this._renderNode(child, childContainer, depth + 1, `${path}.${i}`);
    });

    if (middleChildren.length > 0) {
      const divider = document.createElement('div');
      divider.className = 'layer-collapse-divider';
      divider.innerHTML = `
        <span class="divider-icon">▶</span>
        <span class="divider-count">${middleChildren.length} layers</span>
        <span class="divider-range">(L${middleStart} — L${middleEnd})</span>
        <span class="divider-hint">点击展开中间层</span>
      `;

      const middleContainer = document.createElement('div');
      middleContainer.className = 'children-container middle-layers';
      middleContainer.style.display = 'none';
      middleContainer.style.maxHeight = '0';

      divider.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = middleContainer.style.display === 'none';
        if (isCollapsed) {
          if (!divider.dataset.rendered) {
            middleChildren.forEach((child, i) => {
              this._renderNode(child, middleContainer, depth + 1, `${path}.${middleStart + i}`);
            });
            divider.dataset.rendered = 'true';
          }
          middleContainer.style.display = 'block';
          requestAnimationFrame(() => {
            middleContainer.style.maxHeight = '9999px';
          });
          divider.classList.add('expanded');
          divider.querySelector('.divider-hint').textContent = '点击折叠中间层';
        } else {
          middleContainer.style.maxHeight = middleContainer.scrollHeight + 'px';
          requestAnimationFrame(() => {
            middleContainer.style.maxHeight = '0';
            middleContainer.style.display = 'none';
          });
          divider.classList.remove('expanded');
          divider.querySelector('.divider-hint').textContent = '点击展开中间层';
        }
      });

      childContainer.appendChild(divider);
      childContainer.appendChild(middleContainer);

      // Render tail
      const tailChildren = allChildren.slice(total - tail);
      tailChildren.forEach((child, i) => {
        const realIdx = total - tail + i;
        this._renderNode(child, childContainer, depth + 1, `${path}.${realIdx}`);
      });
    }
  }

  _createPagination(node, path) {
    const container = document.createElement('div');
    container.className = 'layer-pagination';

    const info = document.createElement('span');
    info.className = 'label';
    info.textContent = `共 ${node.layerCount} 层 · 头尾各 ${this.headTailCount} 层`;
    container.appendChild(info);

    return container;
  }

  _rerenderLayerGroup(node, path) {
    const rootTree = this.nodeMap.get('root');
    if (rootTree) {
      this.render(rootTree.node);
    }
  }

  _selectNode(node, rowEl) {
    document.querySelectorAll('.node-row.selected').forEach(el => el.classList.remove('selected'));
    rowEl.classList.add('selected');
    this.selectedNode = node;
    this._renderDetail(node);
  }

  _renderDetail(node) {
    const panel = this.detailPanel;
    panel.innerHTML = '';

    const header = document.createElement('div');
    header.className = 'detail-header';

    const title = document.createElement('h3');
    title.textContent = node.name;
    header.appendChild(title);

    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = `${node.type || 'node'} · ${formatParams(node.params)} params`;
    header.appendChild(sub);

    panel.appendChild(header);

    const body = document.createElement('div');
    body.className = 'detail-body';

    if (node.shape) {
      const sec = document.createElement('div');
      sec.className = 'detail-section';
      sec.innerHTML = '<div class="detail-section-title">张量形状</div>';
      const shapeBox = document.createElement('div');
      shapeBox.className = 'shape-box';
      shapeBox.textContent = `[${node.shape.join(', ')}]`;
      sec.appendChild(shapeBox);
      body.appendChild(sec);
    }

    if (node.details && Object.keys(node.details).length > 0) {
      const sec = document.createElement('div');
      sec.className = 'detail-section';
      sec.innerHTML = '<div class="detail-section-title">详细参数</div>';

      const table = document.createElement('table');
      table.className = 'detail-table';
      for (const [k, v] of Object.entries(node.details)) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        td1.textContent = k;
        const td2 = document.createElement('td');
        td2.textContent = typeof v === 'boolean' ? (v ? 'true' : 'false') : String(v);
        if (k.includes('tied')) {
          const badge = document.createElement('span');
          badge.className = 'tied-badge';
          badge.textContent = v ? 'tied' : 'untied';
          td2.innerHTML = '';
          td2.appendChild(badge);
        }
        tr.appendChild(td1);
        tr.appendChild(td2);
        table.appendChild(tr);
      }
      sec.appendChild(table);
      body.appendChild(sec);
    }

    if (node.children && node.children.length > 0) {
      const sec = document.createElement('div');
      sec.className = 'detail-section';
      sec.innerHTML = '<div class="detail-section-title">子模块参数分布</div>';

      const total = node.children.reduce((s, c) => s + (c.params || 0), 0);
      node.children.forEach(child => {
        const row = document.createElement('div');
        row.className = 'param-bar-row';

        const label = document.createElement('div');
        label.className = 'param-bar-label';
        label.textContent = child.name;
        row.appendChild(label);

        const track = document.createElement('div');
        track.className = 'param-bar-track';
        const fill = document.createElement('div');
        fill.className = 'param-bar-fill';
        fill.style.background = getNodeColor(child.type);
        fill.style.width = total > 0 ? `${(child.params / total * 100).toFixed(1)}%` : '0%';
        track.appendChild(fill);
        row.appendChild(track);

        const val = document.createElement('div');
        val.className = 'param-bar-value';
        val.textContent = formatParams(child.params);
        row.appendChild(val);

        sec.appendChild(row);
      });
      body.appendChild(sec);
    }

    if (node.params > 0) {
      const sec = document.createElement('div');
      sec.className = 'detail-section';
      sec.innerHTML = '<div class="detail-section-title">显存估算 (float32)</div>';
      const table = document.createElement('table');
      table.className = 'detail-table';

      const rows = [
        ['参数量', formatParams(node.params)],
        ['FP32 显存', formatBytes(node.params)],
        ['FP16 显存', formatBytes(node.params / 2)],
        ['INT8 显存', formatBytes(node.params / 4)],
        ['INT4 显存', formatBytes(node.params / 8)]
      ];
      rows.forEach(([k, v]) => {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        td1.textContent = k;
        const td2 = document.createElement('td');
        td2.textContent = v;
        tr.appendChild(td1);
        tr.appendChild(td2);
        table.appendChild(tr);
      });
      sec.appendChild(table);
      body.appendChild(sec);
    }

    panel.appendChild(body);
  }

  expandAll() {
    document.querySelectorAll('.children-container').forEach(el => {
      el.style.display = 'block';
      el.style.maxHeight = '9999px';
    });
    document.querySelectorAll('.node-toggle').forEach(el => {
      if (!el.classList.contains('leaf')) el.classList.add('expanded');
    });
  }

  collapseAll() {
    document.querySelectorAll('.children-container').forEach((el, i) => {
      if (i === 0) return;
      el.style.maxHeight = '0';
      el.style.display = 'none';
    });
    document.querySelectorAll('.node-toggle').forEach((el, i) => {
      if (i === 0 || el.classList.contains('leaf')) return;
      if (i > 0) el.classList.remove('expanded');
    });
  }
}

let currentTree = null;
let currentConfig = null;
let renderer = null;

async function visualizeModel() {
  const input = document.getElementById('modelInput').value.trim();
  if (!input) return;

  const useMirror = document.getElementById('useMirror').checked;
  const baseHost = useMirror ? 'https://hf-mirror.com' : 'https://huggingface.co';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <h3>正在获取模型信息...</h3>
      <p style="font-size: 13px; color: var(--text-soft);">${input}</p>
      <p style="font-size: 11px; color: var(--text-faint); margin-top: 4px;">数据源: ${baseHost} · config.json + safetensors index</p>
    </div>
  `;

  try {
    // Fetch config.json
    const configUrl = `${baseHost}/${input}/resolve/main/config.json`;
    const resp = await fetch(configUrl);

    let configData = null;

    if (!resp.ok) {
      // Try API endpoint
      const apiUrl = `${baseHost}/api/models/${input}`;
      const apiResp = await fetch(apiUrl);
      if (apiResp.ok) {
        const apiData = await apiResp.json();
        if (apiData.config) {
          configData = apiData.config;
        } else {
          throw new Error(`无法获取 config.json (HTTP ${resp.status})。该模型可能没有公开的 config.json 文件。`);
        }
      } else {
        throw new Error(`模型 "${input}" 不存在或无法访问 (HTTP ${resp.status})。请检查模型 ID 是否正确。`);
      }
    } else {
      configData = await resp.json();
    }

    currentConfig = configData;

    // Fetch model metadata
    let modelMeta = null;
    try {
      const metaResp = await fetch(`${baseHost}/api/models/${input}`);
      if (metaResp.ok) {
        modelMeta = await metaResp.json();
      }
    } catch (e) {
      // Non-critical
    }

    // Fetch safetensors index.json (second data source — ground truth for module structure)
    let safetensorsData = null;
    let rawIndexData = null;
    try {
      const sftIndexUrl = `${baseHost}/${input}/resolve/main/model.safetensors.index.json`;
      const sftResp = await fetch(sftIndexUrl);
      if (sftResp.ok) {
        rawIndexData = await sftResp.json();
        safetensorsData = SafetensorsParser.parse(rawIndexData);
      }
    } catch (e) {
      // Non-critical — fall back to config-only mode
    }

    renderResult(currentConfig, modelMeta, input, safetensorsData, rawIndexData);
  } catch (err) {
    main.innerHTML = `
      <div class="error-state">
        <div style="font-size: 48px; margin-bottom: 12px;">⚠️</div>
        <h3>加载失败</h3>
        <p>${err.message}</p>
        <p style="font-size: 12px; color: var(--text-faint); margin-top: 8px;">
          提示：国内用户请勾选"使用镜像"。模型 ID 格式如 <code style="background: var(--bg-soft); padding: 2px 6px; border-radius: 3px;">bert-base-uncased</code> 或 <code style="background: var(--bg-soft); padding: 2px 6px; border-radius: 3px;">Qwen/Qwen3.8-27B</code>
        </p>
        <button class="btn btn-ghost" style="margin-top: 16px;" onclick="document.getElementById('modelInput').focus()">重新输入</button>
      </div>
    `;
  }
}

function renderResult(config, meta, modelId, safetensorsData = null, rawIndexData = null) {
  // Normalize nested config (e.g. Qwen3.5 VLM)
  const normalizedConfig = ConfigNormalizer.normalize(config);

  // Use StructureExtractor (generic, safetensors-driven) when we have index data;
  // fall back to ModelParser (per-model-type) when config-only
  // Route: use detailed per-model-type ModelParser for known types (it already
  // integrates safetensors data for layer-type detection + real tensor names,
  // and handles VLM with vision encoder/projector subtrees).
  // Only use generic StructureExtractor for unknown model types with safetensors.
  // Unknown VLM models also go through StructureExtractor (it can build vision/
  // projector/language subtrees from real tensors).
  const knownTypes = ['bert','roberta','deberta','deberta-v2','gpt2','gpt_neo','gptj','llama','mistral','qwen2','qwen','qwen3','qwen3_5','qwen3_5_text','qwen3_5_moe','qwen4_exp','qwen4_exp_text','t5','mt5','deepseek_v4','deepseek_v41','deepseek_v3','kimi_k2','kimi_k25','kimi_linear','kimi_k3','glm_moe_dsa','openpangu_v2'];
  // Known model types whose dedicated parser does NOT handle VLM (no vision/projector subtree logic).
  // When such a type is detected as VLM, fall back to StructureExtractor which can build
  // vision/projector/language subtrees from real safetensors tensors.
  const vlmUnsupportedTypes = ['glm_moe_dsa','openpangu_v2','deepseek_v4','deepseek_v41'];
  const isKnown = knownTypes.includes(normalizedConfig.model_type || '');
  const isVLM = !!(normalizedConfig._isMultimodal || normalizedConfig.text_config);
  const isVLMUnsupported = isVLM && vlmUnsupportedTypes.includes(normalizedConfig.model_type || '');

  let tree;
  if ((!isKnown || isVLMUnsupported) && rawIndexData && rawIndexData.weight_map) {
    const extractor = new StructureExtractor(normalizedConfig, safetensorsData, rawIndexData);
    tree = extractor.extract();
  } else {
    const parser = new ModelParser(normalizedConfig, safetensorsData);
    tree = parser.parse();
  }
  currentTree = tree;

  const main = document.getElementById('main');
  main.innerHTML = '';
  main.classList.add('fade-in');

  // Summary card
  const summary = document.createElement('div');
  summary.className = 'summary';

  const c = normalizedConfig;
  const H = c.hidden_size || c.d_model;
  const V = c.vocab_size;
  const L = c.num_hidden_layers || c.num_layers;
  const A = c.num_attention_heads || c.n_head || c.num_heads;
  const I = c.intermediate_size || c.d_ff;
  const P = c.max_position_embeddings || c.n_positions;
  const KV = c.num_key_value_heads;
  const ctxLen = c.max_position_embeddings || c.n_positions || c.max_seq_length;
  const dtype = c.torch_dtype || c.dtype || 'float32';
  const layerTypes = c.layer_types || [];
  const hasHybridAttn = layerTypes.length > 0 && layerTypes.some(t => t === 'linear_attention');

  const totalParams = tree.params;

  // Safetensors data source badge
  const sftBadge = safetensorsData
    ? `<span class="arch" style="background: var(--teal-soft); color: var(--teal);" title="模块结构来自 safetensors index.json（真实 tensor 名）">safetensors verified</span>`
    : `<span class="arch" style="background: var(--bg-soft); color: var(--text-faint);" title="仅从 config.json 推断，可能不准确">config only</span>`;

  let downloads = '';
  if (meta && meta.downloads) {
    downloads = meta.downloads.toLocaleString();
  }

  summary.innerHTML = `
    <div class="summary-header">
      <div class="summary-title">
        <h2>${modelId}</h2>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px;">
          <span class="arch">${c.model_type || 'unknown'}</span>
          ${(c.architectures || c._topLevel?.architectures || []).map(a => `<span class="arch" style="background: var(--purple-soft); color: var(--purple);">${a}</span>`).join('')}
          ${meta && meta.private ? '<span class="arch" style="background: var(--red-soft); color: var(--red);">private</span>' : ''}
          ${meta && meta.gated ? '<span class="arch" style="background: var(--orange-soft); color: var(--orange);">gated</span>' : ''}
          ${c._isMultimodal ? '<span class="arch" style="background: var(--pink-soft); color: var(--pink);">multimodal (VLM)</span>' : ''}
          ${hasHybridAttn ? '<span class="arch" style="background: var(--teal-soft); color: var(--teal);">hybrid attn</span>' : ''}
          ${c.num_experts ? `<span class="arch" style="background: var(--purple-soft); color: var(--purple);">MoE (${c.num_experts} experts, top-${c.num_experts_per_tok || 1})</span>` : ''}
          ${sftBadge}
        </div>
      </div>
      <div class="summary-total">
        <div class="num">${formatParams(totalParams)}</div>
        <div class="label">总参数量</div>
      </div>
    </div>

    <div class="stats-grid">
      ${H ? `<div class="stat-item"><div class="stat-label">Hidden Size</div><div class="stat-value">${H}</div></div>` : ''}
      ${L ? `<div class="stat-item"><div class="stat-label">Layers</div><div class="stat-value">${L}</div></div>` : ''}
      ${A ? `<div class="stat-item"><div class="stat-label">Attention Heads</div><div class="stat-value">${A}</div></div>` : ''}
      ${KV ? `<div class="stat-item"><div class="stat-label">KV Heads (GQA)</div><div class="stat-value">${KV}</div></div>` : ''}
      ${V ? `<div class="stat-item"><div class="stat-label">Vocab Size</div><div class="stat-value">${V.toLocaleString()}</div></div>` : ''}
      ${I ? `<div class="stat-item"><div class="stat-label">Intermediate Size</div><div class="stat-value">${I}</div></div>` : ''}
      ${ctxLen ? `<div class="stat-item"><div class="stat-label">Max Context Length</div><div class="stat-value">${ctxLen.toLocaleString()}</div></div>` : ''}
      <div class="stat-item"><div class="stat-label">Dtype</div><div class="stat-value">${dtype}</div></div>
      ${downloads ? `<div class="stat-item"><div class="stat-label">Downloads (30d)</div><div class="stat-value">${downloads}</div></div>` : ''}
      <div class="stat-item"><div class="stat-label">FP32 显存</div><div class="stat-value">${formatBytes(totalParams)}</div></div>
      <div class="stat-item"><div class="stat-label">FP16 显存</div><div class="stat-value">${formatBytes(totalParams / 2)}</div></div>
      <div class="stat-item"><div class="stat-label">INT8 显存</div><div class="stat-value">${formatBytes(totalParams / 4)}</div></div>
    </div>

    <div class="dist-bar" id="distBar"></div>
    <div class="dist-legend" id="distLegend"></div>
  `;
  main.appendChild(summary);

  // Distribution bar
  const distBar = summary.querySelector('#distBar');
  const distLegend = summary.querySelector('#distLegend');
  const topChildren = tree.children || [];
  const totalForDist = topChildren.reduce((s, c) => s + (c.params || 0), 0);

  const typeColors = {
    embedding: '#3b82f6', encoder: '#8b5cf6', decoder: '#8b5cf6',
    head: '#f97316', attention: '#f97316', ffn: '#06b6d4', norm: '#ef4444',
    vision: '#ec4899', mtp: '#6366f1', moe: '#8b5cf6', model: '#ff9d00'
  };

  topChildren.forEach(child => {
    if (child.params > 0 && totalForDist > 0) {
      const pct = (child.params / totalForDist * 100);
      const seg = document.createElement('div');
      seg.className = 'dist-segment';
      seg.style.width = pct + '%';
      seg.style.background = typeColors[child.type] || '#6b7280';
      distBar.appendChild(seg);

      const legend = document.createElement('div');
      legend.className = 'dist-legend-item';
      legend.innerHTML = `
        <div class="dist-legend-dot" style="background: ${typeColors[child.type] || '#6b7280'}"></div>
        <span>${child.name} (${pct.toFixed(1)}%)</span>
      `;
      distLegend.appendChild(legend);
    }
  });

  // Content split
  const split = document.createElement('div');
  split.className = 'content-split';

  // Tree card
  const treeCard = document.createElement('div');
  treeCard.className = 'tree-card';

  const toolbar = document.createElement('div');
  toolbar.className = 'tree-toolbar';
  toolbar.innerHTML = `
    <div class="tree-toolbar-title">
      <span>🏗</span>
      <span>模型架构树</span>
    </div>
    <div class="tree-toolbar-actions">
      <button class="btn btn-ghost btn-sm" id="expandAllBtn">全部展开</button>
      <button class="btn btn-ghost btn-sm" id="collapseAllBtn">全部折叠</button>
    </div>
  `;
  treeCard.appendChild(toolbar);

  const treeContainer = document.createElement('div');
  treeContainer.className = 'tree-container';
  treeCard.appendChild(treeContainer);

  split.appendChild(treeCard);

  // Detail panel
  const detailPanel = document.createElement('div');
  detailPanel.className = 'detail-panel';
  detailPanel.innerHTML = `
    <div class="detail-header">
      <h3>详情面板</h3>
      <div class="sub">点击树节点查看详细信息</div>
    </div>
    <div class="detail-body">
      <div class="detail-empty">
        <div style="font-size: 36px; margin-bottom: 8px;">👈</div>
        <p>选择左侧任意节点</p>
        <p style="font-size: 11px; margin-top: 4px;">查看张量形状、参数分布和显存估算</p>
      </div>
    </div>
  `;
  split.appendChild(detailPanel);

  main.appendChild(split);

  // Raw config
  const rawSection = document.createElement('div');
  rawSection.className = 'raw-config-section';
  rawSection.innerHTML = `
    <div class="raw-config-header" id="rawConfigHeader">
      <h3>📄 原始 Config JSON</h3>
      <span class="raw-config-toggle" id="rawConfigToggle">▼</span>
    </div>
    <div class="raw-config-body" id="rawConfigBody">
      <pre>${JSON.stringify(config, null, 2)}</pre>
    </div>
  `;
  main.appendChild(rawSection);

  const rawHeader = rawSection.querySelector('#rawConfigHeader');
  const rawBody = rawSection.querySelector('#rawConfigBody');
  const rawToggle = rawSection.querySelector('#rawConfigToggle');
  rawHeader.addEventListener('click', () => {
    rawBody.classList.toggle('expanded');
    rawToggle.classList.toggle('expanded');
  });

  // Safetensors info section
  if (safetensorsData) {
    const sftSection = document.createElement('div');
    sftSection.className = 'raw-config-section';
    let sftHtml = `
      <div class="raw-config-header" id="sftHeader">
        <h3>📦 Safetensors Index (模块结构 ground truth)</h3>
        <span class="raw-config-toggle" id="sftToggle">▼</span>
      </div>
      <div class="raw-config-body" id="sftBody">
        <pre>`;
    sftHtml += JSON.stringify({
      total_tensors: safetensorsData.totalTensors,
      total_size_bytes: safetensorsData.totalSize,
      total_size_gb: (safetensorsData.totalSize / 1e9).toFixed(2) + ' GB',
      num_layers: safetensorsData.numLayers,
      num_vision_layers: safetensorsData.numVisionLayers,
      full_attn_layers: safetensorsData.fullLayerCount,
      linear_attn_layers: safetensorsData.linearLayerCount,
      layer_type_pattern: Object.entries(safetensorsData.layerTypes).slice(0, 8).map(([i, t]) => `L${i}:${t}`).join(', ') + (safetensorsData.numLayers > 8 ? '...' : ''),
      linear_attn_tensors: safetensorsData.linearAttnTensors.slice(0, 30),
      full_attn_tensors: safetensorsData.fullAttnTensors.slice(0, 30),
      mlp_tensors: safetensorsData.mlpTensors.slice(0, 30),
      norm_tensors: safetensorsData.normTensors.slice(0, 30),
      top_level_tensors: safetensorsData.topLevelTensors.slice(0, 50),
      has_mtp: safetensorsData.hasMTP,
      has_vision: safetensorsData.hasVision,
    }, null, 2);
    sftHtml += `</pre>
      </div>
    `;
    sftSection.innerHTML = sftHtml;
    main.appendChild(sftSection);

    const sftHeader = sftSection.querySelector('#sftHeader');
    const sftBody = sftSection.querySelector('#sftBody');
    const sftToggle = sftSection.querySelector('#sftToggle');
    sftHeader.addEventListener('click', () => {
      sftBody.classList.toggle('expanded');
      sftToggle.classList.toggle('expanded');
    });
  }

  // Render tree
  renderer = new TreeRenderer(treeContainer, detailPanel);
  renderer.render(tree);

  document.getElementById('expandAllBtn').addEventListener('click', () => renderer.expandAll());
  document.getElementById('collapseAllBtn').addEventListener('click', () => renderer.collapseAll());

  // Click root node
  const firstRow = treeContainer.querySelector('.node-row');
  if (firstRow) {
    firstRow.click();
  }
}

// ============================================================
//  Event listeners
// ============================================================
document.getElementById('visualizeBtn').addEventListener('click', visualizeModel);
document.getElementById('modelInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    visualizeModel();
    hideSuggestions();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    moveSuggestion(1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    moveSuggestion(-1);
  } else if (e.key === 'Escape') {
    hideSuggestions();
  }
});

// ============================================================
//  Autocomplete — query suggestion from models.json
// ============================================================
let modelList = [];

// Fetch model list from models.json
fetch('models.json')
  .then(r => r.json())
  .then(data => {
    if (data && Array.isArray(data.models)) {
      modelList = data.models.sort((a, b) => b.id.localeCompare(a.id));
    }
  })
  .catch(err => console.warn('Failed to load models.json:', err));

const modelInputEl = document.getElementById('modelInput');
const dropdownEl = document.getElementById('suggestionDropdown');

modelInputEl.addEventListener('input', () => {
  const query = modelInputEl.value.trim().toLowerCase();
  if (!query || modelList.length === 0) {
    hideSuggestions();
    return;
  }
  // Score and filter
  filteredModels = modelList
    .map(m => {
      const id = m.id.toLowerCase();
      const idx = id.indexOf(query);
      const orgMatch = m.org && m.org.toLowerCase().includes(query);
      const tagMatch = m.tags && m.tags.some(t => t.toLowerCase().includes(query));
      let score = -1;
      if (idx === 0) score = 100;
      else if (idx > 0) score = 60 - idx;
      else if (orgMatch) score = 40;
      else if (tagMatch) score = 20;
      return { ...m, _score: score, _matchIdx: idx };
    })
    .filter(m => m._score >= 0)
    .sort((a, b) => b._score - a._score || b.id.localeCompare(a.id))
    .slice(0, 10);

  if (filteredModels.length === 0) {
    hideSuggestions();
    return;
  }
  activeSuggestionIdx = -1;
  renderSuggestions();
  dropdownEl.classList.add('show');
});

function renderSuggestions() {
  dropdownEl.innerHTML = filteredModels.map((m, i) => {
    const id = m.id;
    const idx = m._matchIdx;
    let highlighted;
    if (idx >= 0) {
      highlighted = id.substring(0, idx) +
        '<span class="match">' + id.substring(idx, idx + modelInputEl.value.trim().length) + '</span>' +
        id.substring(idx + modelInputEl.value.trim().length);
    } else {
      highlighted = id;
    }
    const tags = m.tags ? m.tags.map(t => `<span class="sug-tag">${t}</span>`).join(' ') : '';
    return `<div class="suggestion-item${i === activeSuggestionIdx ? ' active' : ''}" data-idx="${i}">
      <span class="sug-id">${highlighted}</span>
      <span class="sug-org">${m.org || ''}</span>
      ${tags}
    </div>`;
  }).join('');

  // Attach click handlers
  dropdownEl.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const idx = parseInt(item.dataset.idx);
      selectSuggestion(idx);
    });
  });
}

function moveSuggestion(dir) {
  if (filteredModels.length === 0) return;
  activeSuggestionIdx = Math.max(-1, Math.min(filteredModels.length - 1, activeSuggestionIdx + dir));
  renderSuggestions();
  // Scroll active item into view
  const active = dropdownEl.querySelector('.suggestion-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function selectSuggestion(idx) {
  if (idx < 0 || idx >= filteredModels.length) return;
  modelInputEl.value = filteredModels[idx].id;
  hideSuggestions();
  visualizeModel();
}

function hideSuggestions() {
  dropdownEl.classList.remove('show');
  activeSuggestionIdx = -1;
}

// Click outside to close
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) {
    hideSuggestions();
  }
});

// Theme toggle
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  themeToggle.textContent = isDark ? '🌙' : '☀';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
});

const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
  document.documentElement.dataset.theme = 'dark';
  themeToggle.textContent = '☀';
}

// Auto-load on page open
window.addEventListener('DOMContentLoaded', () => {
  visualizeModel();
});
</script>
