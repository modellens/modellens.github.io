        const langModel = tree.children.find(c => c.type === 'model');
        if (langModel) this._reorderTopLevel(langModel);
      }
      return tree;
    }
    // Fallback to config-driven extraction
    const tree = this._buildFromConfig();
    this._calcParams(tree);
    this._reverseTree(tree);
    return tree;
  }

  // ---- Safetensors-driven: build tree from real tensor names ----
  _buildFromSafetensors() {
    const wm = this.rawIndex.weight_map;
    const keys = Object.keys(wm);

    // Detect MoE container name and expert weight naming from real tensors
    const sampleKey = keys.find(k => k.includes('.block_sparse_moe.') || k.includes('.experts.'));
    if (sampleKey) {
      if (sampleKey.includes('block_sparse_moe')) this.moeContainerName = 'block_sparse_moe';
      // Check if experts use w1/w2/w3 vs gate_proj/up_proj/down_proj
      const w1Key = keys.find(k => k.includes('.experts.0.w1.') || k.includes('.experts.0.gate_proj.'));
      if (w1Key) {
        if (w1Key.includes('.w1.')) this.expertWeightNames = ['w1', 'w2', 'w3'];
        else this.expertWeightNames = ['gate_proj', 'up_proj', 'down_proj'];
      }
    }

    // For VLM models, split keys into language_model and vision/projector groups
    if (this.isVLM) {
      return this._buildVLMSafetensors(keys, wm);
    }

    // Build trie from key paths
    const root = { children: {}, isLeaf: false };
    for (const key of keys) {
      const parts = key.split('.');
      let node = root;
      for (const p of parts) {
        if (!node.children[p]) node.children[p] = { children: {}, isLeaf: false };
        node = node.children[p];
      }
      node.isLeaf = true;
      node.shard = wm[key];
    }
    const tree = this._trieToNode('Model', root, '', 0);
    // Fuse config semantic details into top-level node
    this._enrichTopLevel(tree);
    // Set root name from config.architectures[0] (e.g. "DeepseekV3ForCausalLM")
    if (this.config.architectures && this.config.architectures[0]) {
      tree.name = this.config.architectures[0];
    }
    // Flatten the tree: remove "model" and "layers" shell layers
    // The trie produces: root → model → [Token Embedding, layers → [Transformer Layers, MTP Head], norm]
    // We want: root → [Embeddings, Transformer Layers, norm, MTP Head, LM Head]
    this._flattenShells(tree);
    return tree;
  }

  // ---- VLM: build vision encoder + projector + language model subtrees ----
  _buildVLMSafetensors(keys, wm) {
    // Separate keys by top-level prefix
    const langKeys = [];
    const visionKeys = [];
    const projectorKeys = [];
    const otherKeys = [];

    for (const key of keys) {
      // Check more specific prefixes first to avoid model.visual.* being caught by model.*
      // GLM-5.3 style: model.visual.*, model.language_model.*
      // V4.1 style: vision.*, aligner.*, layers.*, embed, head, norm, mtp
      if (key.startsWith('model.visual.') || key.startsWith('model.vision_tower.') || key.startsWith('model.multi_modal_projector.') || key.startsWith('model.projector.') || key.startsWith('model.patch_merge_mlp.')) {
        visionKeys.push(key);
      } else if (key.startsWith('model.language_model.') || key.startsWith('language_model.') || key.startsWith('model.')) {
        langKeys.push(key);
      } else if (key.startsWith('vision_tower.') || key.startsWith('visual.') || key.startsWith('vision.')) {
        visionKeys.push(key);
      } else if (key.startsWith('multi_modal_projector.') || key.startsWith('patch_merge_mlp.') || key.startsWith('projector.') || key.startsWith('aligner.')) {
        projectorKeys.push(key);
      } else if (key.startsWith('layers.') || key === 'embed.weight' || key === 'embed_tokens.weight' || key.startsWith('embed.') || key === 'head.weight' || key === 'lm_head.weight' || key === 'norm.weight' || key.startsWith('mtp.')) {
        // V4.1-style bare language model keys (no model. prefix)
        langKeys.push(key);
      } else {
        otherKeys.push(key);
      }
    }

    // Build language model trie (strip "language_model." and/or "model." prefix)
    const langRoot = { children: {}, isLeaf: false };
    for (const key of langKeys) {
      const stripped = key.replace(/^model\.language_model\./, '').replace(/^language_model\./, '').replace(/^model\./, '');
      const parts = stripped.split('.');
      let node = langRoot;
      for (const p of parts) {
        if (!node.children[p]) node.children[p] = { children: {}, isLeaf: false };
        node = node.children[p];
      }
      node.isLeaf = true;
      node.shard = wm[key];
    }
    // Build language model subtree
    const langTree = this._trieToNode('Language Model', langRoot, '', 0);
    langTree.type = 'model'; langTree.icon = '🏛';
    langTree.details = { hidden_size: this.H, layers: this.L, model_type: this.config.model_type };
    // Flatten shells inside language model
    this._flattenShells(langTree);

    // Build root tree
    const tree = {
      name: (this.config.architectures || [])[0] || 'Model',
      type: 'model', icon: '🏛', params: 0,
      details: {}, children: []
    };

    // For VLM models, label the language model as "Language Model" (not the raw architecture name)
    langTree.name = 'Language Model';
    if (this.textArchitectures && this.textArchitectures[0]) {
      langTree.details = { ...langTree.details, architecture: this.textArchitectures[0] };
    }

    this._enrichTopLevel(tree);
    tree.details.multimodal = true;

    // Build Vision Encoder subtree from safetensors
    const visionTree = this._buildVisionFromSafetensors(visionKeys, wm);
    if (visionTree) tree.children.push(visionTree);

    // Build Multi-Modal Projector subtree
    const projectorTree = this._buildProjectorFromSafetensors(projectorKeys, wm);
    if (projectorTree) tree.children.push(projectorTree);

    // Add language model subtree
    tree.children.push(langTree);

    // Add any other top-level tensors (lm_head, norm, etc.) that were not
    // classified into language_model/vision/projector groups
    if (otherKeys.length > 0) {
      const otherRoot = { children: {}, isLeaf: false };
      for (const key of otherKeys) {
        const parts = key.split('.');
        let node = otherRoot;
        for (const p of parts) {
          if (!node.children[p]) node.children[p] = { children: {}, isLeaf: false };
          node = node.children[p];
        }
        node.isLeaf = true;
        node.shard = wm[key];
      }
      const otherTree = this._trieToNode('Other', otherRoot, '', 0);
      this._flattenShells(otherTree);
      // Merge recognized children directly into tree, skip the "Other" wrapper
      if (otherTree.children && otherTree.children.length > 0) {
        for (const child of otherTree.children) {
          tree.children.push(child);
        }
      }
    }

    return tree;
  }

  // Build Vision Encoder subtree from safetensors tensor keys
  _buildVisionFromSafetensors(visionKeys, wm) {
    if (visionKeys.length === 0) return null;
    const vc = this.vc;
    const visH = vc.hidden_size || 1280;
    const visI = vc.intermediate_size || visH * 4;
    const visDepth = vc.depth || vc.num_hidden_layers || 32;
    const visHeads = vc.num_heads || 16;
    const visHeadDim = Math.floor(visH / visHeads);
    const patchSize = vc.patch_size || 14;
    const inChannels = vc.in_channels || 3;
    const outHidden = vc.out_hidden_size || vc.projection_dim || this.H;

    // Build vision trie
    const visRoot = { children: {}, isLeaf: false };
    for (const key of visionKeys) {
      // Strip vision prefixes (order matters: longer prefixes first)
      const stripped = key.replace(/^model\.vision_tower\./, '').replace(/^model\.visual\./, '').replace(/^model\.multi_modal_projector\./, '').replace(/^model\.projector\./, '').replace(/^model\.patch_merge_mlp\./, '').replace(/^vision_tower\./, '').replace(/^visual\./, '').replace(/^vision\./, '').replace(/^multi_modal_projector\./, '').replace(/^projector\./, '').replace(/^patch_merge_mlp\./, '');
      const parts = stripped.split('.');
      let node = visRoot;
      for (const p of parts) {
        if (!node.children[p]) node.children[p] = { children: {}, isLeaf: false };
        node = node.children[p];
      }
      node.isLeaf = true;
      node.shard = wm[key];
    }

    // Build the vision encoder tree
    const visTree = {
      name: 'Vision Encoder', type: 'vision', icon: '👁', params: 0,
      details: {
        hidden_size: visH, depth: visDepth, num_heads: visHeads,
        patch_size: patchSize, intermediate_size: visI,
        out_hidden_size: outHidden,
        model_type: vc.model_type || 'clip_vision_model',
        image_size: vc.image_size,
        position_embedding: vc.position_embedding_type || 'rope',
      },
      children: []
    };

    // Patch Embedding
    const patchEmbedParams = inChannels * visH * patchSize * patchSize;
    visTree.children.push({
      name: 'Patch Embed', type: 'vision', icon: '🔲', params: patchEmbedParams,
      details: { in_channels: inChannels, patch_size: patchSize, temporal: vc.temporal_patch_size || 1, shape: `${inChannels}×${visH}×${patchSize}×${patchSize}` }
    });

    // Pre-LayerNorm (CLIP-style pre-layernorm before encoder blocks)
    const hasPreLN = visionKeys.some(k => k.includes('pre_layrnorm') || k.includes('pre_layernorm'));
    if (hasPreLN) {
      visTree.children.push({
        name: 'Pre-LayerNorm', type: 'norm', icon: '📊', params: visH * 2,
        details: { type: 'layer_norm', eps: vc.layer_norm_eps || 1e-5, weight_bias: true }
      });
    }

    // ViT Blocks — build from safetensors
    // Detect if vision blocks use "encoder.layers.N" or "blocks.N" pattern
    const blockPattern = visionKeys.find(k => k.match(/encoder\.layers\.\d+\./)) ? 'encoder.layers'
      : visionKeys.find(k => k.match(/blocks\.\d+\./)) ? 'blocks'
      : 'encoder.layers';

    // Count unique vision block indices
    const visBlockIdxs = new Set();
    for (const k of visionKeys) {
      const m = k.match(/(?:encoder\.layers|blocks)\.(\d+)\./);
      if (m) visBlockIdxs.add(parseInt(m[1]));
    }

    if (visBlockIdxs.size > 0) {
      const sortedIdxs = [...visBlockIdxs].sort((a, b) => a - b);
      const vitChildren = sortedIdxs.map(idx => this._buildViTBlockFromTrie(idx, visRoot, blockPattern, visH, visI, visHeads, vc));
      visTree.children.push({
        name: `ViT Blocks (${sortedIdxs.length} layers)`, type: 'vision', icon: '🔄',
        isLayerGroup: true, layerCount: sortedIdxs.length, params: 0,
        details: { depth: sortedIdxs.length, hidden_size: visH, intermediate_size: visI, num_heads: visHeads, act: vc.hidden_act || 'gelu' },
        children: vitChildren
      });
    }

    // Post-LayerNorm (CLIP-style post-layernorm after encoder)
    const hasPostLN = visionKeys.some(k => k.includes('post_layrnorm') || k.includes('post_layernorm'));
    if (hasPostLN) {
      visTree.children.push({
        name: 'Post-LayerNorm', type: 'norm', icon: '📊', params: visH * 2,
        details: { type: 'layer_norm', eps: vc.layer_norm_eps || 1e-5, weight_bias: true }
      });
    }

    // Vision Encoder children are built in input→output order (Patch Embed → Pre-LN → ViT Blocks → Post-LN)
    // We need output→input (top to bottom): Post-LN → ViT Blocks → Pre-LN → Patch Embed
    // So reverse the children array after building
    visTree.children.reverse();

    return visTree;
  }

  // Build a single ViT block from safetensors trie
  _buildViTBlockFromTrie(idx, visRoot, blockPattern, H, I, numHeads, vc) {
    const headDim = Math.floor(H / numHeads);
    // Navigate to the block in the trie
    // The trie may have intermediate nodes like "vision_model" before "encoder.layers"
    let blockNode = visRoot;
    const parts = blockPattern.split('.');
    for (const p of parts) {
      if (!blockNode.children) { blockNode = { children: {} }; break; }
      blockNode = blockNode.children[p] || {};
    }
    // If we couldn't find the path, try navigating through vision_model first
    if (!blockNode.children || !blockNode.children[idx]) {
      blockNode = visRoot;
      // Try vision_model.encoder.layers or model.encoder.layers
      const tryPaths = [
        ['vision_model', 'encoder', 'layers'],
        ['model', 'encoder', 'layers'],
        ['encoder', 'layers'],
      ];
      for (const tp of tryPaths) {
        let node = visRoot;
        for (const p of tp) {
          if (!node.children || !node.children[p]) { node = null; break; }
          node = node.children[p];
        }
        if (node && node.children && node.children[idx]) {
          blockNode = node;
          break;
        }
      }
    }
    const block = blockNode.children?.[idx] || { children: {} };

    // Standard CLIP ViT block:
    // layer_norm1 → self_attn(q,k,v,out_proj) → layer_norm2 → mlp(fc1,fc2)
    const childKeys = Object.keys(block.children || {}).filter(k => {
      const c = block.children[k];
      return (c.children && Object.keys(c.children).length > 0) || !this._isTensorLeafName(k);
    });

    const attnParams = 4 * H * H + 4 * H;  // qkv+out, each with bias
    const mlpParams = 2 * H * I + I + H;    // fc1+fc2 with bias
    const normParams = 2 * H;               // weight+bias per norm

    const node = {
      name: `ViT Block ${idx}`, type: 'vision', icon: '🔄', params: 0,
      details: { hidden_size: H, num_heads: numHeads, head_dim: headDim, intermediate_size: I, activation: vc.hidden_act || 'gelu', has_bias: true },
      children: []
    };

    // Build children by walking the trie
    for (const key of childKeys) {
      const child = block.children[key];
      let name = key, type = 'module', icon = '📦';
      if (key === 'layer_norm1' || key === 'layer_norm2' || key === 'norm1' || key === 'norm2') {
        name = key === 'layer_norm1' || key === 'norm1' ? 'Norm 1' : 'Norm 2';
        type = 'norm'; icon = '📊';
      } else if (key === 'self_attn' || key === 'attention' || key === 'attn') {
        name = 'Attention'; type = 'attention'; icon = '⚡';
      } else if (key === 'mlp' || key === 'feed_forward') {
        name = 'MLP'; type = 'ffn'; icon = '🔀';
      }
      const childNode = this._trieToNode(name, child, key, 3);
      childNode.type = type; childNode.icon = icon;
      childNode._trieKey = key;
      // Infer params and shapes for vision attention
      if (key === 'self_attn' || key === 'attention' || key === 'attn') {
        // CLIP-style: q_proj, k_proj, v_proj, out_proj (each with weight+bias)
        // V4.1-style: wqkv (fused), wo
        childNode.params = 4 * H * H + 4 * H;
        childNode.shape = [H, H];
        childNode.details = { ...childNode.details, num_heads: numHeads, head_dim: headDim, has_bias: true, qkv: 'separate' };
        // Set params on children (q_proj, k_proj, v_proj, out_proj, wqkv, wo)
        this._setViTAttentionParams(childNode, H);
      } else if (key === 'mlp' || key === 'feed_forward') {
        childNode.params = mlpParams;
        childNode.shape = [H, I];
        childNode.details = { ...childNode.details, fc1: `${H}×${I}`, fc2: `${I}×${H}`, activation: vc.hidden_act || 'gelu', has_bias: true };
        this._setViTMLPParams(childNode, H, I);
      } else if (type === 'norm') {
        childNode.params = normParams;
        childNode.shape = [H];
        childNode.details = { ...childNode.details, type: 'layer_norm', eps: vc.layer_norm_eps || 1e-5, weight_bias: true };
      }
      node.children.push(childNode);
    }

    // Reorder: norm1 → attention → norm2 → mlp
    node.children.sort((a, b) => {
      const order = ['layer_norm1', 'norm1', 'self_attn', 'attention', 'attn', 'layer_norm2', 'norm2', 'mlp', 'feed_forward'];
      const ka = (a._trieKey || '').toLowerCase();
      const kb = (b._trieKey || '').toLowerCase();
      const ia = order.indexOf(ka);
      const ib = order.indexOf(kb);
      return (ia >= 0 ? ia : 99) - (ib >= 0 ? ib : 99);
    });

    return node;
  }

  // Set params on ViT attention children (q_proj, k_proj, v_proj, out_proj, wqkv, wo)
  _setViTAttentionParams(parentNode, H) {
    if (!parentNode.children) return;
    for (const child of parentNode.children) {
      const name = (child.name || '').toLowerCase();
      if (name === 'q_proj') { child.params = H * H; child.shape = [H, H]; child.details = { ...child.details, weight: `${H}×${H}`, bias: `${H}` }; this._setLeafShapeFromParent(child, H, H); }
      else if (name === 'k_proj') { child.params = H * H; child.shape = [H, H]; child.details = { ...child.details, weight: `${H}×${H}`, bias: `${H}` }; this._setLeafShapeFromParent(child, H, H); }
      else if (name === 'v_proj') { child.params = H * H; child.shape = [H, H]; child.details = { ...child.details, weight: `${H}×${H}`, bias: `${H}` }; this._setLeafShapeFromParent(child, H, H); }
      else if (name === 'out_proj' || name === 'wo') { child.params = H * H; child.shape = [H, H]; child.details = { ...child.details, weight: `${H}×${H}`, bias: `${H}` }; this._setLeafShapeFromParent(child, H, H); }
      else if (name === 'qkv' || name === 'wqkv' || name.includes('qkv')) { child.params = 3 * H * H; child.shape = [H, 3*H]; child.details = { ...child.details, weight: `${H}×${3*H}`, bias: `${3*H}`, note: 'fused qkv' }; this._setLeafShapeFromParent(child, H, 3*H); }
    }
  }

  // Set params on ViT MLP children (fc1, fc2, w1, w2, gate_proj, down_proj, up_proj)
  _setViTMLPParams(parentNode, H, I) {
    if (!parentNode.children) return;
    for (const child of parentNode.children) {
      const name = (child.name || '').toLowerCase();
      if (name === 'fc1' || name.includes('fc1') || name === 'w1' || name === 'gate_proj') { child.params = H * I; child.shape = [H, I]; child.details = { ...child.details, weight: `${H}×${I}`, bias: `${I}` }; this._setLeafShapeFromParent(child, H, I); }
      else if (name === 'fc2' || name.includes('fc2') || name === 'w2' || name === 'down_proj') { child.params = I * H; child.shape = [I, H]; child.details = { ...child.details, weight: `${I}×${H}`, bias: `${H}` }; this._setLeafShapeFromParent(child, I, H); }
      else if (name === 'up_proj') { child.params = H * I; child.shape = [H, I]; child.details = { ...child.details, weight: `${H}×${I}`, bias: `${I}` }; this._setLeafShapeFromParent(child, H, I); }
    }
  }

  // Helper: set shape & params on weight/bias leaf children of a projection node
  _setLeafShapeFromParent(parentNode, inDim, outDim) {
    if (!parentNode.children) return;
    for (const child of parentNode.children) {
      const name = (child.name || '').toLowerCase();
      if (name === 'weight' && (!child.shape || (child.params === 0 || child.params === undefined))) {
        child.params = inDim * outDim;
        child.shape = [inDim, outDim];
        child.details = { ...child.details, shape: `${inDim}×${outDim}` };
      } else if (name === 'bias' && (!child.shape || (child.params === 0 || child.params === undefined))) {
        child.params = outDim;
        child.shape = [outDim];
        child.details = { ...child.details, shape: `[${outDim}]` };
      }
    }
  }

  // Build Multi-Modal Projector subtree from safetensors
  _buildProjectorFromSafetensors(projectorKeys, wm) {
    if (projectorKeys.length === 0) return null;
    const vc = this.vc;
    const outHidden = vc.out_hidden_size || vc.projection_dim || this.H;
    const visH = vc.hidden_size || 1280;
    const spatialMerge = vc.spatial_merge_size || 2;

    const projTree = {
      name: 'Multi-Modal Projector', type: 'projector', icon: '🔗', params: 0,
      details: { in: visH, out: outHidden, merge: spatialMerge, act: vc.hidden_act || 'gelu' },
      children: []
    };

    // Build trie from projector keys
    const projRoot = { children: {}, isLeaf: false };
    for (const key of projectorKeys) {
      const stripped = key.replace(/^model\.multi_modal_projector\./, '').replace(/^model\.projector\./, '').replace(/^model\.patch_merge_mlp\./, '').replace(/^model\.aligner\./, '').replace(/^multi_modal_projector\./, '').replace(/^patch_merge_mlp\./, '').replace(/^projector\./, '').replace(/^aligner\./, '');
      const parts = stripped.split('.');
      let node = projRoot;
      for (const p of parts) {
        if (!node.children[p]) node.children[p] = { children: {}, isLeaf: false };
        node = node.children[p];
      }
      node.isLeaf = true;
      node.shard = wm[key];
    }

    // Build children
    const childKeys = Object.keys(projRoot.children || {});
    for (const key of childKeys) {
      const child = projRoot.children[key];
      const childNode = this._trieToNode(this._humanize(key), child, key, 2);
      childNode._trieKey = key;
      // Infer projector params — handle all common naming conventions
      const k = key.toLowerCase();
      const mergedIn = visH * spatialMerge * spatialMerge;
      // Input projection: gate_proj / w1 / linear_1 / fc1 (visH→out or merged→visH)
      if (k === 'gate_proj' || k === 'w1' || k.includes('linear_1') || k.includes('fc1')) {
        const projIn = k === 'gate_proj' || k === 'w1' ? mergedIn : mergedIn;
        childNode.params = projIn * visH;
        childNode.shape = [projIn, visH];
        childNode.type = 'ffn'; childNode.icon = '🚪';
        childNode.details = { weight: `${projIn}×${visH}`, bias: `${visH}` };
        this._setProjectorLeafParams(childNode, projIn, visH);
      }
      // Hidden projection: up_proj / w3
      else if (k === 'up_proj' || k === 'w3') {
        childNode.params = mergedIn * visH;
        childNode.shape = [mergedIn, visH];
        childNode.type = 'ffn'; childNode.icon = '⬆';
        childNode.details = { weight: `${mergedIn}×${visH}`, bias: `${visH}` };
        this._setProjectorLeafParams(childNode, mergedIn, visH);
      }
      // Output projection: down_proj / w2 / linear_2 / fc2 (visH→outHidden)
      else if (k === 'down_proj' || k === 'w2' || k.includes('linear_2') || k.includes('fc2')) {
        childNode.params = visH * outHidden;
        childNode.shape = [visH, outHidden];
        childNode.type = 'ffn'; childNode.icon = '⬇';
        childNode.details = { weight: `${visH}×${outHidden}`, bias: `${outHidden}` };
        this._setProjectorLeafParams(childNode, visH, outHidden);
      }
      // Norm within projector
      else if (k.includes('norm') || k.includes('layernorm')) {
        childNode.params = visH;
        childNode.shape = [visH];
        childNode.type = 'norm'; childNode.icon = '📊';
        childNode.details = { type: 'rms' };
      }
      // Merger / patch_merge
      else if (k.includes('merger') || k.includes('merge')) {
        childNode.params = mergedIn * outHidden;
        childNode.shape = [mergedIn, outHidden];
        childNode.type = 'projector'; childNode.icon = '🔗';
        childNode.details = { weight: `${mergedIn}×${outHidden}` };
      }
      else {
        childNode.type = 'module'; childNode.icon = '📦';
      }
      projTree.children.push(childNode);
    }

    return projTree;
  }

  // Set params on projector leaf children (weight, bias)
  _setProjectorLeafParams(parentNode, inDim, outDim) {
    if (!parentNode.children) return;
    for (const child of parentNode.children) {
      const name = (child.name || '').toLowerCase();
      if (name === 'weight') {
        child.params = inDim * outDim;
        child.shape = [inDim, outDim];
        child.details = { ...child.details, shape: `${inDim}×${outDim}` };
      } else if (name === 'bias') {
        child.params = outDim;
        child.shape = [outDim];
        child.details = { ...child.details, shape: `[${outDim}]` };
      }
    }
  }

  // Inject config-level semantic details into the Model node
  _enrichTopLevel(tree) {
    const c = this.config;
    // Count layer types from _layerMeta
    const csaCount = this._layerMeta.filter(m => m.attnType === 'CSA').length;
    const hcaCount = this._layerMeta.filter(m => m.attnType === 'HCA').length;
    const swaCount = this._layerMeta.filter(m => m.attnType === 'SWA').length;
    const dsaCount = this._layerMeta.filter(m => m.isDSA).length;
    const denseMlp = this._layerMeta.filter(m => m.isDenseMLP).length;
    const sparseMlp = this._layerMeta.filter(m => m.isMoELayer).length;
    const fullIdx = this.indexerTypes.filter(t => t === 'full').length;
    const sharedIdx = this.indexerTypes.filter(t => t === 'shared').length;

    tree.details = {
      ...tree.details,
      model_type: c.model_type,
      architectures: (c.architectures || []).join(', '),
      hidden_size: this.H, num_layers: this.L, attention_heads: this.A,
      kv_heads: this.KV, head_dim: this.headDim,
      intermediate_size: this.I, vocab_size: this.V,
      max_context: c.max_position_embeddings,
      dtype: c.dtype || c.torch_dtype || 'float32',
      // MoE
      is_moe: this.isMoE, num_experts: this.numExperts,
      experts_per_tok: this.expertsPerTok, moe_intermediate_size: this.moeI,
      n_shared_experts: this.numSharedExp, shared_expert_size: this.sharedExpI,
      first_k_dense_replace: this.firstKDense, routed_scaling_factor: this.routedScale,
      scoring_func: this.scoringFunc, norm_topk_prob: this.normTopkProb,
      // Low-rank attention
      q_lora_rank: this.qLora, kv_lora_rank: this.kvLora,
      qk_nope_head_dim: this.qkNope, qk_rope_head_dim: this.qkRope,
      v_head_dim: this.vHead,
      o_lora_rank: this.oLoraR, o_groups: this.oGroups,
      rope_theta: this.ropeTheta,
      // Indexer
      index_n_heads: this.idxN, index_head_dim: this.idxHead, index_topk: this.idxTopk,
      param_sink_number: this.paramSink,
      // Per-layer type summary
      csa_layers: csaCount, hca_layers: hcaCount, swa_layers: swaCount,
      dsa_layers: dsaCount,
      dense_mlp_layers: denseMlp, sparse_mlp_layers: sparseMlp,
      full_indexer_layers: fullIdx, shared_indexer_layers: sharedIdx,
      hybrid_attention: csaCount + hcaCount + swaCount > 0 || dsaCount > 0,
      // MHC / Hyper-connection
      use_mhc: this.useMHC, mhc_num_stream: this.mhcStreams,
      use_hyper_connection: this.useHyperConn, hc_mult: this.hcMult,
      // Other
      sliding_window: this.slidingWindow, sandwich_norm: this.sandwichNorm,
      mtp_layers: this.mtpLayers, tie_embeddings: this.tieEmbed,
      multimodal: this.isVLM,
      quantization: this.quantMethod,
      compress_ratios: this.compressRatios.length > 0 ? `[${this.compressRatios.slice(0,4).join(', ')}, ...] (${this.compressRatios.length} entries)` : '',
    };
    // Remove empty fields
    for (const k of Object.keys(tree.details)) {
      if (tree.details[k] === '' || tree.details[k] === 0 || tree.details[k] === false) {
        if (k !== 'is_moe' && k !== 'tie_embeddings' && k !== 'multimodal' && k !== 'norm_topk_prob') delete tree.details[k];
      }
    }
  }

  // Flatten shell layers: remove "model" and "layers" intermediate nodes
  // and hoist their children directly under the root.
  _flattenShells(tree) {
    if (!tree.children) return;
    const hoisted = [];
    for (const child of tree.children) {
      // If child is a "model" or "layers" shell, hoist its grandchildren
      const isShell = (child.name === 'model' || child.name === 'Model') ||
        (child.type === 'module' && child.children && child.children.length > 0 &&
         child.children.every(gc => gc.isLayerGroup || gc.type === 'encoder' || gc.type === 'head' || gc.type === 'norm' || gc.type === 'embedding' || gc.type === 'output'));
      if (isShell && child.children && child.children.length > 0) {
        // Recursively flatten this child too (it might have a "layers" sub-shell)
        this._flattenShells(child);
        for (const gc of child.children) hoisted.push(gc);
      } else {
        // Not a shell — but might contain shells inside (e.g. "layers" inside "model")
        // Check if this child is itself a layers-shell
        if ((child.name === 'layers' || child.name === 'Layers') && child.children && child.children.length > 0) {
          for (const gc of child.children) hoisted.push(gc);
        } else {
          hoisted.push(child);
        }
      }
    }
    tree.children = hoisted;
  }

  // Reorder top-level children after reversal: output side on top, input side on bottom
  // VLM: Language Model → MTP → LM Head → norm → Transformer Layers → Embeddings → Multi-Modal Projector → Vision Encoder
  // Standard: MTP Head → LM Head → norm → Transformer Layers → Embeddings → (others)
  _reorderTopLevel(tree) {
    if (!tree.children) return;
    // For VLM models, language model goes on top (output side), vision on bottom (input side)
    const order = this.isVLM
      ? ['mtp', 'output', 'head', 'norm', 'encoder', 'model', 'embedding', 'projector', 'vision']
      : ['mtp', 'output', 'head', 'norm', 'encoder', 'embedding'];
    const buckets = {};
    const extras = [];
    for (const c of tree.children) {
      const idx = order.indexOf(c.type);
      if (idx >= 0) {
        if (!buckets[c.type]) buckets[c.type] = [];
        buckets[c.type].push(c);
      } else {
        extras.push(c);
      }
    }
    const ordered = [];
    for (const t of order) {
      if (buckets[t]) ordered.push(...buckets[t]);
    }
    ordered.push(...extras);
    tree.children = ordered;
  }

  // Names that are raw tensor leaves — not structural modules
  _isTensorLeafName(name) {
    const n = name.toLowerCase();
    return n === 'weight' || n === 'bias' || n === 'weight_scale_inv' ||
      n === 'weight_scale' || n === 'scales' || n === 'qweight' ||
      n === 'qzeros' || n === 'g_idx' || n === 'e_score_correction_bias' ||
      n === 'a_log' || n === 'dt_bias' || n === 'dt' ||
      n === 'norm_gamma' || n === 'branch_alpha' || n === 'branch_beta' ||
      n === 'branch_alpha_pre' || n === 'branch_beta_pre';
  }

  _trieToNode(displayName, trieNode, pathPrefix, depth) {
    const allChildKeys = Object.keys(trieNode.children || {});
    // Filter out raw tensor leaf children (weight, bias, quantization scales, etc.)
    // These are not structural modules — their info is already captured by the parent's shape/params
    const childKeys = allChildKeys.filter(k => {
      const child = trieNode.children[k];
      // If this child has its own children, it's a structural module — keep it
      if (child.children && Object.keys(child.children).length > 0) return true;
      // If it's a leaf with only a shard, skip it unless it's a named module we want to show
      if (child.isLeaf) return !this._isTensorLeafName(k);
      return true;
    });
    const node = { name: displayName, type: 'module', icon: '📦', params: 0, details: {}, children: [] };

    // Detect numeric layer groups (consecutive indices with same structure)
    // Split into regular layers (0..L-1) and MTP/NextN layers (L..)
    const allNumericKeys = childKeys.filter(k => /^\d+$/.test(k)).sort((a, b) => parseInt(a) - parseInt(b));
    // Check if this is an expert container (not a layer container)
    // "Experts", "Sparse MoE", "block_sparse_moe" all contain experts
    const isExpertGroup = displayName.toLowerCase().includes('expert') || displayName.toLowerCase().includes('sparse moe');
    const numericKeys = isExpertGroup ? allNumericKeys : allNumericKeys.filter(k => parseInt(k) < this.L);
    const mtpKeys = isExpertGroup ? [] : allNumericKeys.filter(k => parseInt(k) >= this.L);
    if (numericKeys.length > 3) {
      // Build semantic layer group name + details from config
      const attnTypes = new Set(), mlpTypes = new Set();
      for (const nk of numericKeys) {
        const m = this._getLayerMeta(parseInt(nk));
        // Detect from trie structure if meta has no attnType
        if (m.attnType) attnTypes.add(m.attnType);
        else {
          const child = trieNode.children[nk];
          const hasQKV = child.children && child.children.self_attn && child.children.self_attn.children &&
            (child.children.self_attn.children.q_a_proj || child.children.self_attn.children.kv_a_proj_with_mqa);
          if (hasQKV && this.qLora > 0) attnTypes.add('DSA');
          else if (child.children && child.children.linear_attn) attnTypes.add('Linear');
          else attnTypes.add('Full');
        }
        if (m.mlpType) mlpTypes.add(m.mlpType);
      }
      const attnStr = [...attnTypes].join('/') || 'Full';
      const mlpStr = mlpTypes.size > 0 ? [...mlpTypes].join('/') : (this.isMoE ? 'Dense+MoE' : 'Dense');
      const grpName = isExpertGroup
        ? `Experts (${numericKeys.length})`
        : `Transformer Layers (${numericKeys.length}, ${attnStr} + ${mlpStr})`;
      const grpDetails = isExpertGroup ? {
        experts: numericKeys.length, experts_per_tok: this.expertsPerTok,
        scoring_func: this.scoringFunc, routed_scaling: this.routedScale,
        norm_topk_prob: this.normTopkProb,
      } : {
        layers: numericKeys.length, hidden_size: this.H, attention_heads: this.A,
        kv_heads: this.KV, head_dim: this.headDim,
        hybrid_attention: attnTypes.size > 1,
        is_moe: this.isMoE, num_experts: this.numExperts, experts_per_tok: this.expertsPerTok,
      };
      if (!isExpertGroup) {
        if (this.qLora > 0) { grpDetails.q_lora_rank = this.qLora; grpDetails.kv_lora_rank = this.kvLora; }
        if (this.oLoraR > 0) { grpDetails.o_lora_rank = this.oLoraR; grpDetails.o_groups = this.oGroups; }
        if (this.idxN > 0) { grpDetails.index_n_heads = this.idxN; grpDetails.index_topk = this.idxTopk; }
        if (this.useMHC) grpDetails.has_mhc = true;
        if (this.useHyperConn) grpDetails.has_hyper_connection = true;
      }
      const groupNode = {
        name: grpName, type: isExpertGroup ? 'moe' : 'encoder', icon: isExpertGroup ? '🎲' : '🔄',
        isLayerGroup: true, layerCount: numericKeys.length, params: 0, details: grpDetails, children: []
      };
      // For large expert counts, cap the number of individual expert nodes
      // to avoid performance issues (memory, rendering, GC pressure)
      // The total params are still calculated correctly using the full count.
      const MAX_EXPERT_NODES = isExpertGroup ? 64 : Infinity;
      const expertKeys = isExpertGroup ? numericKeys.slice(0, MAX_EXPERT_NODES) : [];
      const remainingExpertCount = isExpertGroup ? Math.max(0, numericKeys.length - MAX_EXPERT_NODES) : 0;
      // Determine layer type from first
      for (const nk of numericKeys) {
        const child = trieNode.children[nk];
        if (isExpertGroup) {
          if (expertKeys.includes(nk)) {
            // Build expert as simple module node with gate_proj/up_proj/down_proj
            const expertNode = this._trieToNode(`Expert ${nk}`, child, pathPrefix, depth + 1);
            expertNode._trieKey = nk;
            expertNode.type = 'moe'; expertNode.icon = '🎯';
            // Set params on expert's leaf projections (gate_proj, up_proj, down_proj)
            this._setLeafParams(expertNode, parseInt(nk), '', false, false, true, this.moeI);
            groupNode.children.push(expertNode);
          }
          // Skip creating nodes for experts beyond the cap — params are computed mathematically
        } else {
          const hasLinear = Object.keys(child.children).some(k => k === 'linear_attn');
          const hasSelf = Object.keys(child.children).some(k => k === 'self_attn');
          const hasMoE = this._hasMoE(child);
          const layerType = hasLinear ? 'linear' : (hasSelf ? 'full' : 'unknown');
          const layerNode = this._buildLayerFromTrie(parseInt(nk), child, layerType, hasMoE);
          layerNode._trieKey = nk;
          groupNode.children.push(layerNode);
        }
      }
      // Add a summary node for remaining experts (beyond the cap)
      if (isExpertGroup && remainingExpertCount > 0) {
        const perExp = 3 * this.H * (this.moeI || this.I);
        groupNode.children.push({
          name: `... (${remainingExpertCount} more experts)`, type: 'moe', icon: '⚖',
          params: remainingExpertCount * perExp,
          details: { note: `Each expert has identical structure: gate [${this.H}×${this.moeI}], up [${this.H}×${this.moeI}], down [${this.moeI}×${this.H}]`, per_expert_params: perExp }
        });
      }
      node.children.push(groupNode);
    } else {
      // Render numeric keys individually
      for (const nk of numericKeys) {
        const child = trieNode.children[nk];
        const childNode = this._trieToNode(`Block ${nk}`, child, pathPrefix, depth + 1);
        childNode._trieKey = nk;
        node.children.push(childNode);
      }
    }

    // MTP / NextN layers — separate group
    if (mtpKeys.length > 0) {
      const mtpGroup = {
        name: mtpKeys.length > 1 ? `MTP Head (${mtpKeys.length} layers)` : 'MTP Head', type: 'mtp', icon: '🔮',
        isLayerGroup: true, layerCount: mtpKeys.length, params: 0,
        details: { mtp_layers: mtpKeys.length, num_nextn_predict: this.mtpLayers },
        children: []
      };
      for (const mk of mtpKeys) {
        const child = trieNode.children[mk];
        const hasLinear = Object.keys(child.children).some(k => k === 'linear_attn');
        const hasSelf = Object.keys(child.children).some(k => k === 'self_attn');
        const hasMoE = this._hasMoE(child);
        const layerType = hasLinear ? 'linear' : (hasSelf ? 'full' : 'unknown');
        const layerNode = this._buildLayerFromTrie(parseInt(mk), child, layerType, hasMoE);
        layerNode._trieKey = mk;
        mtpGroup.children.push(layerNode);
      }
      node.children.push(mtpGroup);
    }

    // Non-numeric children
    for (const key of childKeys) {
      if (/^\d+$/.test(key)) continue;
      const child = trieNode.children[key];
      let name = this._humanize(key);
      let type = 'module', icon = '📦';
      const cls = this._classify(key, depth);
      type = cls.type; icon = cls.icon;
      const childNode = this._trieToNode(name, child, key, depth + 1);
      childNode.type = type; childNode.icon = icon;
      childNode._trieKey = key;
      // Infer shape from config for top-level modules
      const topShape = this._inferTopLevelShape(key);
      if (topShape) {
        childNode.shape = topShape.shape;
        childNode.details = { ...childNode.details, ...topShape.details };
        // Set params for top-level modules (embed_tokens, lm_head, norm, etc.)
        if (topShape.params !== undefined) childNode.params = topShape.params;
      }
      node.children.push(childNode);
    }

    // Leaf tensor — only show if it's a named module we want to display
    if (trieNode.isLeaf && node.children.length === 0) {
      node.type = 'tensor'; node.icon = '📐';
      // Infer shape for top-level leaf tensors
      const leafShape = this._inferTopLevelShape(node.name.toLowerCase());
      if (leafShape) { node.shape = leafShape.shape; node.details = { ...node.details, ...leafShape.details }; }
    }
    return node;
  }

  // Infer shape for top-level (non-layer) modules from config
  _inferTopLevelShape(key) {
    const k = key.toLowerCase();
    const H = this.H, V = this.V;
    if (k === 'embed_tokens' || k === 'embedding' || k === 'token embedding' || k === 'embeddings' || k === 'embed') return { shape: [V, H], params: V * H, details: { 'shape': `${V}×${H}`, 'vocab_size': V, 'hidden_size': H }};
    if (k === 'lm_head' || k === 'head' || k === 'output projection') {
      if (this.tieEmbed) return { shape: [H, V], params: 0, details: { 'shape': `${H}×${V}`, 'vocab_size': V, 'hidden_size': H, 'tied_to': 'model.embed_tokens' }};
      return { shape: [H, V], params: H * V, details: { 'shape': `${H}×${V}`, 'vocab_size': V, 'hidden_size': H }};
    }
    if (k === 'norm' || k === 'final_norm' || k === 'final rmsnorm') return { shape: [H], params: H, details: { 'shape': `[${H}]`, 'type': 'rms', 'eps': this.rmsEps }};
    if (k === 'shared_head') return { shape: [H, V], params: H * V + H, details: { 'shape': `${H}×${V}` }};
    if (k === 'merge_mhc_module') return { shape: [H, H], params: H * H, details: { 'type': 'merge_mhc', 'num_streams': this.mhcStreams }};
    // VLM learned parameter vectors (nn.Parameter, shape [H])
    if (k === 'image_start' || k === 'image_end' || k === 'image_newline') return { shape: [H], params: H, details: { 'shape': `[${H}]`, 'type': 'learned_vector' }};
    return null;
  }

  _buildLayerFromTrie(idx, trieNode, layerType, hasMoE) {
    const isLinear = layerType === 'linear';
    const allChildKeys = Object.keys(trieNode.children || {});
    // Filter out raw tensor leaf children (weight, bias, quantization scales, etc.)
    const childKeys = allChildKeys.filter(k => {
      const child = trieNode.children[k];
      if (child.children && Object.keys(child.children).length > 0) return true;
      if (child.isLeaf) return !this._isTensorLeafName(k);
      return true;
    });

    // Detect attention sub-type from tensor names (safetensors ground truth)
    const hasQKVLora = childKeys.some(k => {
      const sub = trieNode.children[k];
      return sub.children && (sub.children.q_a_proj || sub.children.q_a_layernorm || sub.children.kv_a_proj_with_mqa || sub.children.wq_a || sub.children.wq_b || sub.children.wkv);
    });
    const hasIndexerTrie = childKeys.some(k => {
      const sub = trieNode.children[k];
      return sub.children && sub.children.indexer;
    });
    const hasMHC = childKeys.some(k => k === 'attn_mhc_module' || k === 'mlp_mhc_module');
    const hasEhProj = childKeys.some(k => k === 'eh_proj');
    const hasSharedHead = childKeys.some(k => k === 'shared_head');
    const isLowRankDSA = hasQKVLora && this.qLora > 0;

    // Fuse config per-layer semantic metadata
    const meta = this._getLayerMeta(idx);
    const isDenseMLP = meta.isDenseMLP;
    // Use config meta when available, fallback to trie detection for MoE
    const isMoELayer = meta.isMoELayer !== undefined ? meta.isMoELayer : hasMoE;
    const effI = meta.effI || (hasMoE ? this.moeI : this.I);

    // Determine attention label — prefer config semantic, fallback to trie detection
    let attnLabel = 'Full Attn';
    if (isLinear) { attnLabel = 'Linear Attn'; }
    else if (meta.attnType) { attnLabel = meta.attnType; }
    else if (isLowRankDSA) { attnLabel = 'DSA (Low-Rank)'; }
    else if (this.dsaLayers.includes(idx)) { attnLabel = 'DSA'; }
    else if (this.swaLayers.includes(idx)) { attnLabel = `SWA (w=${this.slidingWindow || 512})`; }

    const mlpLabel = isMoELayer ? `MoE (${this.numExperts} exp, top-${this.expertsPerTok})` : 'Dense MLP';

    // MTP / NextN layers — special label
    const isMTPLayer = meta.isMTP || (idx >= this.L);
    const layerLabel = isMTPLayer ? `MTP Layer ${idx - this.L}` : `Layer ${idx}`;

    // Rich details from config fusion
    const details = {
      attention_type: attnLabel,
      mlp_type: mlpLabel,
      hidden_size: this.H, intermediate_size: effI,
      attention_heads: this.A, kv_heads: this.KV, head_dim: this.headDim,
      has_block_post_ln: meta.hasBlockPostLn, has_mhc: hasMHC, has_indexer: hasIndexerTrie,
    };
    if (isMTPLayer) { details.is_mtp = true; details.mtp_idx = idx - this.L; }
    if (meta.compressRatio !== undefined) details.compress_ratio = meta.compressRatio;
    if (meta.indexerType) details.indexer_type = meta.indexerType;
    if (this.qLora > 0) { details.q_lora_rank = this.qLora; details.kv_lora_rank = this.kvLora; }
    if (this.oLoraR > 0) { details.o_lora_rank = this.oLoraR; details.o_groups = this.oGroups; }
    if (this.qkNope > 0) { details.qk_nope_head_dim = this.qkNope; details.qk_rope_head_dim = this.qkRope; }
    if (this.vHead > 0) details.v_head_dim = this.vHead;
    if (this.ropeTheta > 0) details.rope_theta = this.ropeTheta;
    if (this.slidingWindow > 0) details.sliding_window = this.slidingWindow;
    if (hasEhProj) details.has_hyper_connection = true;
    if (hasSharedHead) details.has_shared_head = true;

    // Remove zero/empty/false values to keep details clean
    for (const k of Object.keys(details)) {
      if (details[k] === '' || details[k] === 0 || details[k] === false) delete details[k];
    }

    const node = {
      name: `${layerLabel} (${attnLabel}, ${mlpLabel})`, type: 'layer', icon: isMTPLayer ? '🎯' : '🔧', params: 0,
      details, children: []
    };

    // Build children with param estimation + classification + shape inference
    for (const key of childKeys) {
      if (/^\d+$/.test(key)) continue;
      const child = trieNode.children[key];
      const cls = this._classifyLayerChild(key, isLinear, isMoELayer, isLowRankDSA);
      const childNode = this._trieToNode(cls.name, child, key, 3);
      childNode.type = cls.type; childNode.icon = cls.icon;
      childNode._trieKey = key;

      // Estimate params: pass config-aware params
      childNode.params = this._estimateChildParams(idx, key, child, isLinear, isLowRankDSA, isMoELayer, effI);

      // Infer shape from config for this child module
      const shapeInfo = this._inferChildShape(idx, key, child, isLinear, isLowRankDSA, isMoELayer, effI);
      if (shapeInfo) {
        childNode.shape = shapeInfo.shape;
        childNode.details = { ...childNode.details, ...shapeInfo.details };
      }

      // Recursively infer shapes for grandchildren (leaf tensors)
      this._inferLeafShapes(child, childNode, idx, key, isLinear, isLowRankDSA, isMoELayer, effI);
      // Set params on leaf projection children (q_proj, gate_proj, etc.)
      this._setLeafParams(childNode, idx, key, isLinear, isLowRankDSA, isMoELayer, effI);

      // MoE: mark experts as layer group
      // V4.1 uses 'ffn' as the MoE container (contains experts + gate + shared_experts)
      if (key === 'experts' || key === 'block_sparse_moe' || key === 'sparse_moe' || (key === 'ffn' && child.children && child.children.experts)) {
        // For block_sparse_moe/sparse_moe/ffn, the experts are nested inside
        const expContainer = (key === 'block_sparse_moe' || key === 'sparse_moe' || key === 'ffn')
          ? (child.children?.experts || child.children)
          : child.children;
        const expNums = Object.keys(expContainer || {}).filter(k => /^\d+$/.test(k));
        if (expNums.length > 3) {
          childNode.isLayerGroup = true;
          childNode.layerCount = this.numExperts || expNums.length;
          childNode.name = `Experts (${childNode.layerCount})`;
          childNode.type = 'moe'; childNode.icon = '🎲';
          childNode.details = { ...childNode.details,
            experts_per_tok: this.expertsPerTok, scoring_func: this.scoringFunc,
            routed_scaling: this.routedScale, norm_topk_prob: this.normTopkProb,
            container: key,
          };
          // Set params on experts with w1/w2/w3 naming
          this._setMoEExpertParams(childNode, key === 'block_sparse_moe' || key === 'sparse_moe');
        }
      }
      // Shared experts
      if (key === 'shared_experts' || key === 'shared_expert') {
        childNode.details = { ...childNode.details, intermediate_size: this.sharedExpI, hidden_size: this.H };
      }
      // Indexer: add config semantic details
      if (key === 'indexer' || (child.children && child.children.indexer)) {
        childNode.details = { ...childNode.details,
          n_heads: this.idxN, head_dim: this.idxHead, topk: this.idxTopk,
          indexer_type: meta.indexerType || '',
          note: meta.indexerType === 'shared' ? 'weights shared across layers' : (meta.indexerType === 'full' ? 'own weights per layer' : 'sparse top-k selection'),
        };
      }
      // Compressor (DeepSeek-V4: present when compress_ratio > 0)
      if (key === 'compressor' || (child.children && (child.children.compressor || child.children.compress))) {
        childNode.details = { ...childNode.details,
          compress_ratio: meta.compressRatio || 0,
          note: meta.compressRatio === 4 ? 'CSA: light compress + sparse index' : meta.compressRatio >= 128 ? 'HCA: heavy compress + dense attn' : 'KV compression',
        };
      }
      // MHC module: add stream count
      if (key === 'attn_mhc_module' || key === 'mlp_mhc_module') {
        childNode.details = { ...childNode.details, num_streams: this.mhcStreams, type: 'mhc' };
      }
      // eh_proj: hyper-connection
      if (key === 'eh_proj') {
        childNode.details = { ...childNode.details, type: 'hyper_connection', note: 'learnable skip connection' };
      }
      // shared_head
      if (key === 'shared_head') {
        childNode.details = { ...childNode.details, note: 'shared attention head across layers' };
      }
      node.children.push(childNode);
    }
    // Reorder children to input→output flow (resist _reverseTree which would scramble them)
    this._reorderLayerChildren(node, isMTPLayer);
    return node;
  }

  // Reorder layer internal children to input→output order
  _reorderLayerChildren(node, isMTPLayer) {
    if (!node.children || node.children.length <= 1) return;
    // Standard transformer layer order (input→output):
    // input_layernorm → self_attn → post_attention_layernorm → mlp/block_sparse_moe → (optional: block_post_layernorm)
    // MTP layer adds: eh_proj, enorm, hnorm, shared_head, embed_tokens at the end (output side)
    const order = [
      'input_layernorm', 'norm1', 'attn_norm', 'self_attn', 'attn', 'linear_attn', 'attn_mhc_module',
      'post_attention_layernorm', 'norm2', 'ffn_norm', 'mlp', 'ffn', 'feed_forward', 'block_sparse_moe', 'sparse_moe', 'mlp_mhc_module',
      'block_post_layernorm',
      'engram',
      // MTP-specific (output side)
      'embed_tokens', 'eh_proj', 'enorm', 'hnorm', 'shared_head', 'main_norm', 'main_proj',
      // Extra fallback for anything else
    ];
    const keyOrder = {};
    order.forEach((k, i) => { keyOrder[k] = i; });
    const nextIdx = order.length;
    node.children.sort((a, b) => {
      const ka = (a._trieKey || '').toLowerCase();
      const kb = (b._trieKey || '').toLowerCase();
      const ia = keyOrder[ka] !== undefined ? keyOrder[ka] : nextIdx;
      const ib = keyOrder[kb] !== undefined ? keyOrder[kb] : nextIdx;
      if (ia !== ib) return ia - ib;
      // Keep original relative order for unknowns
      return 0;
    });
  }

  _estimateChildParams(layerIdx, key, trieNode, isLinear, isLowRank, isMoE, effI) {
    const H = this.H, A = this.A, KV = this.KV, hd = this.headDim;
    const I = effI || (isMoE ? this.moeI : this.I);
    // Collect all leaf tensor names under this node
    const tensors = this._collectLeafNames(trieNode, key);
    let total = 0;
    // Track shared_experts to count once, not per-tensor
    let sharedExpDone = false;
    // Engram tracking is instance-level (this._engramCounted) to prevent
    // double-counting when engram appears in multiple layers (V4.1: layers 1 & 14)
    // For MTP layers, use dspark MoE config if available
    const isMTPLayer = layerIdx >= this.L;
    const effectiveNumExperts = isMTPLayer ? (this.config.dspark_n_routed_experts || this.numExperts) : this.numExperts;
    for (const t of tensors) {
      // Skip quantization scales and bias tensors — not weight params
      if (t.endsWith('weight_scale_inv') || t.endsWith('e_score_correction_bias') ||
          t.endsWith('g_idx') || t.endsWith('qweight') || t.endsWith('qzeros') ||
          t.endsWith('scales') || t.endsWith('bias')) continue;
      // Use the full path for matching — the module name is usually the
      // second-to-last segment (e.g. "q_a_proj" in "q_a_proj.weight")
      const parts = t.split('.');
      const last = parts[parts.length - 1];
      const modName = last === 'weight' ? parts[parts.length - 2] || '' : last;
      // Build full path including the parent key for context-aware matching
      const fullPath = (key + '.' + t).toLowerCase();

      if (isLowRank) {
        // DSA / MLA low-rank attention — precise formulas from config
        // V4/V4.1 naming: wq_a, wq_b, wkv, wo_a, wo_b
        // V3 naming: q_a_proj, q_b_proj, kv_a_proj_with_mqa, kv_b_proj, o_proj
        if (modName === 'q_a_proj' || fullPath.includes('q_a_proj') || modName === 'wq_a' || fullPath.includes('wq_a')) total += H * this.qLora;
        else if (modName === 'q_b_proj' || fullPath.includes('q_b_proj') || modName === 'wq_b' || fullPath.includes('wq_b')) {
          if (!fullPath.includes('indexer')) total += this.qLora * A * (this.qkNope + this.qkRope);
        }
        else if (fullPath.includes('kv_a_proj')) total += H * (this.kvLora + this.qkRope);
        else if (fullPath.includes('kv_b_proj')) total += this.kvLora * A * (this.qkNope + this.vHead);
        else if (modName === 'wkv' || fullPath.includes('wkv.')) total += H * this.headDim;
        else if ((modName === 'o_proj' || fullPath.includes('o_proj')) && !fullPath.includes('wo_')) total += A * (this.qkNope + this.qkRope) * H;
        else if (fullPath.includes('q_a_layernorm')) total += this.qLora;
        else if (fullPath.includes('kv_a_layernorm')) total += this.kvLora;
        // Indexer
        else if (fullPath.includes('indexer') && modName === 'weight') total += this.qLora * this.idxN * this.idxHead;
        else if (fullPath.includes('weights_proj')) total += this.idxN * this.idxHead * A;
        else if (fullPath.includes('k_norm') || fullPath.includes('wq_b') || fullPath.includes('wk')) total += (this.kvLora + this.qkRope) * this.idxN * this.idxHead;
        // Convolutions
        else if (fullPath.includes('compresskv_conv')) total += H * H;
        else if (modName === 'o_conv') total += H * H;
        else if (modName === 'qa_conv') total += this.qLora * this.qLora;
        // Param sink
        else if (fullPath.includes('param_sink')) total += this.paramSink * (A * this.vHead + this.qkRope);
        // Norms (generic — match by fullPath)
        else if (fullPath.includes('layernorm') || (fullPath.includes('norm') && !fullPath.includes('mhc'))) {
          // q_a_layernorm/kv_a_layernorm already handled above
          if (!fullPath.includes('q_a_') && !fullPath.includes('kv_a_')) total += H;
        }
        // MHC / hyper-connection
        else if (modName === 'phi' || modName === 'eh_proj') total += H * H;
        else if (fullPath.includes('branch_alpha') || fullPath.includes('branch_beta')) total += this.mhcStreams;
        else if (fullPath.includes('norm_gamma')) total += H;
        // Shared head
        else if (fullPath.includes('shared_head')) total += H * H + H;
        // DeepSeek-V4 grouped output (wo_a / wo_b)
        else if (modName === 'wo_a' || fullPath.includes('wo_a')) total += A * hd * this.oLoraR;
        else if (modName === 'wo_b' || fullPath.includes('wo_b')) total += this.oLoraR * (this.oGroups || 1) * H;
        // Attention sink (V4.1: attn_sink tensor)
        else if (fullPath.includes('attn_sink')) total += A;
        // HC modules (V4.1: hc_attn_fn/hc_ffn_fn are [24, H*hcMult])
        else if (fullPath.includes('hc_attn_fn') || fullPath.includes('hc_ffn_fn')) total += 24 * H * (this.hcMult || 4);
        else if (fullPath.includes('hc_attn_base') || fullPath.includes('hc_ffn_base')) total += 24;
        else if (fullPath.includes('hc_attn_scale') || fullPath.includes('hc_ffn_scale')) total += 3;
        // Standard MLP (inside MoE experts or shared expert)
        else if (modName === 'gate_proj' || modName === 'w1') total += H * I;
        else if (modName === 'up_proj' || modName === 'w3') total += H * I;
        else if (modName === 'down_proj' || modName === 'w2') total += I * H;
        // Gate router
        else if (modName === 'gate' && fullPath.includes('experts')) total += H * effectiveNumExperts;
        // Shared experts — count all 3 projections at once (avoid triple count)
        else if ((fullPath.includes('shared_experts') || fullPath.includes('shared_expert')) && !sharedExpDone) {
          total += 3 * H * (this.sharedExpI || I);
          sharedExpDone = true;
        }
        else if (modName === 'e_proj') total += H * H;
        else if (fullPath.includes('hc_head') || fullPath.includes('hc_attn') || fullPath.includes('hc_ffn')) total += H;
        // Engram embedding (V4.1: massive n-gram memory table)
        // engram_num_embeddings is an array indexed by engram layer position
        // e.g. [384006168, 384016682] for layers 1 and 14
        else if (fullPath.includes('engram') && (modName === 'weight' || modName === 'embed')) {
          if (!this._engramCounted) {
            const engramSizes = this.config.engram_num_embeddings || [];
            const eDim = this.config.engram_head_dim || 256;
            if (engramSizes.length > 0) {
              // Sum all engram embedding tables (one per engram layer)
              total += engramSizes.reduce((s, n) => s + n, 0) * eDim;
            } else {
              // Fallback: use engram_vocab_size
              total += (this.config.engram_vocab_size || 0) * eDim;
            }
            this._engramCounted = true;
          }
        }
        else if (fullPath.includes('engram') && modName === 'wkv') total += (this.config.engram_n_heads || 8) * (this.config.engram_head_dim || 256) * (this.config.engram_head_dim || 256) * 2;
        else if (fullPath.includes('engram') && (modName === 'q_weight' || modName === 'k_weight')) total += (this.config.engram_n_heads || 8) * (this.config.engram_head_dim || 256);
      } else if (isLinear) {
        // Mamba SSM linear attention
        const linKH = this.linKH || A, linVH = this.linVH || A;
        const keyDim = this.linKeyDim || hd, valDim = this.linValDim || hd;
        const qkvOut = linKH * keyDim, vOut = linVH * valDim, zOut = linVH * valDim;
        if (fullPath.includes('in_proj_qkv')) total += H * qkvOut;
        else if (fullPath.includes('in_proj_a')) total += H * qkvOut;
        else if (fullPath.includes('in_proj_b')) total += H * vOut;
        else if (fullPath.includes('in_proj_z')) total += H * zOut;
        else if (modName === 'conv1d') total += this.convK * qkvOut;
        else if (modName === 'a_log') total += linKH * keyDim;
        else if (modName === 'dt_bias' || modName === 'dt') total += linKH;
        else if (fullPath.includes('norm') && !fullPath.includes('mhc')) total += linVH * valDim;
        else if (fullPath.includes('out_proj')) total += zOut * H;
        else if (fullPath.includes('layernorm')) total += H;
        // MLP inside linear layer
        else if (modName === 'gate_proj') total += H * I;
        else if (modName === 'up_proj') total += H * I;
        else if (modName === 'down_proj') total += I * H;
        else if (modName === 'eh_proj' || modName === 'phi') total += H * H;
      } else {
        // Standard attention or generic
        if (modName === 'q_proj' || fullPath.includes('q_proj')) total += H * (A * hd);
        else if (modName === 'k_proj' || fullPath.includes('k_proj')) total += H * (KV * hd);
        else if (modName === 'v_proj' || fullPath.includes('v_proj')) total += H * (KV * hd);
        else if (modName === 'o_proj' || fullPath.includes('o_proj')) total += (A * hd) * H;
        // QK norms (MiniMax-M3: per-head q_norm, k_norm)
        else if (modName === 'q_norm' || fullPath.includes('q_norm')) total += A * hd;
        else if (modName === 'k_norm' || fullPath.includes('k_norm')) total += KV * hd;
        // Sparse attention index projections (MiniMax-M3)
        else if (fullPath.includes('index_q_proj')) total += H * (this.sparseAttnCfg.sparse_num_index_heads || 4) * (this.sparseAttnCfg.sparse_index_dim || 128);
        else if (fullPath.includes('index_k_proj')) total += H * (this.sparseAttnCfg.sparse_num_index_heads || 4) * (this.sparseAttnCfg.sparse_index_dim || 128);
        else if (fullPath.includes('index_q_norm') || fullPath.includes('index_k_norm')) total += (this.sparseAttnCfg.sparse_num_index_heads || 4) * (this.sparseAttnCfg.sparse_index_dim || 128);
        // MLP projections
        else if (modName === 'gate_proj' || modName === 'w1') total += H * I;
        else if (modName === 'up_proj' || modName === 'w3') total += H * I;
        else if (modName === 'down_proj' || modName === 'w2') total += I * H;
        // MoE gate/router
        else if (modName === 'gate' && fullPath.includes('sparse_moe')) total += H * effectiveNumExperts;
        else if (modName === 'gate' && fullPath.includes('experts')) total += H * effectiveNumExperts;
        else if (modName === 'gate') total += H * (effectiveNumExperts || 1);
        else if ((fullPath.includes('norm') || fullPath.includes('layernorm')) && !fullPath.includes('mhc') && !fullPath.includes('index')) total += H;
        else if ((fullPath.includes('shared_experts') || fullPath.includes('shared_expert')) && !sharedExpDone) {
          total += 3 * H * (this.sharedExpI || this.sharedInterI || I);
          sharedExpDone = true;
        }
        else if (modName === 'phi' || modName === 'eh_proj') total += H * H;
        else if (fullPath.includes('branch_alpha') || fullPath.includes('branch_beta')) total += this.mhcStreams;
        else if (modName === 'e_proj') total += H * H;
        else if (modName === 'wo_a' || fullPath.includes('wo_a')) total += A * hd * this.oLoraR;
        else if (modName === 'wo_b' || fullPath.includes('wo_b')) total += this.oLoraR * (this.oGroups || 1) * H;
        else if (fullPath.includes('attn_sink')) total += A;
        // HC modules (V4.1: hc_attn_fn/hc_ffn_fn are [24, H*hcMult])
        else if (fullPath.includes('hc_attn_fn') || fullPath.includes('hc_ffn_fn')) total += 24 * H * (this.hcMult || 4);
        else if (fullPath.includes('hc_attn_base') || fullPath.includes('hc_ffn_base')) total += 24;
        else if (fullPath.includes('hc_attn_scale') || fullPath.includes('hc_ffn_scale')) total += 3;
        // V4.1 low-rank attention fallback (when isLowRank not detected but wq_a/wq_b/wkv exist)
        else if (modName === 'wq_a' || fullPath.includes('wq_a')) total += H * this.qLora;
        else if (modName === 'wq_b' || fullPath.includes('wq_b')) { if (!fullPath.includes('indexer')) total += this.qLora * A * (this.qkNope + this.qkRope); }
        else if (modName === 'wkv' || fullPath.includes('wkv.')) total += H * this.headDim;
        else if (fullPath.includes('hc_head') || fullPath.includes('hc_attn') || fullPath.includes('hc_ffn')) total += H;
        // Engram embedding (V4.1: massive n-gram memory table)
        // engram_num_embeddings is an array indexed by engram layer position
        else if (fullPath.includes('engram') && (modName === 'weight' || modName === 'embed')) {
          if (!this._engramCounted) {
            const engramSizes = this.config.engram_num_embeddings || [];
            const eDim = this.config.engram_head_dim || 256;
            if (engramSizes.length > 0) {
              total += engramSizes.reduce((s, n) => s + n, 0) * eDim;
            } else {
              total += (this.config.engram_vocab_size || 0) * eDim;
            }
            this._engramCounted = true;
          }
        }
        else if (fullPath.includes('engram') && modName === 'wkv') total += (this.config.engram_n_heads || 8) * (this.config.engram_head_dim || 256) * (this.config.engram_head_dim || 256) * 2;
        else if (fullPath.includes('engram') && (modName === 'q_weight' || modName === 'k_weight')) total += (this.config.engram_n_heads || 8) * (this.config.engram_head_dim || 256);
      }
    }
    return total;
  }

  _collectLeafNames(trieNode, prefix) {
    const result = [];
    const walk = (node, path) => {
      if (node.isLeaf) { result.push(path || prefix); return; }
      const children = node.children || {};
      for (const k of Object.keys(children)) {
        walk(children[k], path ? `${path}.${k}` : k);
      }
    };
    walk(trieNode, '');
    return result.length > 0 ? result : [prefix];
  }

  // Infer shape [rows, cols] for a child module from config + tensor key
  _inferChildShape(layerIdx, key, trieNode, isLinear, isLowRank, isMoE, effI) {
    const H = this.H, A = this.A, KV = this.KV, hd = this.headDim;
    const I = effI || (isMoE ? this.moeI : this.I);
    const V = this.V;
    const tp = `model.layers.${layerIdx}`;
    const meta = this._getLayerMeta(layerIdx);

    if (isLowRank) {
      // DSA / MLA low-rank attention — enriched with all sub-tensor shapes
      if (key === 'self_attn') {
        const details = {
          'q_a_proj': `${H}×${this.qLora}`, 'q_b_proj': `${this.qLora}×${A*(this.qkNope+this.qkRope)}`,
          'kv_a_proj_with_mqa': `${H}×${this.kvLora+this.qkRope}`, 'kv_b_proj': `${this.kvLora}×${A*(this.qkNope+this.vHead)}`,
          'o_proj': `${A*(this.qkNope+this.qkRope)}×${H}`,
          'mechanism': meta.attnType ? `${meta.attnType} (low-rank Q + shared KV MQA)` : 'DSA (low-rank Q + shared KV MQA)',
          'q_lora_rank': this.qLora, 'kv_lora_rank': this.kvLora,
          'qk_nope_head_dim': this.qkNope, 'qk_rope_head_dim': this.qkRope,
          'v_head_dim': this.vHead,
        };
        if (this.oLoraR > 0) { details.wo_a = `${A*hd}×${this.oLoraR}`; details.wo_b = `${this.oLoraR}×${H}`; details.o_groups = this.oGroups; }
        if (this.paramSink > 0) { details.param_sink = `${this.paramSink}×${A*this.vHead}`; }
        if (meta.hasIndexer) { details.indexer = `${this.idxN} heads, topk=${this.idxTopk}`; }
        if (meta.hasCompressor) { details.compressor = `ratio=${meta.compressRatio}`; }
        return { shape: [H, A * (this.qkNope + this.qkRope)], details };
      }
    } else if (isLinear) {
      if (key === 'linear_attn') {
        const linKH = this.linKH || A, linVH = this.linVH || A;
        const keyDim = this.linKeyDim || hd, valDim = this.linValDim || hd;
        return { shape: [H, linKH * keyDim], details: {
          'mechanism': 'Mamba SSM (linear attention)',
          'key_heads': linKH, 'value_heads': linVH,
          'key_dim': keyDim, 'value_dim': valDim,
          'conv_kernel': this.convK,
        }};
      }
    } else {
      if (key === 'self_attn') {
        const details = {
          'q_proj': `${H}×${A*hd}`, 'k_proj': `${H}×${KV*hd}`,
          'v_proj': `${H}×${KV*hd}`, 'o_proj': `${A*hd}×${H}`,
          'mechanism': meta.attnType === 'SWA' ? `Sliding Window (w=${this.slidingWindow||512})` : 'Standard Multi-Head Attention',
          'num_heads': A, 'kv_heads': KV, 'head_dim': hd,
        };
        if (this.oLoraR > 0) { details.wo_a = `${A*hd}×${this.oLoraR}`; details.wo_b = `${this.oLoraR}×${H}`; }
        if (this.ropeTheta > 0) details.rope_theta = this.ropeTheta;
        return { shape: [H, A * hd], details };
      }
    }

    if (key === 'mlp' || key === 'feed_forward') {
      const details = {
        'gate_proj': `${H}×${I}`, 'up_proj': `${H}×${I}`, 'down_proj': `${I}×${H}`,
        'intermediate_size': I, 'activation': 'silu (SwiGLU)',
      };
      if (isMoE) { details.is_moe = true; details.num_experts = this.numExperts; details.experts_per_tok = this.expertsPerTok; }
      return { shape: [H, I], details };
    }
    if (key === 'input_layernorm' || key === 'norm1') return { shape: [H], details: { 'eps': this.rmsEps, 'type': 'rms' }};
    if (key === 'post_attention_layernorm' || key === 'norm2') return { shape: [H], details: { 'eps': this.rmsEps, 'type': 'rms' }};
    if (key === 'eh_proj') return { shape: [H, H], details: { 'type': 'hyper_connection', 'note': 'learnable skip connection' }};
    if (key === 'hnorm') return { shape: [H], details: { 'type': 'rms' }};
    if (key === 'enorm') return { shape: [H], details: { 'type': 'rms' }};
    if (key === 'shared_head') return { shape: [H, V], details: { 'note': 'shared attention head across layers' }};
    if (key === 'block_post_layernorm') return { shape: [H], details: { 'type': 'rms' }};
    // Compressor (DeepSeek-V4: CSA/HCA layers)
    if (key === 'compressor') return { shape: [hd, hd], details: { 'compress_ratio': meta.compressRatio||0, 'note': meta.compressRatio===4?'CSA: light compress + sparse index':'HCA: heavy compress + dense attn' }};
    // Indexer (Lightning sparse top-k)
    if (key === 'indexer') return { shape: [this.idxN*this.idxHead, hd], details: { 'n_heads': this.idxN, 'head_dim': this.idxHead, 'topk': this.idxTopk, 'indexer_type': meta.indexerType||'', 'note': 'sparse top-k selection' }};
    // MHC modules
    if (key === 'attn_mhc_module' || key === 'mlp_mhc_module') return { shape: [H, H], details: { 'type': 'mhc', 'num_streams': this.mhcStreams, 'note': 'multi-stream hyper-connection' }};
    if (key === 'merge_mhc_module') return { shape: [H, H], details: { 'type': 'merge_mhc', 'num_streams': this.mhcStreams }};
    // Post/pre MLP norms
    if (key === 'post_mlp_layernorm') return { shape: [H], details: { 'eps': this.rmsEps, 'type': 'rms' }};
    if (key === 'pre_mlp_layernorm') return { shape: [H], details: { 'eps': this.rmsEps, 'type': 'rms' }};

    return null;
  }

  // Recursively walk to leaf tensors and set shape on childNodes
  _inferLeafShapes(trieNode, treeNode, layerIdx, parentKey, isLinear, isLowRank, isMoE, effI) {
    if (!treeNode.children || treeNode.children.length === 0) return;
    const H = this.H, A = this.A, KV = this.KV, hd = this.headDim;
    const I = effI || (isMoE ? this.moeI : this.I);
    const V = this.V;
    const tp = `model.layers.${layerIdx}`;
    const trieChildren = trieNode.children || {};

    for (let i = 0; i < treeNode.children.length; i++) {
      const childNode = treeNode.children[i];
      // Use _trieKey for exact 1:1 matching (set during tree construction)
      const tk = childNode._trieKey;
      if (!tk || !trieChildren[tk]) continue;
      const trieChild = trieChildren[tk];

      // Infer shape from the childNode name pattern
      const leafName = childNode.name.toLowerCase();
      const trieKeyMatch = (childNode._trieKey || '').toLowerCase();
      const details = childNode.details || {};

      if (isLowRank) {
        if (leafName.includes('q_a_proj')) { childNode.shape = [H, this.qLora]; details.shape = `${H}×${this.qLora}`; details.note = 'low-rank Q projection A'; }
        else if (leafName.includes('q_b_proj')) { childNode.shape = [this.qLora, A*(this.qkNope+this.qkRope)]; details.shape = `${this.qLora}×${A*(this.qkNope+this.qkRope)}`; details.note = 'low-rank Q projection B'; }
        else if (leafName.includes('kv_a_proj')) { childNode.shape = [H, this.kvLora+this.qkRope]; details.shape = `${H}×${this.kvLora+this.qkRope}`; details.note = 'KV A (MLA-style, fused RoPE)'; }
        else if (leafName.includes('kv_b_proj')) { childNode.shape = [this.kvLora, A*(this.qkNope+this.vHead)]; details.shape = `${this.kvLora}×${A*(this.qkNope+this.vHead)}`; details.note = 'KV B projection'; }
        else if (leafName.includes('o_proj') && !leafName.includes('wo')) { childNode.shape = [A*(this.qkNope+this.qkRope), H]; details.shape = `${A*(this.qkNope+this.qkRope)}×${H}`; }
        else if (leafName.includes('wo_a')) { childNode.shape = [A*hd, this.oLoraR]; details.shape = `${A*hd}×${this.oLoraR}`; details.note = `grouped output A (${this.oGroups} groups)`; }
        else if (leafName.includes('wo_b')) { childNode.shape = [this.oLoraR, H]; details.shape = `${this.oLoraR}×${H}`; details.note = 'grouped output B'; }
        else if (leafName.includes('q_a_layernorm')) { childNode.shape = [this.qLora]; details.shape = `[${this.qLora}]`; details.type = 'rms'; }
        else if (leafName.includes('kv_a_layernorm')) { childNode.shape = [this.kvLora]; details.shape = `[${this.kvLora}]`; details.type = 'rms'; }
        else if (leafName === 'o_conv') { childNode.shape = [H, H]; details.shape = `${H}×${H}`; details.note = 'output conv'; }
        else if (leafName === 'qa_conv') { childNode.shape = [this.qLora, this.qLora]; details.shape = `${this.qLora}×${this.qLora}`; details.note = 'Q-A conv'; }
        else if (leafName.includes('compresskv_conv') || leafName.includes('compress')) { childNode.shape = [H, H]; details.shape = `${H}×${H}`; details.note = 'KV compression conv'; }
        else if (leafName.includes('param_sink')) { childNode.shape = [this.paramSink, A*this.vHead]; details.shape = `${this.paramSink}×${A*this.vHead}`; details.note = 'param sink'; }
        else if (leafName === 'e_proj' || leafName.includes('e_proj')) { childNode.shape = [H, H]; details.shape = `${H}×${H}`; details.note = 'MTP embedding projection'; }
        // Indexer sub-tensors
        else if (leafName === 'wq_b' || leafName.includes('wq_b')) { childNode.shape = [this.qLora, this.idxN*this.idxHead]; details.shape = `${this.qLora}×${this.idxN*this.idxHead}`; details.note = 'indexer query B'; }
        else if (leafName === 'wk' || leafName.includes(' wk')) { childNode.shape = [this.kvLora+this.qkRope, this.idxN*this.idxHead]; details.shape = `${this.kvLora+this.qkRope}×${this.idxN*this.idxHead}`; details.note = 'indexer key'; }
        else if (leafName.includes('weights_proj')) { childNode.shape = [this.idxN*this.idxHead, hd]; details.shape = `${this.idxN*this.idxHead}×${hd}`; details.note = 'indexer output projection'; }
        else if (leafName.includes('k_norm') && parentKey === 'indexer') { childNode.shape = [this.idxN*this.idxHead]; details.shape = `[${this.idxN*this.idxHead}]`; details.type = 'rms'; }
      } else if (!isLinear) {
        if (leafName === 'q_proj' || leafName.includes('q_proj')) { childNode.shape = [H, A*hd]; details.shape = `${H}×${A*hd}`; }
        else if (leafName === 'k_proj' || leafName.includes('k_proj')) { childNode.shape = [H, KV*hd]; details.shape = `${H}×${KV*hd}`; }
        else if (leafName === 'v_proj' || leafName.includes('v_proj')) { childNode.shape = [H, KV*hd]; details.shape = `${H}×${KV*hd}`; }
        else if (leafName === 'o_proj' || leafName.includes('o_proj')) { childNode.shape = [A*hd, H]; details.shape = `${A*hd}×${H}`; }
        else if (leafName.includes('wo_a')) { childNode.shape = [A*hd, this.oLoraR]; details.shape = `${A*hd}×${this.oLoraR}`; }
        else if (leafName.includes('wo_b')) { childNode.shape = [this.oLoraR, H]; details.shape = `${this.oLoraR}×${H}`; }
      }

      // Common MLP shapes
      if (leafName === 'gate_proj' || leafName.includes('gate_proj')) { childNode.shape = [H, I]; details.shape = `${H}×${I}`; }
      else if (leafName === 'up_proj' || leafName.includes('up_proj')) { childNode.shape = [H, I]; details.shape = `${H}×${I}`; }
      else if (leafName === 'down_proj' || leafName.includes('down_proj')) { childNode.shape = [I, H]; details.shape = `${I}×${H}`; }
      // V4.1 / MiniMax style: w1=gate, w2=down, w3=up
      else if (leafName === 'w1' || (trieKeyMatch === 'w1' && !leafName.includes('proj'))) { childNode.shape = [H, I]; details.shape = `${H}×${I}`; }
      else if (leafName === 'w3' || (trieKeyMatch === 'w3' && !leafName.includes('proj'))) { childNode.shape = [H, I]; details.shape = `${H}×${I}`; }
      else if (leafName === 'w2' || (trieKeyMatch === 'w2' && !leafName.includes('proj'))) { childNode.shape = [I, H]; details.shape = `${I}×${H}`; }
      else if (leafName === 'gate' || (leafName.includes('gate') && !leafName.includes('proj'))) { childNode.shape = [H, this.numExperts || 1]; details.shape = `${H}×${this.numExperts || 1}`; details.note = 'MoE router'; }
      else if (leafName.includes('eh_proj') || leafName === 'phi') { childNode.shape = [H, H]; details.shape = `${H}×${H}`; details.type = details.type || 'hyper_connection'; }
      else if (leafName.includes('branch_alpha')) { childNode.shape = [this.mhcStreams]; details.shape = `[${this.mhcStreams}]`; details.note = 'MHC branch'; }
      else if (leafName.includes('branch_beta')) { childNode.shape = [this.mhcStreams]; details.shape = `[${this.mhcStreams}]`; details.note = 'MHC branch'; }
      else if (leafName.includes('norm_gamma')) { childNode.shape = [H]; details.shape = `[${H}]`; }
      else if (leafName === 'weight' && (parentKey.includes('norm') || parentKey.includes('layernorm'))) { childNode.shape = [H]; details.shape = `[${H}]`; }
      else if (leafName === 'shared_head' || leafName.includes('shared_head')) { childNode.shape = [H, V]; details.shape = `${H}×${V}`; }
      else if (leafName === 'e_proj' || leafName.includes('e_proj')) { childNode.shape = [H, H]; details.shape = `${H}×${H}`; }

      childNode.details = details;

      // If shape was inferred, propagate to weight/bias children
      if (childNode.shape && childNode.shape.length === 2) {
        this._setLeafShapeFromParent(childNode, childNode.shape[0], childNode.shape[1]);
      } else if (childNode.shape && childNode.shape.length === 1) {
        this._setLeafShapeFromParent(childNode, childNode.shape[0], childNode.shape[0]);
      }

      // Recurse into grandchildren — 1:1 match via _trieKey (no cross-product)
      if (childNode.children && childNode.children.length > 0) {
        this._inferLeafShapes(trieChild, childNode, layerIdx, tk, isLinear, isLowRank, isMoE, effI);
      }
    }
  }

  // Set params on leaf projection modules (q_proj, k_proj, gate_proj, etc.)
  // These have shapes but params=0 since their weight/bias children were filtered out.
  // Recursively walks into grandchildren to handle nested modules (shared_experts, experts, etc.)
  _setLeafParams(parentNode, layerIdx, parentKey, isLinear, isLowRank, isMoE, effI) {
    if (!parentNode.children) return;
    const H = this.H, A = this.A, KV = this.KV, hd = this.headDim;
    const I = effI || (isMoE ? this.moeI : this.I);
    for (const child of parentNode.children) {
      const name = (child.name || '').toLowerCase();
      // Also check the raw trie key for exact matching (display name may differ)
      const trieKey = (child._trieKey || '').toLowerCase();
      // Skip if already has params > 0
      if (child.params > 0) { continue; }
      // Detect shared_experts container — use its own intermediate size
      let childI = I;
      if (name.includes('shared_expert')) childI = this.sharedExpI || I;
      // Low-rank DSA attention projections
      if (isLowRank) {
        if (name.includes('q_a_proj') || name.includes('wq_a')) child.params = H * this.qLora;
        else if (name.includes('q_b_proj') || name.includes('wq_b')) {
          if (!name.includes('indexer')) child.params = this.qLora * A * (this.qkNope + this.qkRope);
        }
        else if (name.includes('kv_a_proj')) child.params = H * (this.kvLora + this.qkRope);
        else if (name.includes('kv_b_proj')) child.params = this.kvLora * A * (this.qkNope + this.vHead);
        else if (name.includes('o_proj') && !name.includes('wo')) child.params = A * (this.qkNope + this.qkRope) * H;
        else if (name.includes('wo_a')) child.params = A * hd * this.oLoraR;
        else if (name.includes('wo_b')) child.params = this.oLoraR * (this.oGroups || 1) * H;
        else if (name.includes('q_a_layernorm')) child.params = this.qLora;
        else if (name.includes('kv_a_layernorm')) child.params = this.kvLora;
        else if (name.includes('wkv')) child.params = H * this.headDim;
        else if (name.includes('attn_sink')) child.params = A;
      } else if (!isLinear) {
        // Standard attention
        if (name === 'q_proj' || name.includes('q_proj')) child.params = H * (A * hd);
        else if (name === 'k_proj' || name.includes('k_proj')) child.params = H * (KV * hd);
        else if (name === 'v_proj' || name.includes('v_proj')) child.params = H * (KV * hd);
        else if (name === 'o_proj' || name.includes('o_proj')) child.params = (A * hd) * H;
        else if (name === 'wo_a') child.params = A * hd * this.oLoraR;
        else if (name === 'wo_b') child.params = this.oLoraR * (this.oGroups || 1) * H;
        // V4.1 low-rank fallback when isLowRank not detected
        else if (name === 'wq_a') child.params = H * this.qLora;
        else if (name === 'wq_b' && !name.includes('indexer')) child.params = this.qLora * A * (this.qkNope + this.qkRope);
        else if (name === 'wkv') child.params = H * this.headDim;
        // QK norms (MiniMax-M3: per-head)
        else if (name === 'q_norm' || name.includes('q_norm')) child.params = A * hd;
