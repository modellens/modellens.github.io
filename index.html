          { name: 'Merger (→ text hidden)', type: 'vision', icon: '🔗', params: (vc.vt_hidden_size||vc.hidden_size||1152) * (vc.out_hidden_size||vc.text_hidden_size||H), details: { 'in': vc.vt_hidden_size||vc.hidden_size, 'out': vc.out_hidden_size||vc.text_hidden_size } },
        ]
      });
    }

    // Language Model wrapper for VLM
    const lmChildren = [];

    // Embeddings
    lmChildren.push({
      name: 'Embeddings', type: 'embedding', icon: '📋',
      params: V * H, shape: [V, H],
      details: { 'vocab_size': V, 'hidden_size': H, 'weight': 'model.embed_tokens.weight' }
    });

    // Transformer layers
    const layerChildren = [];
    for (let i = 0; i < L; i++) {
      const isDenseMLP = i < firstKDense || (moeFreq > 1 && i % moeFreq !== 0);
      const layerI = isDenseMLP ? I : moeI;
      layerChildren.push(this._dsv3Layer(i, H, A, headDim, qkNope, qkRope, vHead, qLoraR, kvLoraR, layerI, isDenseMLP ? I : moeI, numExp, numExpPerTok, sharedExpI, numSharedExp, isDenseMLP, rmsEps, ropeTheta));
    }
    lmChildren.push({
      name: `Transformer Layers (${L} layers, DSA + ${numExp > 0 ? 'Dense+MoE' : 'Dense'})`,
      type: 'encoder', icon: '🔄', isLayerGroup: true, layerCount: L,
      details: { 'layers': L, 'hidden_size': H, 'attention_heads': A, 'is_moe': numExp > 0, 'n_routed_experts': numExp, 'first_k_dense_replace': firstKDense },
      children: layerChildren
    });

    // Final norm
    lmChildren.push({
      name: 'RMSNorm (final)', type: 'norm', icon: '📊', shape: [H], params: H,
      details: { 'eps': rmsEps, 'weight': 'model.norm.weight' }
    });

    // LM Head
    const isTied = c.tie_word_embeddings === true;
    lmChildren.push({
      name: 'LM Head', type: 'head', icon: '🎯',
      params: isTied ? 0 : H * V,
      details: { 'tied_weights': isTied, 'weight': 'lm_head.weight' },
      children: [ isTied
        ? { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'model.embed_tokens.weight' } }
        : { name: 'Output Projection', type: 'head', icon: '📤', shape: [H, V], params: H * V, details: { 'weight': 'lm_head.weight', 'no_bias': true } }
      ]
    });

    // MTP
    if (mtpLayers > 0) {
      lmChildren.push({
        name: mtpLayers > 1 ? `MTP Head (${mtpLayers} layers)` : 'MTP Head',
        type: 'mtp', icon: '🔮', params: 0,
        details: { 'mtp_layers': mtpLayers, 'purpose': 'Multi-Token Prediction (NextN)' },
        children: Array.from({ length: mtpLayers }, (_, i) => this._dsv3MtpLayer(i, H, A, headDim, qkNope, qkRope, vHead, qLoraR, kvLoraR, moeI, numExp, numExpPerTok, sharedExpI, numSharedExp, rmsEps))
      });
    }

    if (isVLM) {
      tree.children.push({ name: 'Language Model', type: 'model', icon: '🏛', params: 0, details: { 'hidden_size': H, 'layers': L, 'model_type': c.model_type, 'architecture': (c._textArchitectures||[])[0] || '' }, children: lmChildren });
    } else {
      tree.children.push(...lmChildren);
    }

    return tree;
  }

  _dsv3Layer(i, H, A, headDim, qkNope, qkRope, vHead, qLoraR, kvLoraR, I, moeI, numExp, numExpPerTok, sharedExpI, numSharedExp, isDenseMLP, rmsEps, ropeTheta) {
    const normP = H;
    // MLA attention params (DeepSeek-V3 style)
    // q_a_proj: [H, qLoraR], q_b_proj: [qLoraR, A*headDim]
    const qAP = H * qLoraR;
    const qBP = qLoraR * (A * headDim);
    // kv_a_proj_with_mqa: [H, kvLoraR + qkRope]
    const kvAP = H * (kvLoraR + qkRope);
    // kv_b_proj: [kvLoraR, A*(qkNope + vHead)]
    const kvBP = kvLoraR * (A * (qkNope + vHead));
    // o_proj: [A*headDim, H]
    const oP = (A * headDim) * H;
    // norms: q_a_norm [A*qkNope], kv_a_norm [kvLoraR]
    const qNormP = A * qkNope;
    const kvNormP = kvLoraR;
    // rotary embeddings (no params, just info)
    const rotaryP = 0;
    const attnP = qAP + qBP + kvAP + kvBP + oP + qNormP + kvNormP + rotaryP;

    // MLP
    const mlpNode = !isDenseMLP && numExp > 0
      ? this._buildMoEMLP(H, moeI, numExp, numExpPerTok, sharedExpI, 'silu')
      : { name: 'MLP (SwiGLU)', type: 'ffn', icon: '🔀', params: 3 * H * I, details: { 'intermediate_size': I }, children: [
          { name: 'gate_proj', type: 'ffn', icon: '🚪', params: H * I, details: {} },
          { name: 'up_proj', type: 'ffn', icon: '⬆', params: H * I, details: {} },
          { name: 'down_proj', type: 'ffn', icon: '⬇', params: I * H, details: {} },
        ] };
    const ffnP = mlpNode.params;

    const totalP = attnP + ffnP + 2 * normP;
    const attnType = 'DSA (MLA)';

    return {
      name: `Layer ${i} (${isDenseMLP ? 'Dense' : 'MoE' + (numExp > 0 ? ` (${numExp} exp, top-${numExpPerTok})` : '')})`,
      type: 'layer', icon: '🧱',
      params: totalP,
      details: { 'hidden_size': H, 'attention_type': attnType, 'q_lora_rank': qLoraR, 'kv_lora_rank': kvLoraR, 'head_dim': headDim, 'qk_nope': qkNope, 'qk_rope': qkRope, 'v_head': vHead, 'is_moe': !isDenseMLP && numExp > 0, 'is_dense_mlp': isDenseMLP },
      children: [
        { name: 'Input RMSNorm', type: 'norm', icon: '📊', shape: [H], params: normP, details: { 'eps': rmsEps, 'type': 'rms', 'weight': `layers.${i}.input_layernorm.weight` } },
        {
          name: `Self-Attention (${attnType})`, type: 'attention', icon: '⚡',
          params: attnP,
          details: { 'mechanism': 'MLA (Multi-head Latent Attention)', 'low_rank_q': true, 'q_lora_rank': qLoraR, 'kv_lora_rank': kvLoraR, 'shared_kv': true, 'qk_nope_head_dim': qkNope, 'qk_rope_head_dim': qkRope, 'v_head_dim': vHead, 'num_heads': A, 'head_dim': headDim, 'rope_theta': ropeTheta },
          children: [
            { name: 'q_a_proj (LoRA A)', type: 'attention', icon: '📊', shape: [H, qLoraR], params: qAP, details: { 'shape': `${H} x ${qLoraR}`, 'bias': false } },
            { name: 'q_b_proj (LoRA B)', type: 'attention', icon: '📊', shape: [qLoraR, A * headDim], params: qBP, details: { 'shape': `${qLoraR} x ${A * headDim}`, 'bias': false } },
            { name: 'kv_a_proj (shared KV+RoPE)', type: 'attention', icon: '📊', shape: [H, kvLoraR + qkRope], params: kvAP, details: { 'shape': `${H} x ${kvLoraR + qkRope}`, 'bias': false } },
            { name: 'kv_b_proj (decompress)', type: 'attention', icon: '📊', shape: [kvLoraR, A * (qkNope + vHead)], params: kvBP, details: { 'shape': `${kvLoraR} x ${A * (qkNope + vHead)}`, 'bias': false } },
            { name: 'o_proj', type: 'attention', icon: '📤', shape: [A * headDim, H], params: oP, details: { 'shape': `${A * headDim} x ${H}`, 'bias': false } },
            { name: 'q_a_norm', type: 'norm', icon: '📊', shape: [A * qkNope], params: qNormP, details: { 'type': 'rms' } },
            { name: 'kv_a_norm', type: 'norm', icon: '📊', shape: [kvLoraR], params: kvNormP, details: { 'type': 'rms' } },
            { name: 'RoPE', type: 'norm', icon: '🌀', params: 0, details: { 'theta': ropeTheta, 'rope_dim': qkRope } },
          ]
        },
        { name: 'Post-Attn RMSNorm', type: 'norm', icon: '📊', shape: [H], params: normP, details: { 'eps': rmsEps, 'type': 'rms', 'weight': `layers.${i}.post_attention_layernorm.weight` } },
        mlpNode,
      ]
    };
  }

  _dsv3MtpLayer(i, H, A, headDim, qkNope, qkRope, vHead, qLoraR, kvLoraR, moeI, numExp, numExpPerTok, sharedExpI, numSharedExp, rmsEps) {
    const normP = H;
    const eProj = H * H;
    const qAP = H * qLoraR, qBP = qLoraR * (A * headDim);
    const kvAP = H * (kvLoraR + qkRope), kvBP = kvLoraR * (A * (qkNope + vHead));
    const oP = (A * headDim) * H;
    const qNormP = A * qkNope, kvNormP = kvLoraR;
    const attnP = qAP + qBP + kvAP + kvBP + oP + qNormP + kvNormP;
    const mlpNode = numExp > 0 ? this._buildMoEMLP(H, moeI, numExp, numExpPerTok, sharedExpI, 'silu') : { name: 'MLP', type: 'ffn', icon: '🔀', params: 3 * H * moeI, details: {}, children: [] };
    return {
      name: `MTP Layer ${i}`, type: 'mtp', icon: '🔮', params: eProj + attnP + 2 * normP + mlpNode.params + normP,
      details: { 'hidden_size': H, 'purpose': 'Multi-Token Prediction' },
      children: [
        { name: 'Embed Projection', type: 'embedding', icon: '📋', params: eProj, details: { 'shape': `${H} x ${H}` } },
        { name: 'RMSNorm', type: 'norm', icon: '📊', params: normP, details: { 'eps': rmsEps } },
        { name: 'Self-Attention (MLA)', type: 'attention', icon: '⚡', params: attnP, details: { 'mechanism': 'MLA', 'q_lora_rank': qLoraR, 'kv_lora_rank': kvLoraR }, children: [] },
        { name: 'Post-Attn RMSNorm', type: 'norm', icon: '📊', params: normP, details: { 'eps': rmsEps } },
        mlpNode,
        { name: 'Shared Head', type: 'head', icon: '🎯', params: H, details: { 'note': 'shared with main LM head' } },
      ]
    };
  }

  // --- Kimi-K3 (KDA + Gated MLA hybrid + Stable LatentMoE + AttnRes + optional VLM) ---
  _parseKimiLinearLike() {
    const c = this.config;
    const H = c.hidden_size;
    const V = c.vocab_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const headDim = c.qk_nope_head_dim || c.linear_attn_config?.head_dim || 128;
    const qkvW = A * headDim;  // q/k/v/o/g_proj width = num_heads * head_dim
    const I = c.intermediate_size || H * 4;
    const moeI = c.moe_intermediate_size || I;
    const latentH = c.routed_expert_hidden_size || H;  // Stable LatentMoE: experts operate in latent space
    const numExp = c.num_experts || c.n_routed_experts || 0;
    const numExpPerTok = c.num_experts_per_tok || c.num_experts_per_token || 0;
    const numSharedExp = c.num_shared_experts || c.n_shared_experts || 0;
    const firstKDense = c.first_k_dense_replace || 0;
    const rmsEps = c.rms_norm_eps || 1e-6;
    const isVLM = c._isMultimodal || false;
    const convKernel = c.linear_attn_config?.short_conv_kernel_size || 4;
    const fullAttnLayers = c.linear_attn_config?.full_attn_layers || [];
    const hasHybrid = fullAttnLayers.length > 0;
    const kdaLayers = L - fullAttnLayers.length;
    const isTied = c.tie_word_embeddings === true;

    const tree = {
      name: this.architectures[0] || 'KimiLinearForCausalLM',
      type: 'model', icon: '🏛', params: 0,
      details: {
        'model_type': c.model_type,
        'architectures': (this.architectures || []).join(', '),
        'hidden_size': H, 'num_layers': L, 'attention_heads': A,
        'head_dim': headDim, 'qkv_width': qkvW,
        'vocab_size': V, 'max_context': c.max_position_embeddings,
        'dtype': c.dtype || c.torch_dtype || 'bfloat16',
        'is_moe': numExp > 0, 'num_experts': numExp,
        'experts_per_tok': numExpPerTok, 'num_shared_experts': numSharedExp,
        'moe_intermediate_size': moeI, 'latent_moe_dim': latentH,
        'first_k_dense_replace': firstKDense,
        'hybrid_attention': hasHybrid, 'kda_layers': kdaLayers, 'gated_mla_layers': fullAttnLayers.length,
        'conv_kernel': convKernel, 'attn_res': true,
        'tie_embeddings': isTied,
        'multimodal': isVLM,
        'quantization': c.quantization_config ? c.quantization_config.quant_method : 'none',
        'activation': 'SiTU-GLU',
      },
      children: []
    };

    // Vision Encoder for VLM
    if (isVLM && c._visionConfig) {
      const vc = c._visionConfig;
      const vtH = vc.vt_hidden_size || vc.hidden_size || 1024;
      const vtD = vc.vt_num_hidden_layers || vc.depth || 27;
      const vtNH = vc.vt_num_attention_heads || 12;
      const vtI = vc.vt_intermediate_size || 4096;
      const qkvH = vc.qkv_hidden_size || vtH;
      const txtH = vc.text_hidden_size || H;
      tree.children.push({
        name: 'Vision Encoder (MoonViT-V2)', type: 'vision', icon: '👁', params: 401e6,
        details: { 'hidden_size': vtH, 'depth': vtD, 'num_heads': vtNH, 'patch_size': vc.patch_size, 'intermediate_size': vtI, 'qkv_hidden_size': qkvH, 'out_hidden_size': txtH, 'params': '~401M' },
        children: [
          { name: 'Patch Embed', type: 'vision', icon: '🔲', params: 3 * vtH * (vc.patch_size||14) * (vc.patch_size||14), details: { 'in_channels': 3, 'patch_size': vc.patch_size } },
          { name: `ViT Blocks (${vtD} layers)`, type: 'vision', icon: '🔄', isLayerGroup: true, layerCount: vtD, params: vtD * (3 * qkvH * qkvH + 2 * vtH * vtI + 5 * vtH), details: { 'per_block': 'wqkv + wo + fc0 + fc1 + 2×norm' }, children: [] },
          { name: 'Merger (PatchMergerV2)', type: 'vision', icon: '🔗', params: vtH * txtH + txtH, details: { 'type': vc.mm_projector_type || 'patchmergerv2' } },
        ]
      });
    }

    const lmChildren = [];

    // Embeddings
    lmChildren.push({
      name: 'Embeddings', type: 'embedding', icon: '📋',
      params: V * H, shape: [V, H],
      details: { 'vocab_size': V, 'hidden_size': H }
    });

    // Transformer layers
    const layerChildren = [];
    for (let i = 0; i < L; i++) {
      const isFullAttn = fullAttnLayers.includes(i);
      const isDenseMLP = i < firstKDense;
      layerChildren.push(this._kimiLinearLayer(i, H, A, headDim, qkvW, I, moeI, latentH, numExp, numExpPerTok, numSharedExp, isDenseMLP, isFullAttn, convKernel, rmsEps));
    }
    lmChildren.push({
      name: `Transformer Layers (${L} layers, ${hasHybrid ? `${kdaLayers} KDA + ${fullAttnLayers.length} Gated MLA` : 'uniform'})`,
      type: 'encoder', icon: '🔄', isLayerGroup: true, layerCount: L,
      details: { 'layers': L, 'hidden_size': H, 'attention_heads': A, 'is_moe': numExp > 0, 'num_experts': numExp, 'hybrid_attention': hasHybrid, 'kda_layers': kdaLayers, 'gated_mla_layers': fullAttnLayers.length, 'attn_res': true, 'activation': 'SiTU-GLU' },
      children: layerChildren
    });

    // Final norm
    lmChildren.push({
      name: 'RMSNorm (final)', type: 'norm', icon: '📊', shape: [H], params: H,
      details: { 'eps': rmsEps, 'weight': 'model.norm.weight' }
    });

    // Output AttnRes
    lmChildren.push({
      name: 'Output AttnRes', type: 'norm', icon: '🔗', params: H * H + H,
      details: { 'proj': `${H} x ${H}`, 'norm': H, 'note': 'cross-layer attention residual at output' }
    });

    // LM Head
    lmChildren.push({
      name: 'LM Head', type: 'head', icon: '🎯',
      params: isTied ? 0 : H * V,
      details: { 'tied_weights': isTied },
      children: [ isTied
        ? { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'model.embed_tokens.weight' } }
        : { name: 'Output Projection', type: 'head', icon: '📤', shape: [H, V], params: H * V, details: { 'no_bias': true } }
      ]
    });

    if (isVLM) {
      tree.children.push({ name: 'Language Model', type: 'model', icon: '🏛', params: 0, details: { 'hidden_size': H, 'layers': L, 'model_type': c.model_type, 'architecture': (c._textArchitectures||[])[0] || '' }, children: lmChildren });
    } else {
      tree.children.push(...lmChildren);
    }

    return tree;
  }

  _kimiLinearLayer(i, H, A, headDim, qkvW, I, moeI, latentH, numExp, numExpPerTok, numSharedExp, isDenseMLP, isFullAttn, convKernel, rmsEps) {
    const normP = H;
    const attnType = isFullAttn ? 'Gated MLA' : 'KDA';

    // KDA / Gated MLA share the same tensor structure in K3:
    // q_proj, k_proj, v_proj, o_proj, g_proj (output gate), f_a_proj, f_b_proj (decay gate),
    // b_proj (beta gate), q_conv1d, k_conv1d, v_conv1d, A_log, dt_bias, o_norm
    const qP = H * qkvW;        // q_proj
    const kP = H * qkvW;        // k_proj
    const vP = H * qkvW;        // v_proj
    const oP = qkvW * H;        // o_proj
    const gP = H * qkvW;        // g_proj (output gate for Gated MLA / KDA)
    const faP = H * headDim;    // f_a_proj (low-rank bottleneck for decay gate)
    const fbP = headDim * qkvW; // f_b_proj
    const bP = H * A;           // b_proj (beta gate)
    const qConvP = convKernel * qkvW;  // q_conv1d
    const kConvP = convKernel * qkvW;  // k_conv1d
    const vConvP = convKernel * qkvW;  // v_conv1d
    const aLogP = A;            // A_log (per-head)
    const dtBiasP = qkvW;       // dt_bias
    const oNormP = headDim;     // o_norm (RMSNorm on head dim)
    const attnP = qP + kP + vP + oP + gP + faP + fbP + bP + qConvP + kConvP + vConvP + aLogP + dtBiasP + oNormP;

    const attnChildren = [
      { name: 'q_proj', type: 'attention', icon: '📊', params: qP, details: { 'shape': `${H} x ${qkvW}` } },
      { name: 'k_proj', type: 'attention', icon: '📊', params: kP, details: { 'shape': `${H} x ${qkvW}` } },
      { name: 'v_proj', type: 'attention', icon: '📊', params: vP, details: { 'shape': `${H} x ${qkvW}` } },
      { name: 'o_proj', type: 'attention', icon: '📤', params: oP, details: { 'shape': `${qkvW} x ${H}` } },
      { name: 'g_proj', type: 'attention', icon: '🚪', params: gP, details: { 'shape': `${H} x ${qkvW}`, 'note': 'output gate (Gated MLA / KDA)' } },
      { name: 'f_a_proj', type: 'attention', icon: '📊', params: faP, details: { 'shape': `${H} x ${headDim}`, 'note': 'decay gate low-rank A' } },
      { name: 'f_b_proj', type: 'attention', icon: '📊', params: fbP, details: { 'shape': `${headDim} x ${qkvW}`, 'note': 'decay gate low-rank B' } },
      { name: 'b_proj', type: 'attention', icon: '📊', params: bP, details: { 'shape': `${H} x ${A}`, 'note': 'beta gate (write strength)' } },
      { name: 'q_conv1d', type: 'attention', icon: '🌊', params: qConvP, details: { 'kernel': convKernel } },
      { name: 'k_conv1d', type: 'attention', icon: '🌊', params: kConvP, details: { 'kernel': convKernel } },
      { name: 'v_conv1d', type: 'attention', icon: '🌊', params: vConvP, details: { 'kernel': convKernel } },
      { name: 'A_log', type: 'norm', icon: '📊', params: aLogP, details: { 'shape': `${A}`, 'note': 'per-head log decay scale' } },
      { name: 'dt_bias', type: 'norm', icon: '📊', params: dtBiasP, details: { 'shape': `${qkvW}` } },
      { name: 'o_norm', type: 'norm', icon: '📊', params: oNormP, details: { 'shape': `${headDim}`, 'type': 'rms' } },
    ];

    // AttnRes: self_attention_res_proj + norm, mlp_res_proj + norm
    const attnResP = 2 * H * H + 2 * H;

    // MLP — Stable LatentMoE or Dense
    let mlpNode;
    if (!isDenseMLP && numExp > 0) {
      // Stable LatentMoE: routed_expert_up_proj [H, latentH] + routed_expert_norm [latentH]
      //   + experts w1/w2/w3 [latentH, moeI] / [moeI, latentH]
      //   + routed_expert_down_proj [latentH, H]
      //   + shared_experts gate/up [H, numSharedExp*moeI] + down [numSharedExp*moeI, H]
      //   + gate (router) [H, numExp] + e_score_correction_bias [numExp]
      const perExpert = 3 * latentH * moeI;  // w1 [latentH, moeI] + w3 [latentH, moeI] + w2 [moeI, latentH]
      const expTotal = numExp * perExpert;
      const upProjP = H * latentH;           // routed_expert_up_proj
      const downProjP = latentH * H;         // routed_expert_down_proj
      const expNormP = latentH;              // routed_expert_norm
      const sharedMoeI = numSharedExp * moeI;
      const sharedP = 3 * H * sharedMoeI;    // shared_experts gate/up/down (merged)
      const routerP = H * numExp + numExp;   // gate.weight + e_score_correction_bias
      const moeTotal = expTotal + upProjP + downProjP + expNormP + sharedP + routerP;

      mlpNode = {
        name: 'Stable LatentMoE', type: 'ffn', icon: '🔀', params: moeTotal,
        details: {
          'is_moe': true, 'num_experts': numExp, 'experts_per_tok': numExpPerTok,
          'latent_dim': latentH, 'moe_intermediate_size': moeI,
          'per_expert_params': perExpert, 'shared_experts': numSharedExp,
          'shared_expert_intermediate': sharedMoeI,
          'activation': 'SiTU-GLU', 'router': 'Quantile Balancing',
        },
        children: [
          { name: 'gate (router)', type: 'norm', icon: '🚪', params: routerP, details: { 'shape': `${H} x ${numExp}`, 'note': `top-${numExpPerTok} of ${numExp}, Quantile Balancing`, 'bias': numExp } },
          { name: 'routed_expert_up_proj', type: 'ffn', icon: '⬆', params: upProjP, details: { 'shape': `${H} x ${latentH}`, 'note': 'project H → latent space' } },
          { name: 'routed_expert_norm', type: 'norm', icon: '📊', params: expNormP, details: { 'shape': `${latentH}`, 'type': 'rms', 'note': 'norm in latent space' } },
          {
            name: `Experts (${numExp})`, type: 'moe', icon: '🎲',
            isLayerGroup: true, layerCount: numExp, params: expTotal,
            details: { 'per_expert': perExpert, 'w1': `${latentH} x ${moeI}`, 'w3': `${latentH} x ${moeI}`, 'w2': `${moeI} x ${latentH}`, 'activation': 'SiTU-GLU' },
            children: Array.from({ length: Math.min(numExp, 4) }, (_, ei) => ({
              name: `Expert ${ei}${numExp > 4 ? ' (sample)' : ''}`, type: 'ffn', icon: '🔧', params: perExpert,
              details: { 'w1': `${latentH} x ${moeI}`, 'w2': `${moeI} x ${latentH}`, 'w3': `${latentH} x ${moeI}` },
              children: [
                { name: 'w1 (gate)', type: 'ffn', icon: '🚪', params: latentH * moeI, details: { 'shape': `${latentH} x ${moeI}` } },
                { name: 'w3 (up)', type: 'ffn', icon: '⬆', params: latentH * moeI, details: { 'shape': `${latentH} x ${moeI}` } },
                { name: 'w2 (down)', type: 'ffn', icon: '⬇', params: moeI * latentH, details: { 'shape': `${moeI} x ${latentH}` } },
              ]
            }))
          },
          { name: 'routed_expert_down_proj', type: 'ffn', icon: '⬇', params: downProjP, details: { 'shape': `${latentH} x ${H}`, 'note': 'project latent → H' } },
          { name: `Shared Experts (${numSharedExp})`, type: 'ffn', icon: '🔧', params: sharedP, details: { 'merged': true, 'gate_proj': `${H} x ${sharedMoeI}`, 'up_proj': `${H} x ${sharedMoeI}`, 'down_proj': `${sharedMoeI} x ${H}` } },
        ]
      };
    } else {
      // Dense MLP (layer 0) — SiTU-GLU
      mlpNode = {
        name: 'MLP (SiTU-GLU)', type: 'ffn', icon: '🔀', params: 3 * H * I,
        details: { 'intermediate_size': I, 'activation': 'SiTU-GLU' },
        children: [
          { name: 'gate_proj', type: 'ffn', icon: '🚪', params: H * I, details: { 'shape': `${H} x ${I}` } },
          { name: 'up_proj', type: 'ffn', icon: '⬆', params: H * I, details: { 'shape': `${H} x ${I}` } },
          { name: 'down_proj', type: 'ffn', icon: '⬇', params: I * H, details: { 'shape': `${I} x ${H}` } },
        ]
      };
    }

    const ffnP = mlpNode.params;
    const totalP = attnP + ffnP + 2 * normP + attnResP;

    return {
      name: `Layer ${i} (${attnType}${isDenseMLP ? ', Dense' : numExp > 0 ? `, MoE (${numExp} exp, top-${numExpPerTok})` : ''})`,
      type: 'layer', icon: '🧱',
      params: totalP,
      details: {
        'hidden_size': H, 'attention_type': attnType, 'is_moe': !isDenseMLP && numExp > 0, 'is_dense_mlp': isDenseMLP,
        'attn_res': true, 'activation': 'SiTU-GLU',
        'latent_moe_dim': !isDenseMLP ? latentH : 'N/A',
      },
      children: [
        { name: 'Input RMSNorm', type: 'norm', icon: '📊', shape: [H], params: normP, details: { 'eps': rmsEps, 'type': 'rms' } },
        {
          name: `Self-Attention (${attnType})`, type: 'attention', icon: '⚡',
          params: attnP,
          details: isFullAttn
            ? { 'mechanism': 'Gated MLA (NoPE)', 'num_heads': A, 'head_dim': headDim, 'qkv_width': qkvW, 'output_gate': true, 'position_encoding': 'None (NoPE)' }
            : { 'mechanism': 'KDA (Kimi Delta Attention)', 'num_heads': A, 'head_dim': headDim, 'qkv_width': qkvW, 'conv_kernel': convKernel, 'state_size': `${headDim}x${headDim} per head`, 'forget_gate': 'per-channel', 'position_encoding': 'implicit (decay)' },
          children: attnChildren
        },
        { name: 'Self-Attn Res (AttnRes)', type: 'norm', icon: '🔗', params: H * H + H, details: { 'proj': `${H} x ${H}`, 'norm': H, 'note': 'cross-layer attention residual' } },
        { name: 'Post-Attn RMSNorm', type: 'norm', icon: '📊', shape: [H], params: normP, details: { 'eps': rmsEps, 'type': 'rms' } },
        mlpNode,
        { name: 'MLP Res (AttnRes)', type: 'norm', icon: '🔗', params: H * H + H, details: { 'proj': `${H} x ${H}`, 'norm': H, 'note': 'cross-layer attention residual' } },
      ]
    };
  }

  // --- DeepSeek-V4 (CSA/HCA hybrid + MoE + MTP + Hyper-Connection) ---
  _parseDeepSeekV4() {
    const c = this.config;
    const H = c.hidden_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const KV = c.num_key_value_heads || 1;
    const headDim = c.head_dim || (H / A);
    const V = c.vocab_size;
    const I = c.moe_intermediate_size || c.intermediate_size || H * 4;
    const numExp = c.n_routed_experts || 0;
    const numExpPerTok = c.num_experts_per_tok || 0;
    const numSharedExp = c.n_shared_experts || 1;
    const sharedExpI = c.shared_expert_intermediate_size || I;
    const qLoraR = c.q_lora_rank || 1024;
    const oLoraR = c.o_lora_rank || 1024;
    const oGroups = c.o_groups || 8;
    const compressRatios = c.compress_ratios || [];
    const swa = c.sliding_window || 128;
    const mtpLayers = c.num_nextn_predict_layers || 0;
    const rmsEps = c.rms_norm_eps || c.hc_eps || 1e-6;
    const indexNH = c.index_n_heads || 64;
    const indexHD = c.index_head_dim || 128;
    const indexTopk = c.index_topk || 512;
    const ropeTheta = c.rope_theta || 10000;
    const qkRopeDim = c.qk_rope_head_dim || 64;
    const normParams = H;

    const tree = {
      name: this.architectures[0] || 'DeepseekV4ForCausalLM',
      type: 'model', icon: '🏛', params: 0,
      details: {
        'model_type': c.model_type,
        'architectures': (this.architectures || []).join(', '),
        'hidden_size': H, 'num_layers': L, 'attention_heads': A, 'kv_heads': KV,
        'head_dim': headDim, 'moe_intermediate_size': I, 'vocab_size': V,
        'max_context': c.max_position_embeddings,
        'dtype': c.torch_dtype || 'bfloat16',
        'n_routed_experts': numExp, 'experts_per_tok': numExpPerTok,
        'n_shared_experts': numSharedExp, 'shared_expert_size': sharedExpI,
        'q_lora_rank': qLoraR, 'o_lora_rank': oLoraR, 'o_groups': oGroups,
        'sliding_window': swa, 'index_n_heads': indexNH,
        'index_head_dim': indexHD, 'index_topk': indexTopk,
        'qk_rope_head_dim': qkRopeDim, 'rope_theta': ropeTheta,
        'compress_ratios': compressRatios.length > 0 ? `[${compressRatios[0]}, ${compressRatios[1]}, ..., ${compressRatios[L]}] (${L+1} entries)` : 'none',
        'hybrid_attention': compressRatios.length > 0,
        'tie_embeddings': c.tie_word_embeddings,
        'mtp_layers': mtpLayers,
        'scoring_func': c.scoring_func,
        'quantization': c.quantization_config ? c.quantization_config.quant_method : 'none',
      },
      children: []
    };

    // Embeddings
    tree.children.push({
      name: 'Embeddings', type: 'embedding', icon: '📋', params: V * H,
      shape: [V, H], details: { 'vocab_size': V, 'hidden_size': H, 'weight': 'embed.weight' }
    });

    // Transformer layers
    const layerChildren = [];
    for (let i = 0; i < L; i++) {
      const cr = compressRatios[i] ?? 0;
      const isCSA = cr === 4;
      const isHCA = cr === 128;
      const isSWA = cr === 0;
      const attnType = isCSA ? 'CSA' : isHCA ? 'HCA' : isSWA ? 'SWA' : `ratio=${cr}`;
      const layerNode = this._dsv4Layer(i, H, A, KV, headDim, I, numExp, numExpPerTok, sharedExpI, qLoraR, oLoraR, oGroups, cr, attnType, swa, indexNH, indexHD, indexTopk, qkRopeDim, rmsEps, ropeTheta);
      layerChildren.push(layerNode);
    }
    tree.children.push({
      name: `Transformer Layers (${L} layers, CSA/HCA hybrid)`,
      type: 'encoder', icon: '🔄', isLayerGroup: true, layerCount: L,
      details: {
        'layers': L, 'hidden_size': H, 'attention_heads': A,
        'hybrid_attention': true, 'layer_types': compressRatios.length > 0 ? 'CSA/HCA/SWA' : 'uniform',
        'csa_layers': compressRatios.filter(r => r === 4).length,
        'hca_layers': compressRatios.filter(r => r === 128).length,
        'swa_layers': compressRatios.filter(r => r === 0).length,
        'is_moe': numExp > 0, 'num_experts': numExp, 'experts_per_tok': numExpPerTok,
      },
      children: layerChildren
    });

    // LM Head
    const isTied = c.tie_word_embeddings === true;
    tree.children.push({
      name: 'LM Head', type: 'head', icon: '🎯',
      params: isTied ? 0 : H * V,
      details: { 'tied_weights': isTied, 'weight': 'head.weight' },
      children: [ isTied
        ? { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'embed.weight' } }
        : { name: 'Output Projection', type: 'head', icon: '📤', shape: [H, V], params: H * V, details: { 'weight': 'head.weight', 'no_bias': true } }
      ]
    });

    // MTP (NextN prediction)
    if (mtpLayers > 0) {
      tree.children.push({
        name: mtpLayers > 1 ? `MTP Head (${mtpLayers} layers)` : 'MTP Head',
        type: 'mtp', icon: '🔮', params: 0,
        details: { 'mtp_layers': mtpLayers, 'purpose': 'Multi-Token Prediction (NextN)', 'weight_prefix': 'mtp.N' },
        children: Array.from({ length: mtpLayers }, (_, i) => this._dsv4MtpLayer(i, H, A, KV, headDim, I, numExp, numExpPerTok, sharedExpI, qLoraR, oLoraR, oGroups, swa, indexNH, indexHD, indexTopk, qkRopeDim, rmsEps))
      });
    }

    // Hyper-Connection params
    const hcParams = L * 6 * H; // hc_attn_base/fn/scale + hc_ffn_base/fn/scale per layer
    if (hcParams > 0) {
      tree.children.push({
        name: 'Hyper-Connection', type: 'norm', icon: '🔗', params: hcParams + 4 * H,
        details: { 'hc_mult': c.hc_mult || 4, 'hc_sinkhorn_iters': c.hc_sinkhorn_iters || 20, 'note': 'Learnable skip connections between layers' },
        children: [
          { name: 'hc_head_base', type: 'norm', icon: '📊', params: H, details: { 'note': 'head connection base' } },
          { name: 'hc_head_fn', type: 'norm', icon: '📊', params: H, details: { 'note': 'head connection function' } },
          { name: 'hc_head_scale', type: 'norm', icon: '📊', params: H, details: { 'note': 'head connection scale' } },
        ]
      });
    }

    this._calcTreeParams(tree);
    return tree;
  }

  _dsv4Layer(i, H, A, KV, headDim, I, numExp, numExpPerTok, sharedExpI, qLoraR, oLoraR, oGroups, compressRatio, attnType, swa, indexNH, indexHD, indexTopk, qkRopeDim, rmsEps, ropeTheta) {
    const normParams = H;
    // Attention params (low-rank Q + shared KV MQA + grouped output)
    const wqA = H * qLoraR;   // wq_a: [H, qLoraR]
    const wqB = qLoraR * (A * headDim); // wq_b: [qLoraR, A*headDim]
    const wkv = headDim * headDim * 2;  // wkv: shared KV projection (simplified)
    const woA = (A * headDim) * oLoraR; // wo_a: [A*headDim, oLoraR]
    const woB = oLoraR * H;    // wo_b: [oLoraR, H]
    const qNorm = A * headDim;
    const kvNorm = headDim; // KV shared
    const attnSink = headDim;
    const indexerP = compressRatio === 4 ? (indexNH * indexHD * headDim + qLoraR * indexNH * indexHD + indexNH * indexHD) : 0;
    const compressorP = compressRatio > 0 ? (headDim * headDim + headDim + headDim) : 0;
    const attnParams = wqA + wqB + wkv + woA + woB + qNorm + kvNorm + attnSink + indexerP + compressorP;

    // MoE MLP
    const mlpNode = numExp > 0
      ? this._buildMoEMLP(H, I, numExp, numExpPerTok, sharedExpI, 'silu')
      : { name: 'MLP (SwiGLU)', type: 'ffn', icon: '🔀', params: 3 * H * I, details: { 'intermediate_size': I }, children: [] };
    const ffnParams = mlpNode.params;
    const hcParams = 6 * H; // hc_attn + hc_ffn (base/fn/scale each)

    const totalParams = attnParams + ffnParams + 2 * normParams + hcParams;

    const attnChildren = [
      { name: 'wq_a (LoRA A)', type: 'attention', icon: '📊', shape: [H, qLoraR], params: wqA, details: { 'shape': `${H} x ${qLoraR}`, 'note': 'low-rank Q projection A', 'bias': false, 'has_scale': true } },
      { name: 'wq_b (LoRA B)', type: 'attention', icon: '📊', shape: [qLoraR, A * headDim], params: wqB, details: { 'shape': `${qLoraR} x ${A * headDim}`, 'note': 'low-rank Q projection B', 'bias': false, 'has_scale': true } },
      { name: 'wkv (shared KV)', type: 'attention', icon: '📊', shape: [headDim, headDim * 2], params: wkv, details: { 'shape': `${headDim} x ${headDim * 2}`, 'note': 'shared KV MQA projection', 'bias': false, 'has_scale': true } },
      { name: 'wo_a (LoRA A)', type: 'attention', icon: '📊', shape: [A * headDim, oLoraR], params: woA, details: { 'shape': `${A * headDim} x ${oLoraR}`, 'note': `grouped output proj A (${oGroups} groups)`, 'bias': false, 'has_scale': true } },
      { name: 'wo_b (LoRA B)', type: 'attention', icon: '📊', shape: [oLoraR, H], params: woB, details: { 'shape': `${oLoraR} x ${H}`, 'note': 'grouped output proj B', 'bias': false, 'has_scale': true } },
      { name: 'q_norm', type: 'norm', icon: '📊', shape: [A * headDim], params: qNorm, details: { 'type': 'rms', 'bias': true } },
      { name: 'kv_norm', type: 'norm', icon: '📊', shape: [headDim], params: kvNorm, details: { 'type': 'rms', 'bias': true } },
      { name: 'attn_sink', type: 'norm', icon: '📊', shape: [headDim], params: attnSink, details: { 'note': 'attention sink token' } },
    ];
    if (compressRatio > 0) {
      attnChildren.push({
        name: `Compressor (ratio=${compressRatio})`, type: 'attention', icon: '🗜', params: compressorP,
        details: { 'compress_ratio': compressRatio, 'note': compressRatio === 4 ? 'CSA: light compress + sparse index' : 'HCA: heavy compress + dense attn' },
        children: [
          { name: 'wkv', type: 'attention', icon: '📊', params: headDim * headDim, details: { 'shape': `${headDim} x ${headDim}` } },
          { name: 'wgate', type: 'attention', icon: '🚪', params: headDim, details: { 'note': 'gate for compress ratio' } },
          { name: 'norm', type: 'norm', icon: '📊', params: headDim, details: { 'type': 'rms' } },
          { name: 'ape', type: 'norm', icon: '📊', params: headDim, details: { 'note': 'absolute position embedding' } },
        ]
      });
    }
    if (compressRatio === 4) {
      attnChildren.push({
        name: 'Indexer (Lightning)', type: 'attention', icon: '🔍', params: indexerP,
        details: { 'index_n_heads': indexNH, 'index_head_dim': indexHD, 'index_topk': indexTopk, 'note': 'sparse top-k selection for CSA' },
        children: [
          { name: 'wq_b', type: 'attention', icon: '📊', params: qLoraR * indexNH * indexHD, details: { 'shape': `${qLoraR} x ${indexNH * indexHD}`, 'has_scale': true } },
          { name: 'weights_proj', type: 'attention', icon: '📊', params: indexNH * indexHD * headDim, details: { 'shape': `${indexNH * indexHD} x ${headDim}` } },
          { name: 'compressor (inner)', type: 'attention', icon: '🗜', params: headDim * headDim, details: { 'note': 'inner compressor for indexer' } },
        ]
      });
    }

    return {
      name: `Layer ${i} (${attnType})`,
      type: 'layer', icon: '🧱', _layerType: attnType,
      params: totalParams,
      details: {
        'hidden_size': H, 'attention_type': attnType,
        'compress_ratio': compressRatio,
        'sliding_window': swa, 'q_lora_rank': qLoraR,
        'o_lora_rank': oLoraR, 'o_groups': oGroups,
        'head_dim': headDim, 'qk_rope_head_dim': qkRopeDim,
        'is_moe': numExp > 0,
        'data_source': 'safetensors + config',
      },
      children: [
        { name: 'RMSNorm 1', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'weight': 'attn_norm.weight' } },
        {
          name: `Attention (${attnType})`, type: 'attention', icon: '⚡',
          _layerType: attnType,
          params: attnParams,
          details: {
            'mechanism': compressRatio === 4 ? 'CSA (Compressed Sparse Attention)' : compressRatio === 128 ? 'HCA (Heavily Compressed Attention)' : 'SWA (Sliding Window Attention)',
            'low_rank_q': true, 'q_lora_rank': qLoraR, 'o_lora_rank': oLoraR,
            'shared_kv_mqa': true, 'grouped_output': oGroups,
            'rope_theta': ropeTheta, 'qk_rope_dim': qkRopeDim,
            'sub_tensors': 8 + (compressRatio > 0 ? 4 : 0) + (compressRatio === 4 ? 3 : 0),
          },
          children: attnChildren
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'hyper-connection' } },
        { name: 'RMSNorm 2', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'weight': 'ffn_norm.weight' } },
        mlpNode,
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'hyper-connection' } },
      ]
    };
  }

  _dsv4MtpLayer(i, H, A, KV, headDim, I, numExp, numExpPerTok, sharedExpI, qLoraR, oLoraR, oGroups, swa, indexNH, indexHD, indexTopk, qkRopeDim, rmsEps) {
    const normParams = H;
    const eProj = H * H;
    const attnParams = qLoraR * (A * headDim) + H * qLoraR + headDim * headDim * 2 + (A * headDim) * oLoraR + oLoraR * H + A * headDim + headDim + headDim;
    const mlpNode = numExp > 0 ? this._buildMoEMLP(H, I, numExp, numExpPerTok, sharedExpI, 'silu') : { name: 'MLP', type: 'ffn', icon: '🔀', params: 3 * H * I, details: {}, children: [] };
    return {
      name: `MTP Layer ${i}`, type: 'mtp', icon: '🔮', params: eProj + attnParams + mlpNode.params + 2 * normParams,
      details: { 'purpose': 'Next-Token Prediction', 'e_proj': `${H} x ${H}`, 'weight_prefix': `mtp.${i}` },
      children: [
        { name: 'e_proj', type: 'embedding', icon: '🔤', shape: [H, H], params: eProj, details: { 'shape': `${H} x ${H}`, 'has_scale': true } },
        { name: 'enorm', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'type': 'rms', 'eps': rmsEps } },
        { name: 'MTP Attention', type: 'attention', icon: '⚡', params: attnParams, details: { 'same_as_layer': true } },
        { name: 'MTP MLP', type: 'ffn', icon: '🔀', params: mlpNode.params, details: { 'is_moe': numExp > 0 } },
      ]
    };
  }

  // --- GLM-5.2 (DSA + MoE + Hyper-Connection) ---
  _parseGLM5() {
    const c = this.config;
    const H = c.hidden_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const KV = c.num_key_value_heads || A;
    const headDim = c.head_dim || (H / A);
    const V = c.vocab_size;
    const I = c.intermediate_size || H * 4;
    const moeI = c.moe_intermediate_size || I;
    const numExp = c.n_routed_experts || 0;
    const numExpPerTok = c.num_experts_per_tok || 0;
    const numSharedExp = c.n_shared_experts || 1;
    const sharedExpI = c.shared_expert_intermediate_size || moeI;
    const qLoraR = c.q_lora_rank || 2048;
    const kvLoraR = c.kv_lora_rank || 512;
    const qkNope = c.qk_nope_head_dim || headDim;
    const qkRope = c.qk_rope_head_dim || 64;
    const qkTotal = c.qk_head_dim || (qkNope + qkRope);
    const vHead = c.v_head_dim || headDim;
    const mtpLayers = c.num_nextn_predict_layers || 0;
    const rmsEps = c.rms_norm_eps || 1e-5;
    const firstKDense = c.first_k_dense_replace || 0;
    const mlpTypes = c.mlp_layer_types || [];
    const indexerTypes = c.indexer_types || [];
    const ropeTheta = (c.rope_parameters && c.rope_parameters.rope_theta) || c.rope_theta || 8000000;
    const normParams = H;

    // Count layer types
    const denseLayers = mlpTypes.filter(t => t === 'dense').length;
    const sparseLayers = mlpTypes.filter(t => t === 'sparse').length;
    const fullIndexer = indexerTypes.filter(t => t === 'full').length;
    const sharedIndexer = indexerTypes.filter(t => t === 'shared').length;

    const tree = {
      name: this.architectures[0] || 'GlmMoeDsaForCausalLM',
      type: 'model', icon: '🏛', params: 0,
      details: {
        'model_type': c.model_type,
        'architectures': (this.architectures || []).join(', '),
        'hidden_size': H, 'num_layers': L, 'attention_heads': A, 'kv_heads': KV,
        'head_dim': headDim, 'intermediate_size': I, 'moe_intermediate_size': moeI,
        'vocab_size': V, 'max_context': c.max_position_embeddings,
        'dtype': c.dtype || 'bfloat16',
        'n_routed_experts': numExp, 'experts_per_tok': numExpPerTok,
        'n_shared_experts': numSharedExp,
        'q_lora_rank': qLoraR, 'kv_lora_rank': kvLoraR,
        'qk_head_dim': qkTotal, 'qk_nope_head_dim': qkNope, 'qk_rope_head_dim': qkRope,
        'v_head_dim': vHead, 'rope_theta': ropeTheta,
        'first_k_dense_replace': firstKDense,
        'dense_layers': denseLayers, 'sparse_layers': sparseLayers,
        'full_indexer_layers': fullIndexer, 'shared_indexer_layers': sharedIndexer,
        'mtp_layers': mtpLayers, 'tie_embeddings': c.tie_word_embeddings,
        'scoring_func': c.scoring_func,
      },
      children: []
    };

    // Embeddings
    tree.children.push({
      name: 'Embeddings', type: 'embedding', icon: '📋', params: V * H,
      shape: [V, H], details: { 'vocab_size': V, 'hidden_size': H, 'weight': 'model.embed_tokens.weight' }
    });

    // Transformer layers
    const layerChildren = [];
    for (let i = 0; i < L; i++) {
      const isDenseMlp = (mlpTypes[i] === 'dense') || (i < firstKDense);
      const indexerType = indexerTypes[i] || 'shared';
      const layerNode = this._glm5Layer(i, H, A, KV, headDim, I, moeI, numExp, numExpPerTok, sharedExpI, qLoraR, kvLoraR, qkNope, qkRope, qkTotal, vHead, isDenseMlp, indexerType, rmsEps, ropeTheta);
      layerChildren.push(layerNode);
    }
    tree.children.push({
      name: `Transformer Layers (${L} layers, DSA + MoE)`,
      type: 'encoder', icon: '🔄', isLayerGroup: true, layerCount: L,
      details: {
        'layers': L, 'hidden_size': H, 'attention_heads': A,
        'attention': 'DSA (DeepSeek-style Attention)',
        'mlp_layer_types': `dense: ${denseLayers}, sparse: ${sparseLayers}`,
        'indexer_types': `full: ${fullIndexer}, shared: ${sharedIndexer}`,
        'is_moe': numExp > 0, 'num_experts': numExp, 'experts_per_tok': numExpPerTok,
        'first_k_dense_replace': firstKDense,
      },
      children: layerChildren
    });

    // Final norm
    tree.children.push({
      name: 'Final RMSNorm', type: 'norm', icon: '📊', shape: [H], params: normParams,
      details: { 'eps': rmsEps, 'weight': 'model.norm.weight' }
    });

    // LM Head
    const isTied = c.tie_word_embeddings === true;
    tree.children.push({
      name: 'LM Head', type: 'head', icon: '🎯',
      params: isTied ? 0 : H * V,
      details: { 'tied_weights': isTied, 'weight': 'lm_head.weight' },
      children: [ isTied
        ? { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'model.embed_tokens.weight' } }
        : { name: 'Output Projection', type: 'head', icon: '📤', shape: [H, V], params: H * V, details: { 'weight': 'lm_head.weight', 'no_bias': true } }
      ]
    });

    // MTP
    if (mtpLayers > 0) {
      tree.children.push({
        name: mtpLayers > 1 ? `MTP Head (${mtpLayers} layers)` : 'MTP Head',
        type: 'mtp', icon: '🔮', params: 0,
        details: { 'mtp_layers': mtpLayers, 'purpose': 'Multi-Token Prediction (NextN)' },
        children: Array.from({ length: mtpLayers }, (_, i) => ({
          name: `MTP Layer ${i}`, type: 'mtp', icon: '🔮', params: 0,
          details: { 'purpose': 'Next-Token Prediction' },
          children: [
            { name: 'Shared Head Norm', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'note': 'shared_head.norm', 'type': 'rms' } },
          ]
        }))
      });
    }

    this._calcTreeParams(tree);
    return tree;
  }

  _glm5Layer(i, H, A, KV, headDim, I, moeI, numExp, numExpPerTok, sharedExpI, qLoraR, kvLoraR, qkNope, qkRope, qkTotal, vHead, isDenseMlp, indexerType, rmsEps, ropeTheta) {
    const normParams = H;
    // DSA attention: q_a/q_b low-rank + kv_a_proj_with_mqa + kv_b_proj + indexer + o_proj
    const qA = H * qLoraR;
    const qB = qLoraR * (A * qkTotal);
    const kvA = H * (kvLoraR + qkRope); // kv_a_proj_with_mqa: [H, kvLoraR + qkRope]
    const kvALN = kvLoraR; // kv_a_layernorm
    const kvB = (kvLoraR + qkRope) * (KV * vHead); // kv_b_proj: [kvLoraR+qkRope, KV*vHead]
    const oProj = A * qkTotal * H; // o_proj: [A*qkTotal, H]
    const qALN = qLoraR; // q_a_layernorm
    // Indexer params
    const indexNH = 32, indexHD = 128;
    const indexerWkB = (kvLoraR + qkRope) * (indexNH * indexHD);
    const indexerWqB = qLoraR * (indexNH * indexHD);
    const indexerWP = indexNH * indexHD * headDim;
    const indexerKNorm = indexNH * indexHD;
    const indexerP = indexerWkB + indexerWqB + indexerWP + indexerKNorm;
    // Shared head norm
    const sharedHeadNorm = H;

    const attnParams = qA + qB + kvA + kvALN + kvB + oProj + qALN + (indexerType === 'shared' ? indexerP : 0) + sharedHeadNorm;

    // MLP
    const mlpNode = (!isDenseMlp && numExp > 0)
      ? this._buildMoEMLP(H, moeI, numExp, numExpPerTok, sharedExpI, 'silu')
      : { name: 'MLP (Dense SwiGLU)', type: 'ffn', icon: '🔀', params: 3 * H * I,
          details: { 'gate_proj': `${H} x ${I}`, 'up_proj': `${H} x ${I}`, 'down_proj': `${I} x ${H}`, 'activation': 'silu' },
          children: [
            { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'shape': `${I} x ${H}`, 'bias': false } },
          ]
        };

    // Hyper-connection: eh_proj
    const ehProj = H * H; // eh_proj.weight: [H, H]

    const totalParams = attnParams + mlpNode.params + 2 * normParams + ehProj;

    const attnChildren = [
      { name: 'q_a_proj', type: 'attention', icon: '📊', shape: [H, qLoraR], params: qA, details: { 'shape': `${H} x ${qLoraR}`, 'note': 'low-rank Q A', 'bias': false } },
      { name: 'q_a_layernorm', type: 'norm', icon: '📊', shape: [qLoraR], params: qALN, details: { 'type': 'rms' } },
      { name: 'q_b_proj', type: 'attention', icon: '📊', shape: [qLoraR, A * qkTotal], params: qB, details: { 'shape': `${qLoraR} x ${A * qkTotal}`, 'note': 'low-rank Q B', 'bias': false } },
      { name: 'kv_a_proj_with_mqa', type: 'attention', icon: '📊', shape: [H, kvLoraR + qkRope], params: kvA, details: { 'shape': `${H} x ${kvLoraR + qkRope}`, 'note': 'KV A (MLA-style, fused RoPE)', 'bias': false } },
      { name: 'kv_a_layernorm', type: 'norm', icon: '📊', shape: [kvLoraR], params: kvALN, details: { 'type': 'rms' } },
      { name: 'kv_b_proj', type: 'attention', icon: '📊', shape: [kvLoraR + qkRope, KV * vHead], params: kvB, details: { 'shape': `${kvLoraR + qkRope} x ${KV * vHead}`, 'note': 'KV B projection', 'bias': false } },
      { name: 'o_proj', type: 'attention', icon: '📤', shape: [A * qkTotal, H], params: oProj, details: { 'shape': `${A * qkTotal} x ${H}`, 'bias': false } },
    ];
    // Indexer (always present, but 'shared' means shared across layers)
    attnChildren.push({
      name: `Indexer (${indexerType})`, type: 'attention', icon: '🔍', params: indexerP,
      details: { 'indexer_type': indexerType, 'note': indexerType === 'full' ? 'full indexer (own weights)' : 'shared indexer (weights shared across layers)' },
      children: [
        { name: 'wk', type: 'attention', icon: '📊', params: indexerWkB, details: { 'note': 'key projection for indexer' } },
        { name: 'wq_b', type: 'attention', icon: '📊', params: indexerWqB, details: { 'note': 'query projection B for indexer' } },
        { name: 'weights_proj', type: 'attention', icon: '📊', params: indexerWP, details: { 'note': 'project indexer output' } },
        { name: 'k_norm', type: 'norm', icon: '📊', params: indexerKNorm, details: { 'type': 'rms', 'bias': true } },
      ]
    });

    return {
      name: `Layer ${i} (${isDenseMlp ? 'Dense' : 'MoE'} MLP, ${indexerType} indexer)`,
      type: 'layer', icon: '🧱',
      params: totalParams,
      details: {
        'hidden_size': H, 'mlp_type': isDenseMlp ? 'dense' : 'sparse_moe',
        'indexer_type': indexerType,
        'q_lora_rank': qLoraR, 'kv_lora_rank': kvLoraR,
        'qk_nope': qkNope, 'qk_rope': qkRope, 'qk_total': qkTotal, 'v_head_dim': vHead,
        'is_moe': !isDenseMlp && numExp > 0,
        'rope_theta': ropeTheta,
        'data_source': 'safetensors + config',
      },
      children: [
        { name: 'input_layernorm', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        {
          name: 'DSA Attention', type: 'attention', icon: '⚡',
          params: attnParams,
          details: {
            'mechanism': 'DSA (DeepSeek-style Attention with low-rank Q/KV + Indexer)',
            'q_lora_rank': qLoraR, 'kv_lora_rank': kvLoraR,
            'qk_nope_head_dim': qkNope, 'qk_rope_head_dim': qkRope,
            'v_head_dim': vHead, 'rope_theta': ropeTheta,
            'has_indexer': true, 'indexer_type': indexerType,
          },
          children: attnChildren
        },
        { name: 'eh_proj (Hyper-Conn)', type: 'norm', icon: '🔗', shape: [H, H], params: ehProj, details: { 'note': 'hyper-connection projection', 'weight': 'eh_proj.weight' } },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'post_attention_layernorm', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        mlpNode,
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
      ]
    };
  }

  // --- OpenPangu V2 (DSA + MHC + MoE) ---
  _parseOpenPanguV2() {
    const c = this.config;
    const H = c.hidden_size;
    const V = c.vocab_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const I = c.intermediate_size || c.moe_intermediate_size || H * 4;
    const rmsEps = c.rms_norm_eps;
    const ropeTheta = c.rope_theta;
    const qLora = c.q_lora_rank;
    const kvLora = c.kv_lora_rank;
    const qkNope = c.qk_nope_head_dim;
    const qkRope = c.qk_rope_head_dim;
    const vHead = c.v_head_dim;
    const idxHead = c.index_head_dim;
    const idxN = c.index_n_heads;
    const idxTopk = c.index_topk;
    const paramSink = c.param_sink_number;
    const mhcStreams = c.mhc_num_stream;
    const mhcRecurNorm = c.mhc_recur_norm;

    // Layer type detection
    const dsaLayers = c.dsa_layers || [];
    const swaLayers = c.swa_layers || [];
    const firstDense = c.first_k_dense_replace || 0;
    const numNextN = c.num_nextn_predict_layers || 0;
    const numExp = c.n_routed_experts || 0;
    const numExpPerTok = c.num_experts_per_tok || 0;
    const numSharedExp = c.n_shared_experts || 0;
    const moeI = c.moe_intermediate_size || I;
    const sharedExpI = c.moe_intermediate_size || moeI;
    const routedScale = c.routed_scaling_factor || 1;
    const blockPostLnIdx = c.block_post_layernorm_idx || [];
    const slidingWindow = c.sliding_window || 0;

    const tree = {
      name: this.architectures[0] || 'OpenPanguV2ForCausalLM',
      type: 'model',
      icon: '🏛',
      params: 0,
      details: {
        'model_type': c.model_type,
        'architectures': (this.architectures || []).join(', '),
        'hidden_size': H,
        'num_layers': L,
        'attention_heads': A,
        'q_lora_rank': qLora,
        'kv_lora_rank': kvLora,
        'qk_nope_head_dim': qkNope,
        'qk_rope_head_dim': qkRope,
        'v_head_dim': vHead,
        'index_head_dim': idxHead,
        'index_n_heads': idxN,
        'index_topk': idxTopk,
        'intermediate_size': I,
        'moe_intermediate_size': moeI,
        'n_routed_experts': numExp,
        'n_shared_experts': numSharedExp,
        'num_experts_per_tok': numExpPerTok,
        'vocab_size': V,
        'max_context': c.max_position_embeddings,
        'dtype': c.dtype || 'float32',
        'use_mhc': c.use_mhc,
        'use_mome': c.use_mome,
        'mhc_num_stream': mhcStreams,
        'mhc_recur_norm': mhcRecurNorm,
        'param_sink_number': paramSink,
        'sliding_window': slidingWindow,
        'dsa_layers_count': dsaLayers.length,
        'swa_layers_count': swaLayers.length,
        'first_k_dense_replace': firstDense,
        'num_nextn_predict_layers': numNextN,
        'tie_embeddings': c.tie_word_embeddings,
        'routed_scaling_factor': routedScale,
      },
      children: []
    };

    // Embedding
    tree.children.push({
      name: 'Embedding',
      type: 'embedding',
      icon: '🔤',
      params: V * H,
      shape: [V, H],
      details: { 'shape': `${V} x ${H}`, 'tensor': 'model.embed_tokens.weight' }
    });

    // Merge MHC module (top-level)
    tree.children.push({
      name: 'Merge MHC Module',
      type: 'other',
      icon: '🔗',
      params: mhcStreams * H + H + H + H * H,
      details: { 'type': 'merge_mhc', 'num_streams': mhcStreams, 'tensor': 'model.merge_mhc_module.*' },
      children: [
        { name: 'branch_alpha_pre', type: 'other', icon: '🔗', shape: [mhcStreams], params: mhcStreams, details: { 'shape': `[${mhcStreams}]`, 'tensor': 'model.merge_mhc_module.branch_alpha_pre' } },
        { name: 'branch_beta_pre', type: 'other', icon: '🔗', shape: [mhcStreams], params: mhcStreams, details: { 'shape': `[${mhcStreams}]`, 'tensor': 'model.merge_mhc_module.branch_beta_pre' } },
        { name: 'norm_gamma', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'shape': `[${H}]`, 'tensor': 'model.merge_mhc_module.norm_gamma' } },
        { name: 'phi', type: 'other', icon: '🔗', shape: [H, H], params: H * H, details: { 'shape': `${H} x ${H}`, 'tensor': 'model.merge_mhc_module.phi.weight' } },
      ]
    });

    // Transformer layers
    const layerChildren = [];
    for (let i = 0; i < L; i++) {
      const isDSA = dsaLayers.includes(i);
      const isSWA = swaLayers.includes(i);
      const isDenseMLP = i < firstDense;
      const hasBlockPostLn = blockPostLnIdx.includes(i);
      layerChildren.push(this._panguLayer(i, H, A, I, rmsEps, qLora, kvLora, qkNope, qkRope, vHead, idxHead, idxN, idxTopk, paramSink, mhcStreams, isDSA, isSWA, isDenseMLP, hasBlockPostLn, numExp, numExpPerTok, moeI, numSharedExp, sharedExpI, routedScale, c));
    }
    tree.children.push({
      name: 'Transformer Layers',
      type: 'layer-group',
      icon: '📚',
      params: 0,
      isLayerGroup: true,
      layerCount: L,
      details: { 'count': L, 'dsa_layers': dsaLayers.length, 'swa_layers': swaLayers.length, 'dense_mlp_layers': firstDense },
      children: layerChildren
    });

    // Final norm
    tree.children.push({
      name: 'Final RMSNorm',
      type: 'norm',
      icon: '📊',
      params: H,
      shape: [H],
      details: { 'eps': rmsEps, 'type': 'rms', 'tensor': 'model.norm.weight' }
    });

    // LM Head
    if (!c.tie_word_embeddings) {
      tree.children.push({
        name: 'LM Head',
        type: 'output',
        icon: '🎯',
        params: H * V,
        shape: [H, V],
        details: { 'shape': `${H} x ${V}`, 'bias': false, 'tensor': 'lm_head.weight' }
      });
    }

    // MTP / NextN layers (final output stage, above LM Head after reversal)
    if (numNextN > 0) {
      tree.children.push({
        name: 'NextN (MTP) Head',
        type: 'mtp',
        icon: '🔮',
        params: numNextN * (H * V + H),
        details: { 'num_nextn_layers': numNextN, 'type': 'nextn_predict' },
        children: Array.from({ length: numNextN }, (_, mi) => ({
          name: `MTP Layer ${mi}`,
          type: 'mtp',
          icon: '🔮',
          params: H * V + H,
          details: { 'embed': `${H} x ${V}`, 'norm': H, 'tensor_prefix': `model.layers.${L + mi}` },
          children: [
            { name: 'embed', type: 'embedding', icon: '🔤', shape: [V, H], params: H * V, details: { 'shape': `${V} x ${H}`, 'bias': false } },
            { name: 'enorm', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'eps': rmsEps, 'type': 'rms' } },
          ]
        }))
      });
    }

    return tree;
  }

  _panguLayer(i, H, A, I, rmsEps, qLora, kvLora, qkNope, qkRope, vHead, idxHead, idxN, idxTopk, paramSink, mhcStreams, isDSA, isSWA, isDenseMLP, hasBlockPostLn, numExp, numExpPerTok, moeI, numSharedExp, sharedExpI, routedScale, c) {
    const headTotal = qkNope + qkRope;
    // Attention params (DSA style: q_lora -> q_b, kv_a -> kv_b, indexer)
    const qA = H * qLora;  // q_a_proj: H x qLora
    const qB = qLora * A * headTotal;  // q_b_proj: qLora x (A * headTotal)
    const qNorm = qLora;  // q_a_layernorm
    const kvA = H * (kvLora + qkRope);  // kv_a_proj_with_mqa: H x (kvLora + rope)
    const kvANorm = kvLora;  // kv_a_layernorm
    const kvB = kvLora * (A * (qkNope + vHead));  // kv_b_proj
    const oProj = A * headTotal * H;  // o_proj
    const idxWQ = qLora * idxN * idxHead;  // indexer.wq_b (low-rank q -> index)
    const idxWK = kvLora * idxN * idxHead;  // indexer.wk
    const idxWeights = idxN * idxHead * A;  // indexer.weights_proj
    const idxKNorm = idxN * idxHead;  // indexer.k_norm
    const compKV = H * H;  // compresskv_conv (approx)
    const paramSinkKV = paramSink * A * vHead;  // param_sink_compressed_kv
    const paramSinkPE = paramSink * qkRope;  // param_sink_k_pe
    const oConv = H * H;  // o_conv
    const qaConv = qLora * qLora;  // qa_conv
    const attnParams = qA + qB + qNorm + kvA + kvANorm + kvB + oProj + idxWQ + idxWK + idxWeights + idxKNorm + compKV + paramSinkKV + paramSinkPE + oConv + qaConv;

    // MHC attention module
    const mhcAttnParams = mhcStreams * H + mhcStreams * H + H + H * H;  // branch_alpha + beta + gamma + phi

    // MLP params
    let mlpNode;
    if (isDenseMLP) {
      const gateProj = H * I;
      const upProj = H * I;
      const downProj = I * H;
      const mlpParams = gateProj + upProj + downProj;
      mlpNode = {
        name: 'MLP (SwiGLU Dense)',
        type: 'ffn',
        icon: '🔀',
        params: mlpParams,
        details: { 'gate': `${H} x ${I}`, 'up': `${H} x ${I}`, 'down': `${I} x ${H}`, 'activation': 'silu', 'tensor_prefix': `model.layers.${i}.mlp` },
        children: [
          { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, I], params: gateProj, details: { 'shape': `${H} x ${I}`, 'bias': false, 'tensor': `model.layers.${i}.mlp.gate_proj.weight` } },
          { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, I], params: upProj, details: { 'shape': `${H} x ${I}`, 'bias': false, 'tensor': `model.layers.${i}.mlp.up_proj.weight` } },
          { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [I, H], params: downProj, details: { 'shape': `${I} x ${H}`, 'bias': false, 'tensor': `model.layers.${i}.mlp.down_proj.weight` } },
        ]
      };
    } else {
      mlpNode = this._buildMoEMLP(H, moeI, numExp, numExpPerTok, sharedExpI, 'silu');
    }

    // MHC MLP module
    const mhcMlpParams = mhcStreams * H + mhcStreams * H + H + H * H;

    const ehProj = H * H;  // eh_proj
    const sharedHead = H * H + H;  // shared_head (head + norm)
    const totalParams = attnParams + mhcAttnParams + (mlpNode.params || 0) + mhcMlpParams + ehProj + sharedHead + H * 5 + (hasBlockPostLn ? H : 0);

    const layerTypeStr = isDSA ? 'DSA (full attn)' : `SWA (window=${c.sliding_window || 512})`;
    const mlpTypeStr = isDenseMLP ? 'Dense MLP' : `MoE (${numExp} experts, top-${numExpPerTok})`;

    const children = [];

    // Block post layernorm (if applicable)
    if (hasBlockPostLn) {
      children.push({
        name: 'Block Post LayerNorm',
        type: 'norm',
        icon: '📊',
        shape: [H],
        params: H,
        details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.block_post_layernorm.weight` }
      });
    }

    // Self attention
    children.push({
      name: 'Input RMSNorm',
      type: 'norm',
      icon: '📊',
      shape: [H],
      params: H,
      details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.input_layernorm.weight` }
    });

    children.push({
      name: `Self Attention (${layerTypeStr})`,
      type: 'attention',
      icon: '👁',
      params: attnParams,
      details: {
        'q_lora': `${H} x ${qLora}`,
        'q_b': `${qLora} x ${A * headTotal}`,
        'kv_lora': `${H} x ${kvLora + qkRope}`,
        'kv_b': `${kvLora} x ${A * (qkNope + vHead)}`,
        'o_proj': `${A * headTotal} x ${H}`,
        'indexer': `${idxN} heads, topk=${idxTopk}`,
        'param_sink': paramSink,
        'sliding_window': isSWA ? (c.sliding_window || 512) : 'none',
        'tensor_prefix': `model.layers.${i}.self_attn`
      },
      children: [
        { name: 'q_a_proj', type: 'attention', icon: '⬇', shape: [H, qLora], params: qA, details: { 'shape': `${H} x ${qLora}`, 'bias': false, 'tensor': `model.layers.${i}.self_attn.q_a_proj.weight` } },
        { name: 'q_a_layernorm', type: 'norm', icon: '📊', shape: [qLora], params: qNorm, details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.self_attn.q_a_layernorm.weight` } },
        { name: 'q_b_proj', type: 'attention', icon: '⬆', shape: [qLora, A * headTotal], params: qB, details: { 'shape': `${qLora} x ${A * headTotal}`, 'bias': false, 'tensor': `model.layers.${i}.self_attn.q_b_proj.weight` } },
        { name: 'kv_a_proj_with_mqa', type: 'attention', icon: '⬇', shape: [H, kvLora + qkRope], params: kvA, details: { 'shape': `${H} x ${kvLora + qkRope}`, 'bias': false, 'tensor': `model.layers.${i}.self_attn.kv_a_proj_with_mqa.weight` } },
        { name: 'kv_a_layernorm', type: 'norm', icon: '📊', shape: [kvLora], params: kvANorm, details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.self_attn.kv_a_layernorm.weight` } },
        { name: 'kv_b_proj', type: 'attention', icon: '⬆', shape: [kvLora, A * (qkNope + vHead)], params: kvB, details: { 'shape': `${kvLora} x ${A * (qkNope + vHead)}`, 'bias': false, 'tensor': `model.layers.${i}.self_attn.kv_b_proj.weight` } },
        {
          name: 'Indexer',
          type: 'attention',
          icon: '🔍',
          params: idxWQ + idxWK + idxWeights + idxKNorm,
          details: { 'n_heads': idxN, 'head_dim': idxHead, 'topk': idxTopk, 'tensor_prefix': `model.layers.${i}.self_attn.indexer` },
          children: [
            { name: 'wq_b', type: 'attention', icon: '⬆', shape: [qLora, idxN * idxHead], params: idxWQ, details: { 'shape': `${qLora} x ${idxN * idxHead}`, 'tensor': `model.layers.${i}.self_attn.indexer.wq_b.weight` } },
            { name: 'wk', type: 'attention', icon: '⬆', shape: [kvLora, idxN * idxHead], params: idxWK, details: { 'shape': `${kvLora} x ${idxN * idxHead}`, 'tensor': `model.layers.${i}.self_attn.indexer.wk.weight` } },
            { name: 'weights_proj', type: 'attention', icon: '⚖', shape: [idxN * idxHead, A], params: idxWeights, details: { 'shape': `${idxN * idxHead} x ${A}`, 'tensor': `model.layers.${i}.self_attn.indexer.weights_proj.weight` } },
            { name: 'k_norm', type: 'norm', icon: '📊', shape: [idxN * idxHead], params: idxKNorm, details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.self_attn.indexer.k_norm.weight` } },
          ]
        },
        { name: 'compresskv_conv', type: 'attention', icon: '🗜', shape: [H, H], params: compKV, details: { 'shape': `${H} x ${H}`, 'tensor': `model.layers.${i}.self_attn.compresskv_conv.weight` } },
        { name: 'o_proj', type: 'attention', icon: '⬆', shape: [A * headTotal, H], params: oProj, details: { 'shape': `${A * headTotal} x ${H}`, 'bias': false, 'tensor': `model.layers.${i}.self_attn.o_proj.weight` } },
        { name: 'o_conv', type: 'attention', icon: '🗜', shape: [H, H], params: H * H, details: { 'shape': `${H} x ${H}`, 'tensor': `model.layers.${i}.self_attn.o_conv.weight` } },
        { name: 'param_sink_compressed_kv', type: 'attention', icon: '💾', shape: [paramSink, A * vHead], params: paramSinkKV, details: { 'shape': `${paramSink} x ${A * vHead}`, 'tensor': `model.layers.${i}.self_attn.param_sink_compressed_kv` } },
        { name: 'param_sink_k_pe', type: 'attention', icon: '💾', shape: [paramSink, qkRope], params: paramSinkPE, details: { 'shape': `${paramSink} x ${qkRope}`, 'tensor': `model.layers.${i}.self_attn.param_sink_k_pe` } },
        { name: 'qa_conv', type: 'attention', icon: '🗜', shape: [qLora, qLora], params: qLora * qLora, details: { 'shape': `${qLora} x ${qLora}`, 'tensor': `model.layers.${i}.self_attn.qa_conv.weight` } },
      ]
    });

    // Attention MHC module
    children.push({
      name: 'Attn MHC Module',
      type: 'other',
      icon: '🔗',
      params: mhcAttnParams,
      details: { 'type': 'attn_mhc', 'num_streams': mhcStreams, 'tensor_prefix': `model.layers.${i}.attn_mhc_module` },
      children: [
        { name: 'branch_alpha', type: 'other', icon: '🔗', shape: [mhcStreams], params: mhcStreams, details: { 'shape': `[${mhcStreams}]`, 'tensor': `model.layers.${i}.attn_mhc_module.branch_alpha` } },
        { name: 'branch_beta', type: 'other', icon: '🔗', shape: [mhcStreams], params: mhcStreams, details: { 'shape': `[${mhcStreams}]`, 'tensor': `model.layers.${i}.attn_mhc_module.branch_beta` } },
        { name: 'norm_gamma', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'shape': `[${H}]`, 'tensor': `model.layers.${i}.attn_mhc_module.norm_gamma` } },
        { name: 'phi', type: 'other', icon: '🔗', shape: [H, H], params: H * H, details: { 'shape': `${H} x ${H}`, 'tensor': `model.layers.${i}.attn_mhc_module.phi.weight` } },
      ]
    });

    // eh_proj (hyper-connection projection)
    children.push({
      name: 'eh_proj',
      type: 'other',
      icon: '🔗',
      params: H * H,
      shape: [H, H],
      details: { 'shape': `${H} x ${H}`, 'tensor': `model.layers.${i}.eh_proj.weight` }
    });

    // Post-attention layernorm
    children.push({
      name: 'Post-Attn RMSNorm',
      type: 'norm',
      icon: '📊',
      shape: [H],
      params: H,
      details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.post_attention_layernorm.weight` }
    });

    // Pre-MLP layernorm
    children.push({
      name: 'Pre-MLP RMSNorm',
      type: 'norm',
      icon: '📊',
      shape: [H],
      params: H,
      details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.pre_mlp_layernorm.weight` }
    });

    // MLP
    children.push(mlpNode);

    // MLP MHC module
    children.push({
      name: 'MLP MHC Module',
      type: 'other',
      icon: '🔗',
      params: mhcMlpParams,
      details: { 'type': 'mlp_mhc', 'num_streams': mhcStreams, 'tensor_prefix': `model.layers.${i}.mlp_mhc_module` },
      children: [
        { name: 'branch_alpha', type: 'other', icon: '🔗', shape: [mhcStreams], params: mhcStreams, details: { 'shape': `[${mhcStreams}]`, 'tensor': `model.layers.${i}.mlp_mhc_module.branch_alpha` } },
        { name: 'branch_beta', type: 'other', icon: '🔗', shape: [mhcStreams], params: mhcStreams, details: { 'shape': `[${mhcStreams}]`, 'tensor': `model.layers.${i}.mlp_mhc_module.branch_beta` } },
        { name: 'norm_gamma', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'shape': `[${H}]`, 'tensor': `model.layers.${i}.mlp_mhc_module.norm_gamma` } },
        { name: 'phi', type: 'other', icon: '🔗', shape: [H, H], params: H * H, details: { 'shape': `${H} x ${H}`, 'tensor': `model.layers.${i}.mlp_mhc_module.phi.weight` } },
      ]
    });

    // Post-MLP layernorm
    children.push({
      name: 'Post-MLP RMSNorm',
      type: 'norm',
      icon: '📊',
      shape: [H],
      params: H,
      details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.post_mlp_layernorm.weight` }
    });

    // Shared head (present in some layers)
    children.push({
      name: 'Shared Head',
      type: 'output',
      icon: '🤝',
      params: H * H + H,
      details: { 'shape': `${H} x ${H}`, 'tensor_prefix': `model.layers.${i}.shared_head` },
      children: [
        { name: 'head', type: 'output', icon: '🎯', shape: [H, H], params: H * H, details: { 'shape': `${H} x ${H}`, 'tensor': `model.layers.${i}.shared_head.head.weight` } },
        { name: 'norm', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.shared_head.norm.weight` } },
      ]
    });

    // hnorm
    children.push({
      name: 'hnorm',
      type: 'norm',
      icon: '📊',
      shape: [H],
      params: H,
      details: { 'eps': rmsEps, 'type': 'rms', 'tensor': `model.layers.${i}.hnorm.weight` }
    });

    return {
      name: `Layer ${i} (${layerTypeStr}, ${mlpTypeStr})`,
      type: 'layer',
      icon: '🔧',
      params: totalParams,
      details: {
        'layer_idx': i,
        'attn_type': layerTypeStr,
        'mlp_type': mlpTypeStr,
        'has_block_post_ln': hasBlockPostLn,
        'mhc_streams': mhcStreams,
      },
      children
    };
  }

  // --- Generic fallback ---
  _parseGeneric() {
    const c = this.config;
    const H = c.hidden_size || c.d_model;
    const V = c.vocab_size;
    const L = c.num_hidden_layers || c.num_layers;
    const A = c.num_attention_heads || c.n_head;
    const I = c.intermediate_size || c.d_ff || (H ? H * 4 : 0);

    const tree = {
      name: this.architectures[0] || `${this.modelType}Model`,
      type: 'model',
      icon: '🏛',
      params: 0,
      details: {},
      children: []
    };

    if (H && V) {
      tree.children.push({
        name: 'Embeddings',
        type: 'embedding',
        icon: '📋',
        params: V * H,
        shape: [V, H],
        details: { 'vocab_size': V, 'hidden_size': H }
      });
    }

    if (L && H) {
      const perLayerParams = A ? (4 * H * H + 2 * H * I) : 0;
      tree.children.push({
        name: `Layers (${L} blocks)`,
        type: 'encoder',
        icon: '🔄',
        isLayerGroup: true,
        layerCount: L,
        params: perLayerParams * L,
        details: { 'layers': L, 'hidden_size': H, 'attention_heads': A, 'intermediate_size': I },
        children: Array.from({ length: L }, (_, i) => ({
          name: `Layer ${i}`,
          type: 'layer',
          icon: '🧱',
          params: perLayerParams,
          details: { 'hidden_size': H, 'attention_heads': A, 'intermediate_size': I },
          children: [
            { name: 'Self-Attention', type: 'attention', icon: '⚡', params: 4 * H * H, details: { 'num_heads': A, 'head_dim': A ? H / A : '?' } },
            { name: 'Feed-Forward', type: 'ffn', icon: '🔀', params: 2 * H * I, details: { 'intermediate_size': I } }
          ]
        }))
      });
      if (L > 32) {
        tree.children[tree.children.length - 1]._truncated = true;
        tree.children[tree.children.length - 1]._totalLayers = L;
      }
    }

    this._calcTreeParams(tree);
    return tree;
  }

  _calcTreeParams(node) {
    if (node.params === undefined || node.params === 0) {
      if (node.children && node.children.length > 0) {
        node.params = node.children.reduce((s, c) => s + this._calcTreeParams(c), 0);
      } else {
        node.params = node.params || 0;
      }
    }
    return node.params;
  }
}

// ============================================================
//  StructureExtractor — builds a generic model schema JSON
//  from safetensors index (structure ground truth) + config.json (dimensions).
//  No per-model-type hardcoding — works with any architecture.
// ============================================================
class StructureExtractor {
  constructor(config, sftData = null, rawIndex = null) {
    this.config = config;
    this.sftData = sftData;
    this.rawIndex = rawIndex;
    const c = config;
    this.H = c.hidden_size || c.d_model || 0;
    this.V = c.vocab_size || 0;
    this.L = c.num_hidden_layers || c.num_layers || 0;
    this.A = c.num_attention_heads || c.n_head || c.num_heads || 0;
    this.KV = c.num_key_value_heads || this.A;
    this.headDim = c.head_dim || (this.A ? Math.floor(this.H / this.A) : 0);
    this.I = c.intermediate_size || c.d_ff || (this.H ? this.H * 4 : 0);
    this.rmsEps = c.rms_norm_eps || c.layer_norm_eps || 1e-6;
    // MoE — support both naming conventions
    this.isMoE = (c.num_experts || c.n_routed_experts || c.num_local_experts || 0) > 0;
    this.numExperts = c.num_experts || c.n_routed_experts || c.num_local_experts || 0;
    this.expertsPerTok = c.num_experts_per_tok || 0;
    this.moeI = c.moe_intermediate_size || c.intermediate_size || 0;
    this.numSharedExp = c.n_shared_experts || c.num_shared_experts || 0;
    this.sharedExpI = c.shared_expert_intermediate_size || c.shared_intermediate_size || c.moe_intermediate_size || 0;
    this.firstKDense = c.first_k_dense_replace || 0;
    this.routedScale = c.routed_scaling_factor || 1;
    // Low-rank attention (DSA-style)
    this.qLora = c.q_lora_rank || 0;
    this.kvLora = c.kv_lora_rank || 0;
    this.qkNope = c.qk_nope_head_dim || 0;
    this.qkRope = c.qk_rope_head_dim || 0;
    this.vHead = c.v_head_dim || 0;
    // V4.1: if qk_nope_head_dim is missing but head_dim exists, derive it
    // V4.1 has head_dim=512, qk_rope_head_dim=64 → qk_nope = 512-64 = 448
    if (this.qkNope === 0 && this.headDim > 0 && this.qkRope > 0) {
      this.qkNope = this.headDim - this.qkRope;
    }
    // V4.1: if v_head_dim is missing, assume v_head = head_dim
    if (this.vHead === 0 && this.headDim > 0) {
      this.vHead = this.headDim;
    }
    // Indexer
    this.idxHead = c.index_head_dim || 0;
    this.idxN = c.index_n_heads || 0;
    this.idxTopk = c.index_topk || 0;
    this.paramSink = c.param_sink_number || 0;
    // MHC / hyper-connection
    this.useMHC = c.use_mhc || false;
    this.mhcStreams = c.mhc_num_stream || 0;
    // Linear attention (Mamba SSM)
    this.linKH = c.linear_num_key_heads || 0;
    this.linVH = c.linear_num_value_heads || 0;
    this.linKeyDim = c.linear_key_head_dim || 0;
    this.linValDim = c.linear_value_head_dim || 0;
    this.convK = c.linear_conv_kernel_dim || 0;
    // Layer type lists
    this.dsaLayers = c.dsa_layers || [];
    this.swaLayers = c.swa_layers || [];
    this.blockPostLnIdx = c.block_post_layernorm_idx || [];
    this.slidingWindow = c.sliding_window || 0;
    this.sandwichNorm = c.sandwich_norm || false;
    // Per-layer type arrays (config semantic → trie annotation)
    this.compressRatios = c.compress_ratios || [];       // DeepSeek-V4: CSA=4, HCA=128, SWA=0
    this.mlpLayerTypes = c.mlp_layer_types || [];          // GLM-5: 'dense'/'sparse'
    // Engram tracking — instance-level to prevent double counting across layers
    this._engramCounted = false;
    this.indexerTypes = c.indexer_types || [];             // GLM-5: 'full'/'shared'
    // Additional attention params
    this.oLoraR = c.o_lora_rank || 0;                     // DeepSeek-V4 grouped output
    this.oGroups = c.o_groups || 0;                        // DeepSeek-V4 output groups
    this.ropeTheta = c.rope_theta || (c.rope_parameters && c.rope_parameters.rope_theta) || 0;
    this.scoringFunc = c.scoring_func || '';               // MoE scoring function
    this.normTopkProb = c.norm_topk_prob !== undefined ? c.norm_topk_prob : true;
    // Hyper-connection (DeepSeek-V4 style)
    this.useHyperConn = c.hc_mult !== undefined || this.compressRatios.length > 0;
    this.hcMult = c.hc_mult || 0;
    // Quantization
    this.quantMethod = c.quantization_config ? c.quantization_config.quant_method : '';
    // Other
    this.mtpLayers = c.mtp_num_hidden_layers || c.num_nextn_predict_layers || c.num_mtp_modules || 0;
    this.isVLM = !!c._isMultimodal;
    this.vc = c._visionConfig || {};
    this.tieEmbed = c.tie_word_embeddings || false;
    // MiniMax-M3 style: moe_layer_freq array (0=dense, 1=MoE per layer)
    this.moeLayerFreq = c.moe_layer_freq || [];
    // Sparse attention (MiniMax-M3 style)
    this.sparseAttnCfg = c.sparse_attention_config || {};
    // MiniMax-M3: use_qk_norm, qk_norm_type
    this.useQKNorm = c.use_qk_norm || false;
    // MiniMax-M3: alternative naming for MoE container
    this.moeContainerName = 'block_sparse_moe';  // detected from safetensors at runtime
    // MiniMax-M3: alternative expert weight naming (w1/w2/w3 vs gate/up/down)
    this.expertWeightNames = ['w1', 'w2', 'w3'];  // detected from safetensors at runtime
    // MiniMax-M3: shared intermediate size and dense intermediate size
    this.sharedInterI = c.shared_intermediate_size || 0;
    this.denseInterI = c.dense_intermediate_size || c.intermediate_size || this.I;
    // MiniMax-M3: text architectures (causal LM name)
    this.textArchitectures = c._textArchitectures || null;
    // Build per-layer semantic map from config arrays
    this._layerMeta = this._buildLayerMeta();
  }

  // Build per-layer semantic metadata from config arrays.
  // This is the "config knowledge" that gets fused into the trie-based tree.
  _buildLayerMeta() {
    const meta = [];
    for (let i = 0; i < this.L; i++) {
      const m = {};
      // Attention type from compress_ratios (DeepSeek-V4)
      const cr = this.compressRatios[i];
      if (cr !== undefined) {
        m.attnType = cr === 4 ? 'CSA' : cr === 128 ? 'HCA' : cr === 0 ? 'SWA' : `ratio=${cr}`;
        m.compressRatio = cr;
        m.hasCompressor = cr > 0;
        m.hasIndexer = cr === 4;
      }
      // Attention type from dsa_layers / swa_layers (GLM-5 / openPangu)
      if (this.dsaLayers.includes(i)) { m.attnType = m.attnType || 'DSA'; m.isDSA = true; }
      if (this.swaLayers.includes(i)) { m.attnType = m.attnType || 'SWA'; m.isSWA = true; }
      // MLP type
      const mlpT = this.mlpLayerTypes[i];
      if (mlpT) { m.mlpType = mlpT; m.isDenseMLP = mlpT === 'dense'; }
      else m.isDenseMLP = i < this.firstKDense;
      // MiniMax-M3: moe_layer_freq array (0=dense, 1=MoE per layer)
      if (this.moeLayerFreq.length > 0) {
        m.isMoELayer = this.moeLayerFreq[i] === 1;
        m.isDenseMLP = !m.isMoELayer;
      } else {
        m.isMoELayer = this.isMoE && !m.isDenseMLP;
      }
      // Indexer type (GLM-5)
      const idxT = this.indexerTypes[i];
      if (idxT) { m.indexerType = idxT; m.hasIndexer = true; }
      // Block post layernorm
      m.hasBlockPostLn = this.blockPostLnIdx.includes(i);
      // Effective intermediate size
      // MiniMax-M3: dense layers use dense_intermediate_size, MoE layers use moe_intermediate_size
      if (this.moeLayerFreq.length > 0) {
        m.effI = m.isMoELayer ? this.moeI : this.denseInterI;
      } else {
        m.effI = m.isMoELayer ? this.moeI : this.I;
      }
      meta.push(m);
    }
    return meta;
  }

  // Get layer meta, clamped to valid range (MTP layers may exceed L)
  _getLayerMeta(idx) {
    // For MTP layers (idx >= L), use dspark MoE config if available
    // V4.1: dspark_n_routed_experts=128 (vs main 384), dspark_num_experts_per_tok=3
    if (idx >= this.L) {
      const dsparkExp = this.config.dspark_n_routed_experts || 0;
      const isDsparkMoE = dsparkExp > 0;
      return {
        isDenseMLP: !isDsparkMoE,
        isMoELayer: isDsparkMoE,
        effI: isDsparkMoE ? this.moeI : this.I,
        isMTP: true,
        numExperts: dsparkExp || this.numExperts,
        expertsPerTok: this.config.dspark_num_experts_per_tok || this.expertsPerTok,
      };
    }
    return this._layerMeta[idx] || {
      // Don't set attnType for out-of-range layers — let _buildLayerFromTrie
      // detect it from tensor names (DSA/Linear/Full)
      isDenseMLP: idx < this.firstKDense,
      isMoELayer: this.isMoE && idx >= this.firstKDense,
      effI: this.isMoE && idx >= this.firstKDense ? this.moeI : this.I,
      isMTP: false,
    };
  }

  extract() {
    if (this.rawIndex && this.rawIndex.weight_map) {
      const tree = this._buildFromSafetensors();
      this._calcParams(tree);
      this._reverseTree(tree);
      // Reorder top-level after reversal so the standard layout is preserved:
      // VLM: Language Model → MTP → LM Head → norm → Transformer Layers → Embeddings → Projector → Vision Encoder
      // Standard: MTP Head → LM Head → norm → Transformer Layers → Embeddings → (others)
      this._reorderTopLevel(tree);
      // For VLM, also reorder the Language Model subtree
      if (this.isVLM) {
