<style>

}

  --purple-soft: #1e1830;
  --red: #f87171;

  --orange: #fb923c;

/* ===== Header ===== */
.header {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}
.header-inner {
  max-width: 1600px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 20px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  white-space: nowrap;
}
.logo-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.search-group {
  flex: 1;
  display: flex;
  gap: 8px;
  max-width: 600px;
}
.search-input {
  flex: 1;
  padding: 10px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--sans);
  background: var(--bg-soft);
  color: var(--text);

  transition: border-color 0.15s;
}
.search-input:focus {
  border-color: var(--accent);
  background: var(--bg);
}
.search-input::placeholder { color: var(--text-faint); }

/* ===== Autocomplete dropdown ===== */
.search-wrapper {
  flex: 1;

  display: flex;
}
.suggestion-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;

  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  max-height: 320px;
  overflow-y: auto;
  z-index: 200;
  display: none;
}
.suggestion-dropdown.show { display: block; }
.suggestion-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  cursor: pointer;
  transition: background 0.08s;
  border-bottom: 1px solid var(--border);
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover, .suggestion-item.active {

}
.suggestion-item .sug-id {
  font-size: 13px;

}
.suggestion-item .sug-id .match { color: var(--accent); font-weight: 600; }
.suggestion-item .sug-org {
  font-size: 11px;
  color: var(--text-faint);

  padding: 1px 8px;
  border-radius: 10px;
  white-space: nowrap;
  flex-shrink: 0;
}
.suggestion-item .sug-tag {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text-faint);
  white-space: nowrap;
  flex-shrink: 0;
}
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--sans);
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(0.97); }
.btn-ghost {
  background: transparent;
  color: var(--text-soft);
  border: 1px solid var(--border);
}
.btn-ghost:hover {
  background: var(--bg-soft);
  border-color: var(--border-strong);
}
.btn-ghost:active { transform: scale(0.97); }
.btn-sm {
  padding: 5px 12px;
  font-size: 12px;
}
.header-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.theme-toggle {

}
.theme-toggle:hover { border-color: var(--border-strong); }

.quick-models {

  display: flex;
  gap: 8px;

  align-items: center;
}
.quick-label { font-size: 12px; color: var(--text-faint); margin-right: 4px; }
.quick-btn {
  padding: 4px 12px;
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-soft);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--mono);
}
.quick-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

/* ===== Main layout ===== */
.main {
  max-width: 1600px;
  margin: 0 auto;
  padding: 20px 24px 48px;
}
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-soft);
}
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--red);
}
.error-state h3 { margin-bottom: 8px; font-size: 18px; }
.error-state p { color: var(--text-soft); font-size: 14px; margin-bottom: 16px; }

/* ===== Summary card ===== */
.summary {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.summary-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.summary-title h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.summary-title .arch {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 10px;
  border-radius: 4px;
}
.summary-total {
  text-align: right;
}
.summary-total .num {
  font-size: 28px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--accent);
}
.summary-total .label { font-size: 12px; color: var(--text-soft); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.stat-item {
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.stat-item .stat-label {
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.stat-item .stat-value {
  font-size: 16px;
  font-weight: 600;
  font-family: var(--mono);
}

/* Parameter distribution bar */
.dist-bar {
  display: flex;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  margin-top: 16px;
  background: var(--bg-soft);
}
.dist-segment {
  height: 100%;
  transition: width 0.4s ease;
}
.dist-legend {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.dist-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-soft);
}
.dist-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

/* ===== Content split ===== */
.content-split {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 20px;
}
@media (max-width: 1100px) {
  .content-split { grid-template-columns: 1fr; }
}

/* ===== Tree card ===== */
.tree-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.tree-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-soft);
  flex-wrap: wrap;
  gap: 8px;
}
.tree-toolbar-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tree-toolbar-actions { display: flex; gap: 6px; }

/* Layer pagination */
.layer-pagination {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--accent-soft);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  flex-wrap: wrap;
}
.layer-pagination .label { color: var(--text-soft); }
.layer-range-input {
  width: 50px;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  text-align: center;
  outline: none;
}
.layer-range-input:focus { border-color: var(--accent); }

/* Middle layers collapse divider */
.layer-collapse-divider {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px 10px 28px;
  background: var(--bg-soft);
  border: 1px dashed var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  margin: 4px 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-soft);
  transition: all 0.15s;
  user-select: none;
}
.layer-collapse-divider:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--text);
}
.layer-collapse-divider .divider-icon {
  font-size: 14px;
  color: var(--accent);
  transition: transform 0.2s;
}
.layer-collapse-divider.expanded .divider-icon {
  transform: rotate(90deg);
}
.layer-collapse-divider .divider-count {
  font-weight: 600;
  color: var(--accent);
}
.layer-collapse-divider .divider-range {
  font-family: var(--mono);
  font-size: 12px;
  opacity: 0.8;
}
.layer-collapse-divider .divider-hint {
  margin-left: auto;
  font-size: 11px;
  opacity: 0.6;
}

/* ===== Tree nodes ===== */
.tree-container {
  padding: 8px;
  overflow-x: auto;
}
.tree-node {
  user-select: none;
}
.node-row {
  display: flex;
  align-items: center;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.1s;
  gap: 4px;
  position: relative;
}
.node-row:hover { background: var(--bg-soft); }
.node-row.selected {
  background: var(--accent-soft);
  box-shadow: inset 3px 0 0 var(--accent);
}
.node-toggle {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-faint);
  transition: transform 0.15s;
  flex-shrink: 0;
}
.node-toggle.expanded { transform: rotate(90deg); }
.node-toggle.leaf { visibility: hidden; }
.node-icon {
  width: 24px;
  height: 24px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}
.node-label {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}
.node-type-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  font-family: var(--mono);
  text-transform: uppercase;
  white-space: nowrap;
}
.node-params {
  margin-left: auto;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text-soft);
  white-space: nowrap;
  padding: 1px 8px;
  background: var(--bg-soft);
  border-radius: 10px;
}
.node-row:hover .node-params { background: var(--bg); }
.node-params.zero { color: var(--text-faint); }
.node-shape {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-faint);
  margin-left: 8px;
  white-space: nowrap;
}
.children-container {
  margin-left: 16px;
  border-left: 2px solid var(--border);
  overflow: hidden;
  transition: max-height 0.25s ease;
}

/* Node type colors */
.node-icon.model { background: var(--accent-soft); color: var(--accent); }
.node-icon.embedding { background: var(--blue-soft); color: var(--blue); }
.node-icon.encoder, .node-icon.decoder { background: var(--purple-soft); color: var(--purple); }
.node-icon.layer { background: var(--green-soft); color: var(--green); }
.node-icon.attention { background: var(--orange-soft); color: var(--orange); }
.node-icon.linear_attn { background: var(--teal-soft); color: var(--teal); }
.node-icon.full_attn { background: var(--orange-soft); color: var(--orange); }
.node-icon.ffn, .node-icon.mlp { background: var(--cyan-soft); color: var(--cyan); }
.node-icon.norm { background: var(--red-soft); color: var(--red); }
.node-icon.head { background: var(--purple-soft); color: var(--purple); }
.node-icon.vision { background: var(--pink-soft); color: var(--pink); }
.node-icon.mtp { background: var(--indigo-soft); color: var(--indigo); }
.node-icon.moe { background: var(--purple-soft); color: var(--purple); }
.node-icon.other { background: var(--bg-soft); color: var(--text-soft); }

.type-tag.model { background: var(--accent-soft); color: var(--accent); }
.type-tag.embedding { background: var(--blue-soft); color: var(--blue); }
.type-tag.encoder, .type-tag.decoder { background: var(--purple-soft); color: var(--purple); }
.type-tag.layer { background: var(--green-soft); color: var(--green); }
.type-tag.attention { background: var(--orange-soft); color: var(--orange); }
.type-tag.linear_attn { background: var(--teal-soft); color: var(--teal); }
.type-tag.full_attn { background: var(--orange-soft); color: var(--orange); }
.type-tag.ffn, .type-tag.mlp { background: var(--cyan-soft); color: var(--cyan); }
.type-tag.norm { background: var(--red-soft); color: var(--red); }
.type-tag.head { background: var(--purple-soft); color: var(--purple); }
.type-tag.vision { background: var(--pink-soft); color: var(--pink); }
.type-tag.mtp { background: var(--indigo-soft); color: var(--indigo); }
.type-tag.moe { background: var(--purple-soft); color: var(--purple); }
.type-tag.other { background: var(--bg-soft); color: var(--text-soft); }

/* Layer type indicator strip */
.layer-type-strip {
  display: inline-block;
  width: 4px;
  height: 16px;
  border-radius: 2px;
  margin-right: 4px;
  flex-shrink: 0;
}
.layer-type-strip.linear { background: var(--teal); }
.layer-type-strip.full { background: var(--orange); }

/* ===== Detail panel ===== */
.detail-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: sticky;
  top: 80px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}
.detail-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-soft);
}
.detail-header h3 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.detail-header .sub { font-size: 12px; color: var(--text-soft); }
.detail-body { padding: 16px; }
.detail-empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-faint);
  font-size: 13px;
}
.detail-section { margin-bottom: 20px; }
.detail-section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  margin-bottom: 8px;
  font-weight: 600;
}
.detail-table {
  width: 100%;
  border-collapse: collapse;
}
.detail-table td {
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.detail-table td:first-child { color: var(--text-soft); }
.detail-table td:last-child {
  font-family: var(--mono);
  text-align: right;
  font-weight: 500;
}
.shape-box {
  display: inline-block;
  font-family: var(--mono);
  font-size: 12px;
  padding: 2px 8px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 4px;
}
.tied-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 8px;
  background: var(--orange-soft);
  color: var(--orange);
  border-radius: 10px;
  font-weight: 600;
}
.param-bar-container {
  margin-top: 12px;
}
.param-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
}
.param-bar-label { width: 100px; color: var(--text-soft); flex-shrink: 0; }
.param-bar-track {
  flex: 1;
  height: 16px;
  background: var(--bg-soft);
  border-radius: 3px;
  overflow: hidden;
}
.param-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
}
.param-bar-value {
  font-family: var(--mono);
  font-size: 11px;
  width: 80px;
  text-align: right;
  flex-shrink: 0;
}

/* ===== Raw config ===== */
.raw-config-section {
  margin-top: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.raw-config-header {
  padding: 12px 16px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;

<script>
// ============================================================
//  Config Normalizer — flatten nested configs (e.g. Qwen3.5 VLM)
// ============================================================
class ConfigNormalizer {
  static normalize(config) {
    if (config.text_config) {
      // Spread text_config values on top, but preserve the top-level model_type
      // (text_config may have a different model_type like "qwen3_5_text" which
      //  doesn't match any parser case and would fall through to generic)
      const textCfg = config.text_config;
      const flat = { ...config };
      for (const key of Object.keys(textCfg)) {
        if (key !== 'model_type' && key !== 'architectures') {
          flat[key] = textCfg[key];
        }
      }
      // Keep top-level model_type; only use text_config's if top-level is missing
      if (!flat.model_type && textCfg.model_type) {
        flat.model_type = textCfg.model_type;
      }
      // Prefer text_config.architectures for the causal LM name (e.g. MiniMaxM3SparseForCausalLM)
      // Fall back to top-level architectures (e.g. MiniMaxM3SparseForConditionalGeneration)
      if (textCfg.architectures && textCfg.architectures[0]) {
        flat._textArchitectures = textCfg.architectures;
      }
      flat._isMultimodal = true;
      flat._visionConfig = config.vision_config || null;
      // Normalize vision config field names (different VLMs use different keys)
      if (flat._visionConfig) {
        const vc = flat._visionConfig;
        // Map common aliases to a unified schema
        // Kimi uses vt_hidden_size / vt_intermediate_size / vt_num_* / text_hidden_size
        if (!vc.hidden_size) vc.hidden_size = vc.vt_hidden_size || vc.mm_hidden_size;
        if (!vc.intermediate_size) vc.intermediate_size = vc.vt_intermediate_size;
        if (!vc.depth && vc.vt_num_hidden_layers) vc.depth = vc.vt_num_hidden_layers;
        if (!vc.depth && vc.num_hidden_layers) vc.depth = vc.num_hidden_layers;
        if (!vc.num_heads) vc.num_heads = vc.vt_num_attention_heads || vc.num_attention_heads;
        if (!vc.out_hidden_size) vc.out_hidden_size = vc.text_hidden_size || vc.projection_dim;
        if (!vc.in_channels) vc.in_channels = vc.num_channels || 3;
        if (!vc.spatial_merge_size) {
          vc.spatial_merge_size = (config.img_token_compression_config && config.img_token_compression_config.spatial_merge_size) || 2;
        }
        if (!vc.temporal_patch_size) vc.temporal_patch_size = (config.img_token_compression_config && config.img_token_compression_config.temporal_patch_size) || 1;
        if (!vc.hidden_act) vc.hidden_act = config.projector_hidden_act || 'gelu';
      }
      flat._topLevel = {
        architectures: config.architectures,
        model_type: config.model_type,
        tie_word_embeddings: config.tie_word_embeddings,
        image_token_id: config.image_token_id,
        video_token_id: config.video_token_id,
        vision_start_token_id: config.vision_start_token_id,
        vision_end_token_id: config.vision_end_token_id,
        projector_hidden_size: config.projector_hidden_size,
      };
      return flat;
    }
    return { ...config, _isMultimodal: false };
  }
}

// ============================================================
//  Safetensors Parser — rebuild module tree from real tensor names
//  This is the ground truth for what modules actually exist.
// ============================================================
class SafetensorsParser {
  static parse(indexData) {
    if (!indexData || !indexData.weight_map) return null;
    const weightMap = indexData.weight_map;
    const metadata = indexData.metadata || {};
    const totalSize = metadata.total_size || 0;

    // Build a set of unique tensor path patterns (replace layer numbers with N)
    const layerInfo = {}; // layerIdx -> { modules: Set(tensorSuffix), prefix }
    const topLevel = {};  // non-layer tensors
    const groups = {};    // e.g. model.language_model, model.visual, mtp

    for (const key of Object.keys(weightMap)) {
      // Match patterns like model.language_model.layers.0.xxx.yyy OR layers.0.xxx (DeepSeek-V4 style)
      const layerMatch = key.match(/^(.+?)\.layers\.(\d+)\.(.+)$/);
      const bareLayerMatch = !layerMatch ? key.match(/^layers\.(\d+)\.(.+)$/) : null;
      if (layerMatch || bareLayerMatch) {
        const prefix = layerMatch ? layerMatch[1] : ''; // e.g. model.language_model or '' (V4)
        const idx = parseInt(layerMatch ? layerMatch[2] : bareLayerMatch[1]);
        const suffix = layerMatch ? layerMatch[3] : bareLayerMatch[2]; // e.g. linear_attn.conv1d.weight
        if (!layerInfo[idx]) layerInfo[idx] = { prefix, modules: new Set() };
        layerInfo[idx].modules.add(suffix);
        if (!groups[prefix]) groups[prefix] = { layers: new Set(), other: [] };
        groups[prefix].layers.add(idx);
      } else if (key.match(/^model\.visual\.blocks\.(\d+)\./)) {
        // Vision blocks
        const vm = key.match(/^model\.visual\.blocks\.(\d+)\.(.+)$/);
        const idx = parseInt(vm[1]);
        const suffix = vm[2];
        if (!layerInfo['vis_' + idx]) layerInfo['vis_' + idx] = { prefix: 'model.visual.blocks', modules: new Set(), isVision: true };
        layerInfo['vis_' + idx].modules.add(suffix);
        if (!groups['model.visual']) groups['model.visual'] = { layers: new Set(), other: [] };
        groups['model.visual'].layers.add(idx);
      } else {
        // Top-level tensor (embedding, lm_head, norm, mtp, etc.)
        topLevel[key] = weightMap[key];
        // Track group for non-layer
        const gMatch = key.match(/^([^.]+(?:\.[^.]+)?)\./);
        if (gMatch) {
          const g = gMatch[1];
          if (!groups[g]) groups[g] = { layers: new Set(), other: [] };
          groups[g].other.push(key);
        }
      }
    }

    // Determine layer types based on which tensors each layer has
    const layerTypes = {}; // idx -> 'linear' | 'full' | 'vision'
    const sortedLayerIdx = Object.keys(layerInfo).filter(k => !layerInfo[k].isVision).map(Number).sort((a,b)=>a-b);
    const visLayerIdx = Object.keys(layerInfo).filter(k => layerInfo[k].isVision).map(k => parseInt(k.replace('vis_',''))).sort((a,b)=>a-b);

    for (const idx of sortedLayerIdx) {
      const mods = layerInfo[idx].modules;
      const hasLinear = mods.has('linear_attn.A_log') || [...mods].some(m => m.startsWith('linear_attn.'));
      const hasFull = [...mods].some(m => m.startsWith('self_attn.'));
      layerTypes[idx] = hasLinear ? 'linear' : (hasFull ? 'full' : 'unknown');
    }

    // Get unique sub-tensor names per layer type
    const linearAttnTensors = new Set();
    const fullAttnTensors = new Set();
    const mlpTensors = new Set();
    const normTensors = new Set();
    for (const idx of sortedLayerIdx) {
      const mods = layerInfo[idx].modules;
      if (layerTypes[idx] === 'linear') {
        for (const m of mods) {
          if (m.startsWith('linear_attn.')) linearAttnTensors.add(m.replace('linear_attn.', ''));
          if (m.startsWith('mlp.')) mlpTensors.add(m.replace('mlp.', ''));
          if (m.includes('layernorm') || m.includes('norm')) normTensors.add(m);
        }
      } else if (layerTypes[idx] === 'full') {
        for (const m of mods) {
          if (m.startsWith('self_attn.')) fullAttnTensors.add(m.replace('self_attn.', ''));
          if (m.startsWith('mlp.')) mlpTensors.add(m.replace('mlp.', ''));
          if (m.includes('layernorm') || m.includes('norm')) normTensors.add(m);
        }
      }
    }

    // Vision tensors
    const visTensors = new Set();
    for (const idx of visLayerIdx) {
      for (const m of layerInfo['vis_' + idx].modules) {
        visTensors.add(m);
      }
    }

    return {
      totalTensors: Object.keys(weightMap).length,
      totalSize,
      numLayers: sortedLayerIdx.length,
      numVisionLayers: visLayerIdx.length,
      layerTypes,
      linearAttnTensors: [...linearAttnTensors].sort(),
      fullAttnTensors: [...fullAttnTensors].sort(),
      mlpTensors: [...mlpTensors].sort(),
      normTensors: [...normTensors].sort(),
      visTensors: [...visTensors].sort(),
      topLevelTensors: Object.keys(topLevel).sort(),
      fullLayerCount: sortedLayerIdx.filter(i => layerTypes[i] === 'full').length,
      linearLayerCount: sortedLayerIdx.filter(i => layerTypes[i] === 'linear').length,
      hasTiedWeights: !topLevelTensorsExists(topLevel, 'lm_head'),
      hasMTP: Object.keys(topLevel).some(k => k.startsWith('mtp.')),
      hasVision: visLayerIdx.length > 0,
    };
  }
}

function topLevelTensorsExists(topLevel, name) {
  return Object.keys(topLevel).some(k => k === name + '.weight' || k === name + '.bias' || k.startsWith(name + '.'));
}

// ============================================================
//  Model Parser — parses HF config.json into a hierarchical tree
// ============================================================
class ModelParser {
  constructor(config, safetensorsData = null) {
    this.config = config;
    this.sftData = safetensorsData;
    this.modelType = config.model_type || 'unknown';
    this.architectures = config.architectures || [];
    this.tiedWeightEmbeddings = new Set();
    this._detectTiedWeights();
  }

  _detectTiedWeights() {
    const t = this.modelType;
    const tiedTypes = ['bert', 'roberta', 'deberta', 'deberta-v2', 'gpt2', 'gpt_neo', 'gptj', 'bart', 't5', 'llama', 'mistral', 'qwen2'];
    if (tiedTypes.includes(t)) {
      this.tiedWeightEmbeddings.add('lm_head');
    }
    // Explicit config flag
    if (this.config.tie_word_embeddings === true) {
      this.tiedWeightEmbeddings.add('lm_head');
    } else if (this.config.tie_word_embeddings === false) {
      this.tiedWeightEmbeddings.delete('lm_head');
    }
  }

  isTied(name) { return this.tiedWeightEmbeddings.has(name); }

  parse() {
    let tree;
    switch (this.modelType) {
      case 'bert': case 'roberta': case 'deberta': case 'deberta-v2':
        tree = this._parseBERTLike(); break;
      case 'gpt2': case 'gpt_neo': case 'gptj':
        tree = this._parseGPT2Like(); break;
      case 'llama': case 'mistral': case 'qwen2': case 'qwen':
        tree = this._parseLLaMALike(); break;
      case 'qwen3': case 'qwen3_5': case 'qwen3_5_text': case 'qwen3_5_moe': case 'qwen4_exp': case 'qwen4_exp_text':
        tree = this._parseQwen3Like(); break;
      case 't5': case 'mt5':
        tree = this._parseT5Like(); break;
      case 'deepseek_v3': case 'kimi_k2': case 'kimi_k25':
        tree = this._parseDeepSeekV3Like(); break;
      case 'kimi_linear': case 'kimi_k3':
        tree = this._parseKimiLinearLike(); break;
      case 'deepseek_v4': case 'deepseek_v41':
        tree = this._parseDeepSeekV4(); break;
      case 'glm_moe_dsa':
        tree = this._parseGLM5(); break;
      case 'openpangu_v2':
        tree = this._parseOpenPanguV2(); break;
      default:
        tree = this._parseGeneric(); break;
    }
    // Calculate total params from children (any parser that didn't call it)
    this._calcTreeParams(tree);
    // Reverse tree: output at top, input at bottom
    this._reverseTree(tree);
    return tree;
  }

  _reverseTree(node) {
    if (node.children && node.children.length > 0) {
      node.children.reverse();
      node.children.forEach(child => this._reverseTree(child));
    }
  }

  // --- Qwen3 / Qwen3.5 (hybrid linear + full attention, VLM) ---
  _parseQwen3Like() {
    const c = this.config;
    const H = c.hidden_size;
    const V = c.vocab_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const KV = c.num_key_value_heads || A;
    const I = c.intermediate_size || c.moe_intermediate_size || H * 4;
    const headDim = c.head_dim || Math.floor(H / A);
    const ropeTheta = (c.rope_parameters && c.rope_parameters.rope_theta) || c.rope_theta || 10000000;
    const rmsEps = c.rms_norm_eps || 1e-6;
    const layerTypes = c.layer_types || [];
    const hasHybridAttn = layerTypes.length > 0 && layerTypes.some(t => t === 'linear_attention');
    const fullAttnInterval = c.full_attention_interval || 0;
    const partialRotary = c.partial_rotary_factor || 0;
    const attnOutputGate = c.attn_output_gate || false;
    const outputGateType = c.output_gate_type || 'swish';
    const isVLM = c._isMultimodal || false;

    // Linear attention params (if present)
    const linearKV = c.linear_num_key_heads || 0;
    const linearVV = c.linear_num_value_heads || 0;
    const linearKeyDim = c.linear_key_head_dim || 0;
    const linearValDim = c.linear_value_head_dim || 0;
    const convKernel = c.linear_conv_kernel_dim || 4;

    // MoE
    const isMoE = (c.num_experts || 0) > 0;
    const numExperts = c.num_experts || 0;
    const expertsPerTok = c.num_experts_per_tok || 0;
    const moeI = c.moe_intermediate_size || I;
    const sharedExpI = c.shared_expert_intermediate_size || moeI;

    // MTP
    const mtpLayers = c.mtp_num_hidden_layers || 0;

    const tree = {
      name: this.architectures[0] || `Qwen3Model`,
      type: 'model',
      icon: '🏛',
      params: 0,
      details: {
        'model_type': c.model_type,
        'architectures': (this.architectures || []).join(', '),
        'hidden_size': H,
        'num_layers': L,
        'attention_heads': A,
        'kv_heads': KV,
        'head_dim': headDim,
        'intermediate_size': isMoE ? moeI : I,
        'vocab_size': V,
        'max_context': c.max_position_embeddings,
        'dtype': c.dtype || c.torch_dtype || 'float32',
        'hybrid_attention': hasHybridAttn,
        'full_attn_interval': fullAttnInterval,
        'partial_rotary': partialRotary,
        'attn_output_gate': attnOutputGate,
        'output_gate_type': outputGateType,
        'tie_embeddings': c.tie_word_embeddings,
        'multimodal': isVLM,
        'is_moe': isMoE,
        'num_experts': numExperts,
        'experts_per_tok': expertsPerTok,
        'moe_intermediate_size': moeI,
        'shared_expert_size': sharedExpI,
      },
      children: []
    };

    // Vision encoder for VLM
    if (isVLM && c._visionConfig) {
      const vc = c._visionConfig;
      tree.children.push({
        name: 'Vision Encoder',
        type: 'vision',
        icon: '👁',
        params: this._calcVisionParams(vc),
        details: {
          'hidden_size': vc.hidden_size,
          'depth': vc.depth,
          'num_heads': vc.num_heads,
          'patch_size': vc.patch_size,
          'intermediate_size': vc.intermediate_size,
          'out_hidden_size': vc.out_hidden_size,
          'spatial_merge_size': vc.spatial_merge_size,
          'temporal_patch_size': vc.temporal_patch_size,
        },
        children: [
          { name: 'Patch Embed', type: 'vision', icon: '🔲', params: vc.in_channels * vc.hidden_size * vc.patch_size * vc.patch_size, details: { 'in_channels': vc.in_channels, 'patch_size': vc.patch_size, 'temporal': vc.temporal_patch_size } },
          {
            name: `ViT Blocks (${vc.depth} layers)`,
            type: 'vision',
            icon: '🔄',
            isLayerGroup: true,
            layerCount: vc.depth,
            params: vc.depth * (vc.hidden_size * vc.hidden_size * 4 + vc.hidden_size * vc.intermediate_size * 2),
            details: { 'depth': vc.depth, 'hidden_size': vc.hidden_size, 'intermediate_size': vc.intermediate_size, 'num_heads': vc.num_heads, 'act': vc.hidden_act },
            children: Array.from({ length: vc.depth }, (_, i) => this._vitBlock(i, vc))
          },
          { name: 'Merger (→ text hidden)', type: 'vision', icon: '🔗', params: vc.hidden_size * vc.out_hidden_size * vc.spatial_merge_size * vc.spatial_merge_size, details: { 'in': vc.hidden_size, 'out': vc.out_hidden_size, 'merge': vc.spatial_merge_size } },
        ]
      });
    }

    // Language model
    const langTree = {
      name: 'Language Model',
      type: 'model',
      icon: '🏛',
      params: 0,
      details: { 'hidden_size': H, 'layers': L },
      children: [
        {
          name: 'Embeddings',
          type: 'embedding',
          icon: '📋',
          details: { 'vocab_size': V, 'hidden_size': H },
          children: [
            { name: 'Token Embedding', type: 'embedding', icon: '🔤', shape: [V, H], params: V * H, details: { 'weight': `${V} × ${H}`, 'dtype': c.dtype || 'bfloat16' } }
          ]
        },
      ]
    };

    // Build layers with hybrid attention
    // If we have safetensors data, use it to determine each layer's type (ground truth)
    const layerChildren = [];
    for (let i = 0; i < L; i++) {
      let isLinear;
      if (this.sftData && this.sftData.layerTypes && this.sftData.layerTypes[i]) {
        isLinear = this.sftData.layerTypes[i] === 'linear';
      } else {
        isLinear = hasHybridAttn && layerTypes[i] === 'linear_attention';
      }
      const layerNode = this._qwen3Layer(i, H, A, KV, headDim, I, rmsEps, ropeTheta, partialRotary, attnOutputGate, outputGateType, isLinear, c, this.sftData, isMoE, numExperts, expertsPerTok, moeI, sharedExpI);
      if (hasHybridAttn || (this.sftData && Object.keys(this.sftData.layerTypes || {}).length > 0)) {
        layerNode._layerType = isLinear ? 'linear' : 'full';
      }
      layerChildren.push(layerNode);
    }

    langTree.children.push({
      name: hasHybridAttn
        ? `Transformer Layers (${L} layers, hybrid)`
        : `Transformer Layers (${L} layers)`,
      type: 'encoder',
      icon: '🔄',
      isLayerGroup: true,
      layerCount: L,
      details: {
        'layers': L,
        'hidden_size': H,
        'attention_heads': A,
        'kv_heads': KV,
        'intermediate_size': I,
        'hybrid': hasHybridAttn,
        'full_attn_interval': fullAttnInterval,
        'linear_layers': hasHybridAttn ? layerTypes.filter(t => t === 'linear_attention').length : 0,
        'full_layers': hasHybridAttn ? layerTypes.filter(t => t === 'full_attention').length : L,
      },
      children: layerChildren
    });

    // LM Head
    const isTied = c.tie_word_embeddings === true;
    langTree.children.push({
      name: 'LM Head',
      type: 'head',
      icon: '🎯',
      params: isTied ? 0 : H * V,
      details: { 'tied_weights': isTied, 'output_gate': outputGateType },
      children: [
        isTied
          ? { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'model.embed_tokens' } }
          : { name: 'Output Projection', type: 'head', icon: '📤', shape: [H, V], params: H * V, details: { 'weight': `${H} × ${V}`, 'no_bias': true, 'output_gate': outputGateType } }
      ]
    });

    // MTP layers
    if (mtpLayers > 0) {
      langTree.children.push({
        name: mtpLayers > 1 ? `MTP Head (${mtpLayers} layers)` : 'MTP Head',
        type: 'mtp',
        icon: '🔮',
        params: mtpLayers * (H * V + H * H * 4 + H * I * 3),
        details: {
          'mtp_layers': mtpLayers,
          'dedicated_embeddings': c.mtp_use_dedicated_embeddings || false,
          'purpose': 'Multi-Token Prediction',
        },
        children: Array.from({ length: mtpLayers }, (_, i) => ({
          name: `MTP Layer ${i}`,
          type: 'mtp',
          icon: '🔮',
          params: H * V + H * H * 4 + H * I * 3,
          details: { 'embedding': H * V, 'transformer': H * H * 4, 'ffn': H * I * 3 },
          children: [
            { name: 'MTP Embed', type: 'embedding', icon: '🔤', shape: [V, H], params: c.mtp_use_dedicated_embeddings ? H * V : 0, details: { 'dedicated': c.mtp_use_dedicated_embeddings || false, 'tied_if_false': true } },
            { name: 'MTP Transformer Block', type: 'layer', icon: '🧱', params: H * H * 4, details: { 'hidden_size': H } },
            { name: 'MTP FFN (SwiGLU)', type: 'ffn', icon: '🔀', params: H * I * 3, details: { 'intermediate_size': I } },
            { name: 'MTP Output Head', type: 'head', icon: '🎯', params: 0, details: { 'shared_with_lm_head': true } }
          ]
        }))
      });
    }

    tree.children.push(langTree);
    this._calcTreeParams(tree);
    return tree;
  }

  _qwen3Layer(i, H, A, KV, headDim, I, rmsEps, ropeTheta, partialRotary, attnOutputGate, outputGateType, isLinear, c, sftData, isMoE, numExperts, expertsPerTok, moeI, sharedExpI) {
    if (isLinear) {
      return this._qwen3LinearLayer(i, H, A, I, rmsEps, c, sftData, isMoE, numExperts, expertsPerTok, moeI, sharedExpI);
    }
    // Full attention layer — real tensors from safetensors:
    // q_proj, k_proj, v_proj, o_proj, q_norm, k_norm
    // (q_norm/k_norm are RMSNorm applied to query/key before attention)
    const qParams = H * (A * headDim);
    const kParams = H * (KV * headDim);
    const vParams = H * (KV * headDim);
    const oParams = (A * headDim) * H;
    const qNormParams = A * headDim;  // RMSNorm on query
    const kNormParams = KV * headDim; // RMSNorm on key
    const attnParams = qParams + kParams + vParams + oParams + qNormParams + kNormParams;
    const normParams = H;
    // MoE MLP params
    const mlpI = isMoE ? moeI : I;
    const mlpNode = isMoE
      ? this._buildMoEMLP(H, mlpI, numExperts, expertsPerTok, sharedExpI, outputGateType)
      : {
          name: 'MLP (SwiGLU)', type: 'ffn', icon: '🔀', params: 3 * H * I,
          details: { 'gate': `${H} x ${I}`, 'up': `${H} x ${I}`, 'down': `${I} x ${H}`, 'activation': 'silu', 'output_gate': outputGateType },
          children: [
            { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'shape': `${I} x ${H}`, 'bias': false } }
          ]
        };
    const ffnParams = mlpNode.params;
    const totalParams = attnParams + ffnParams + 2 * normParams;

    // Build children from real tensor names if available
    const realTensors = sftData ? sftData.fullAttnTensors : [];
    let attnChildren;
    if (realTensors.length > 0) {
      attnChildren = realTensors.map(t => {
        const [name, type] = t.split('.');
        let estParams = 0, shapeStr = '', note = '';
        switch (name) {
          case 'q_proj': estParams = qParams; shapeStr = `${H} x ${A*headDim}`; note = 'query projection'; break;
          case 'k_proj': estParams = kParams; shapeStr = `${H} x ${KV*headDim}`; note = 'key projection (GQA)'; break;
          case 'v_proj': estParams = vParams; shapeStr = `${H} x ${KV*headDim}`; note = 'value projection (GQA)'; break;
          case 'o_proj': estParams = oParams; shapeStr = `${A*headDim} x ${H}`; note = 'output projection'; break;
          case 'q_norm': estParams = qNormParams; shapeStr = `${A*headDim}`; note = 'RMSNorm on query (QK-norm)'; break;
          case 'k_norm': estParams = kNormParams; shapeStr = `${KV*headDim}`; note = 'RMSNorm on key (QK-norm)'; break;
          default: estParams = 0; shapeStr = '?'; note = 'unknown tensor'; break;
        }
        return { name: `${name}`, type: 'attention', icon: '📊', params: estParams,
          details: { 'shape': shapeStr, 'weight_or_bias': type, 'note': note, 'from_safetensors': true } };
      });
    } else {
      attnChildren = [
        { name: 'q_proj', type: 'attention', icon: '❓', shape: [H, A * headDim], params: qParams, details: { 'shape': `${H} x ${A*headDim}`, 'bias': false, 'partial_rotary': partialRotary } },
        { name: 'k_proj', type: 'attention', icon: '🔑', shape: [H, KV * headDim], params: kParams, details: { 'shape': `${H} x ${KV*headDim}`, 'bias': false } },
        { name: 'v_proj', type: 'attention', icon: '💎', shape: [H, KV * headDim], params: vParams, details: { 'shape': `${H} x ${KV*headDim}`, 'bias': false } },
        { name: 'o_proj', type: 'attention', icon: '📤', shape: [A * headDim, H], params: oParams, details: { 'shape': `${A*headDim} x ${H}`, 'bias': false } },
        { name: 'q_norm (QK-norm)', type: 'norm', icon: '📊', shape: [A * headDim], params: qNormParams, details: { 'eps': rmsEps, 'type': 'rms', 'note': 'QK-norm on query' } },
        { name: 'k_norm (QK-norm)', type: 'norm', icon: '📊', shape: [KV * headDim], params: kNormParams, details: { 'eps': rmsEps, 'type': 'rms', 'note': 'QK-norm on key' } },
      ];
    }

    // Add RoPE info node
    attnChildren.push({ name: 'Rotary Position Embedding', type: 'norm', icon: '🌀', params: 0, details: { 'theta': ropeTheta, 'partial_rotary': partialRotary, 'rotated_dim': Math.floor(headDim * partialRotary) } });

    return {
      name: `Layer ${i} (Full Attn)`,
      type: 'layer',
      icon: '🧱',
      _layerType: 'full',
      params: totalParams,
      details: {
        'hidden_size': H,
        'attention_heads': A,
        'kv_heads': KV,
        'head_dim': headDim,
        'intermediate_size': I,
        'rope_theta': ropeTheta,
        'partial_rotary': partialRotary,
        'qk_norm': true,
        'output_gate': attnOutputGate ? outputGateType : 'none',
        'rms_eps': rmsEps,
        'data_source': sftData ? 'safetensors + config' : 'config only',
      },
      children: [
        { name: 'RMSNorm 1', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        {
          name: 'Self-Attention (Full)',
          type: 'attention',
          icon: '⚡',
          _layerType: 'full',
          params: attnParams,
          details: { 'num_heads': A, 'kv_heads': KV, 'head_dim': headDim, 'rope_theta': ropeTheta, 'partial_rotary': partialRotary, 'qk_norm': true, 'output_gate': attnOutputGate, 'no_bias': true, 'sub_tensors': realTensors.length || 6 },
          children: attnChildren
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'RMSNorm 2', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        mlpNode,
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } }
      ]
    };
  }

  _qwen3LinearLayer(i, H, A, I, rmsEps, c, sftData, isMoE, numExperts, expertsPerTok, moeI, sharedExpI) {
    // Linear attention — real tensors from safetensors index:
    // in_proj_a, in_proj_b, in_proj_qkv, in_proj_z, A_log, dt_bias, conv1d, norm, out_proj
    // This is a Mamba-style SSM (State Space Model), not GLA.
    // Use safetensors data if available to determine real sub-tensors; otherwise use config-based.
    const linearKH = c.linear_num_key_heads || A;
    const linearVH = c.linear_num_value_heads || A;
    const keyDim = c.linear_key_head_dim || 128;
    const valDim = c.linear_value_head_dim || 128;
    const convKernel = c.linear_conv_kernel_dim || 4;

    // Real tensor names from safetensors (if available)
    const realTensors = sftData ? sftData.linearAttnTensors : [];

    // Param estimates (index.json has no shapes, so we estimate from config)
    // in_proj_a: typically [some_dim, H] — projects hidden to intermediate state space dim
    // in_proj_b: [some_dim, H]
    // in_proj_qkv: [3 * inner_dim, H] — fused q,k,v
    // in_proj_z: [inner_dim, H] — gate projection
    // A_log: [inner_dim] — log of diagonal state transition matrix
    // dt_bias: [inner_dim] — time step bias
    // conv1d: [kernel, inner_dim] — depthwise conv for local context
    // norm: [inner_dim] — RMSNorm inside linear attn
    // out_proj: [H, inner_dim] — project back to hidden
    const ssmInner = linearKH * keyDim;
    const projA = H * ssmInner;
    const projB = H * ssmInner;
    const projQKV = H * ssmInner * 3;
    const projZ = H * ssmInner;
    const aLog = ssmInner;
    const dtBias = ssmInner;
    const conv1d = convKernel * ssmInner;
    const innerNorm = ssmInner;
    const outProj = ssmInner * H;
    const attnParams = projA + projB + projQKV + projZ + aLog + dtBias + conv1d + innerNorm + outProj;
    const normParams = H;
    // MoE MLP params
    const mlpI = isMoE ? moeI : I;
    const mlpNode = isMoE
      ? this._buildMoEMLP(H, mlpI, numExperts, expertsPerTok, sharedExpI, 'silu')
      : {
          name: 'MLP (SwiGLU)', type: 'ffn', icon: '🔀', params: 3 * H * I,
          details: { 'gate': `${H} x ${I}`, 'up': `${H} x ${I}`, 'down': `${I} x ${H}`, 'activation': 'silu' },
          children: [
            { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'shape': `${I} x ${H}`, 'bias': false } }
          ]
        };
    const ffnParams = mlpNode.params;
    const totalParams = attnParams + ffnParams + 2 * normParams;

    // Build children from real tensor names if available
    let children;
    if (realTensors.length > 0) {
      children = realTensors.map(t => {
        const [name, type] = t.split('.');
        let estParams = 0, shapeStr = '', icon = '📊', note = '';
        switch (name) {
          case 'in_proj_a': estParams = projA; shapeStr = `${H} x ${ssmInner}`; icon = 'a'; note = 'state space projection A'; break;
          case 'in_proj_b': estParams = projB; shapeStr = `${H} x ${ssmInner}`; icon = 'b'; note = 'state space projection B'; break;
          case 'in_proj_qkv': estParams = projQKV; shapeStr = `${H} x ${ssmInner*3}`; icon = 'q'; note = 'fused Q,K,V projection'; break;
          case 'in_proj_z': estParams = projZ; shapeStr = `${H} x ${ssmInner}`; icon = 'z'; note = 'gate projection (SSM gating)'; break;
          case 'A_log': estParams = aLog; shapeStr = `${ssmInner}`; icon = 'A'; note = 'log of diagonal state transition'; break;
          case 'dt_bias': estParams = dtBias; shapeStr = `${ssmInner}`; icon = 'd'; note = 'time step bias'; break;
          case 'conv1d': estParams = conv1d; shapeStr = `${convKernel} x ${ssmInner}`; icon = 'c'; note = 'depthwise conv (local context)'; break;
          case 'norm': estParams = innerNorm; shapeStr = `${ssmInner}`; icon = 'n'; note = 'RMSNorm inside linear attn'; break;
          case 'out_proj': estParams = outProj; shapeStr = `${ssmInner} x ${H}`; icon = 'o'; note = 'project back to hidden'; break;
        }
        return { name: `${name}`, type: 'linear_attn', icon: '📊', params: estParams,
          details: { 'shape': shapeStr, 'weight_or_bias': type, 'note': note, 'from_safetensors': true } };
      });
    } else {
      // Fallback to config-based names
      children = [
        { name: 'in_proj_a', type: 'linear_attn', icon: '📊', params: projA, details: { 'shape': `${H} x ${ssmInner}`, 'note': 'state space projection A' } },
        { name: 'in_proj_b', type: 'linear_attn', icon: '📊', params: projB, details: { 'shape': `${H} x ${ssmInner}`, 'note': 'state space projection B' } },
        { name: 'in_proj_qkv', type: 'linear_attn', icon: '📊', params: projQKV, details: { 'shape': `${H} x ${ssmInner*3}`, 'note': 'fused Q,K,V projection' } },
        { name: 'in_proj_z', type: 'linear_attn', icon: '📊', params: projZ, details: { 'shape': `${H} x ${ssmInner}`, 'note': 'gate projection (SSM gating)' } },
        { name: 'A_log', type: 'linear_attn', icon: '📊', params: aLog, details: { 'shape': `${ssmInner}`, 'note': 'log of diagonal state transition' } },
        { name: 'dt_bias', type: 'linear_attn', icon: '📊', params: dtBias, details: { 'shape': `${ssmInner}`, 'note': 'time step bias' } },
        { name: 'conv1d', type: 'linear_attn', icon: '📊', params: conv1d, details: { 'shape': `${convKernel} x ${ssmInner}`, 'note': 'depthwise conv (local context)' } },
        { name: 'norm', type: 'linear_attn', icon: '📊', params: innerNorm, details: { 'shape': `${ssmInner}`, 'note': 'RMSNorm inside linear attn' } },
        { name: 'out_proj', type: 'linear_attn', icon: '📊', params: outProj, details: { 'shape': `${ssmInner} x ${H}`, 'note': 'project back to hidden' } },
      ];
    }

    return {
      name: `Layer ${i} (Linear Attn)`,
      type: 'layer',
      icon: '🧱',
      _layerType: 'linear',
      params: totalParams,
      details: {
        'hidden_size': H,
        'linear_key/value_heads': linearKH,
        'linear_value_heads': linearVH,
        'key_dim': keyDim,
        'value_dim': valDim,
        'ssm_inner_dim': ssmInner,
        'conv_kernel': convKernel,
        'intermediate_size': I,
        'rms_eps': rmsEps,
        'type': 'linear_attention (SSM/Mamba-style)',
        'data_source': sftData ? 'safetensors + config' : 'config only',
      },
      children: [
        { name: 'RMSNorm 1', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        {
          name: 'Linear Attention (SSM)',
          type: 'linear_attn',
          icon: '🌀',
          _layerType: 'linear',
          params: attnParams,
          details: {
            'mechanism': 'Mamba-style State Space Model',
            'sub_tensors': realTensors.length || 9,
            'ssm_inner': ssmInner,
            'conv_kernel': convKernel,
            'no_bias': true,
          },
          children: children
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'RMSNorm 2', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        mlpNode,
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } }
      ]
    };
  }

  _buildMoEMLP(H, I, numExperts, expertsPerTok, sharedExpI, outputGateType) {
    const perExp = 3 * H * I;
    const sharedP = 3 * H * sharedExpI;
    const routerP = H * numExperts;
    const sharedGateP = H;
    const total = numExperts * perExp + sharedP + routerP + sharedGateP;
    // For large expert counts, avoid creating individual expert objects (causes GC pressure / freeze)
    const MAX_INDIVIDUAL_EXPERTS = 64;
    const expertChildren = numExperts > MAX_INDIVIDUAL_EXPERTS
      ? Array.from({ length: MAX_INDIVIDUAL_EXPERTS }, (_, ei) => ({
          name: `Expert ${ei}`, type: 'ffn', icon: '🔧', params: perExp,
          details: { 'gate_proj': `${H} x ${I}`, 'up_proj': `${H} x ${I}`, 'down_proj': `${I} x ${H}`, 'bias': false },
          children: [
            { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'shape': `${I} x ${H}`, 'bias': false } },
          ]
        })).concat([{
          name: `... (${numExperts - MAX_INDIVIDUAL_EXPERTS} more experts)`, type: 'moe', icon: '⚖', params: (numExperts - MAX_INDIVIDUAL_EXPERTS) * perExp,
          details: { 'note': `Each expert has identical structure: gate [${H}x${I}], up [${H}x${I}], down [${I}x${H}]`, 'per_expert_params': perExp }
        }])
      : Array.from({ length: numExperts }, (_, ei) => ({
          name: `Expert ${ei}`, type: 'ffn', icon: '🔧', params: perExp,
          details: { 'gate_proj': `${H} x ${I}`, 'up_proj': `${H} x ${I}`, 'down_proj': `${I} x ${H}`, 'bias': false },
          children: [
            { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'shape': `${H} x ${I}`, 'bias': false } },
            { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'shape': `${I} x ${H}`, 'bias': false } },
          ]
        }));
    return {
      name: 'MoE MLP', type: 'ffn', icon: '🔀', params: total,
      details: {
        'is_moe': true, 'num_experts': numExperts, 'experts_per_tok': expertsPerTok,
        'moe_intermediate_size': I, 'shared_expert_size': sharedExpI,
        'per_expert_params': perExp, 'shared_expert_params': sharedP,
        'activation': 'silu', 'output_gate': outputGateType,
      },
      children: [
        { name: 'gate (router)', type: 'norm', icon: '🚪', shape: [H, numExperts], params: routerP,
          details: { 'weight': `${H} x ${numExperts}`, 'note': `routes tokens to top-${expertsPerTok} experts`, 'bias': false } },
        { name: 'shared_expert_gate', type: 'norm', icon: '🚪', shape: [H, 1], params: sharedGateP,
          details: { 'weight': `${H} x 1`, 'note': 'gate for shared expert', 'bias': false } },
        {
          name: `Experts (${numExperts})`, type: 'moe', icon: '🎲',
          isLayerGroup: true, layerCount: numExperts, params: numExperts * perExp,
          details: { 'per_expert': perExp, 'gate_proj': `${H} x ${I}`, 'up_proj': `${H} x ${I}`, 'down_proj': `${I} x ${H}` },
          children: expertChildren
        },
        {
          name: 'Shared Expert', type: 'ffn', icon: '🤝', params: sharedP,
          details: { 'gate_proj': `${H} x ${sharedExpI}`, 'up_proj': `${H} x ${sharedExpI}`, 'down_proj': `${sharedExpI} x ${H}`, 'bias': false, 'always_active': true },
          children: [
            { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, sharedExpI], params: H * sharedExpI, details: { 'shape': `${H} x ${sharedExpI}`, 'bias': false } },
            { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, sharedExpI], params: H * sharedExpI, details: { 'shape': `${H} x ${sharedExpI}`, 'bias': false } },
            { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [sharedExpI, H], params: sharedExpI * H, details: { 'shape': `${sharedExpI} x ${H}`, 'bias': false } },
          ]
        },
      ]
    };
  }

  _calcVisionParams(vc) {
    if (!vc) return 0;
    const patchEmbed = vc.in_channels * vc.hidden_size * vc.patch_size * vc.patch_size;
    const perBlock = vc.hidden_size * vc.hidden_size * 4 + vc.hidden_size * vc.intermediate_size * 2;
    const blocks = (vc.depth || 27) * perBlock;
    const merger = vc.hidden_size * vc.out_hidden_size * vc.spatial_merge_size * vc.spatial_merge_size;
    return patchEmbed + blocks + merger;
  }

  _vitBlock(i, vc) {
    const H = vc.hidden_size;
    const I = vc.intermediate_size;
    const numHeads = vc.num_heads || 16;
    const headDim = Math.floor(H / numHeads);

    // QKV fused projection: 3 × H × H
    const qkvParams = 3 * H * H;
    const qkvBias = 3 * H;
    const projParams = H * H;
    const projBias = H;
    const attnParams = qkvParams + qkvBias + projParams + projBias;

    // MLP: fc1 (H×I) + fc2 (I×H), each with bias
    const fc1Params = H * I;
    const fc1Bias = I;
    const fc2Params = I * H;
    const fc2Bias = H;
    const mlpParams = fc1Params + fc1Bias + fc2Params + fc2Bias;

    // LayerNorms (norm1 + norm2), each has weight + bias
    const normParams = 2 * H;
    const totalNormParams = 2 * normParams;

    const totalParams = attnParams + mlpParams + totalNormParams;

    return {
      name: `ViT Block ${i}`,
      type: 'vision',
      icon: '🔄',
      params: totalParams,
      details: {
        'hidden_size': H,
        'num_heads': numHeads,
        'head_dim': headDim,
        'intermediate_size': I,
        'activation': vc.hidden_act || 'gelu',
        'has_bias': true,
      },
      children: [
        { name: 'Norm 1', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'type': 'layer_norm', 'eps': 1e-6, 'weight+bias': true } },
        {
          name: 'Attention',
          type: 'attention',
          icon: '⚡',
          params: attnParams,
          details: { 'num_heads': numHeads, 'head_dim': headDim, 'qkv': 'fused', 'has_bias': true },
          children: [
            { name: 'qkv (fused)', type: 'attention', icon: '❓', shape: [H, 3 * H], params: qkvParams, details: { 'weight': `${H} × ${3 * H}`, 'bias': `${3 * H}`, 'note': 'query+key+value fused into one projection' } },

            { name: 'linear_fc1', type: 'ffn', icon: '⬆', shape: [H, I], params: fc1Params, details: { 'weight': `${H} × ${I}`, 'bias': `${I}` } },
            { name: 'linear_fc2', type: 'ffn', icon: '⬇', shape: [I, H], params: fc2Params, details: { 'weight': `${I} × ${H}`, 'bias': `${H}` } },
          ]
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
      ]
    };
  }

  // --- BERT family ---
  _parseBERTLike() {
    const c = this.config;
    const H = c.hidden_size;
    const V = c.vocab_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const I = c.intermediate_size || H * 4;
    const P = c.max_position_embeddings;
    const TV = c.type_vocab_size || 2;

    const tree = {
      name: this.architectures[0] || 'BERTModel',
      type: 'model',
      icon: '🏛',
      params: 0,
      details: {},
      children: [
        {
          name: 'Embeddings',
          type: 'embedding',
          icon: '📋',
          details: { 'vocab_size': V, 'hidden_size': H, 'max_pos': P, 'type_vocab': TV },
          children: [
            { name: 'Token Embedding', type: 'embedding', icon: '🔤', shape: [V, H], params: V * H, details: { 'weight': `${V} × ${H}`, 'dtype': 'float32' } },
            { name: 'Position Embedding', type: 'embedding', icon: '📍', shape: [P, H], params: P * H, details: { 'weight': `${P} × ${H}`, 'learned': true } },
            { name: 'Token Type Embedding', type: 'embedding', icon: '🏷', shape: [TV, H], params: TV * H, details: { 'weight': `${TV} × ${H}` } },
            { name: 'LayerNorm + Dropout', type: 'norm', icon: '📊', shape: [H], params: 2 * H, details: { 'eps': c.layer_norm_eps || 1e-12, 'dropout': c.hidden_dropout_prob || 0.1 } }
          ]
        },
        {
          name: `Encoder (${L} layers)`,
          type: 'encoder',
          icon: '🔄',
          isLayerGroup: true,
          layerCount: L,
          details: { 'layers': L, 'hidden_size': H, 'attention_heads': A, 'intermediate_size': I },
          children: Array.from({ length: L }, (_, i) => this._bertLayer(i, H, A, I))
        },
        {
          name: 'Pooler',
          type: 'head',
          icon: '🏊',
          shape: [H, H],
          params: H * H + H,
          details: { 'dense': `${H} × ${H}`, 'activation': 'tanh' }
        }
      ]
    };

    const headType = this.architectures[0] || '';
    if (headType.includes('MaskedLM')) {
      tree.children.push({
        name: 'LM Head',
        type: 'head',
        icon: '🎯',
        details: { 'tied_weights': true },
        children: [
          { name: 'Transform (Dense)', type: 'ffn', icon: '🔄', shape: [H, H], params: H * H + H, details: { 'weight': `${H} × ${H}`, 'bias': H } },
          { name: 'LayerNorm', type: 'norm', icon: '📊', shape: [H], params: 2 * H, details: { 'eps': c.layer_norm_eps || 1e-12 } },
          { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'embeddings.word_embeddings', 'output_size': V } }
        ]
      });
    } else if (headType.includes('SequenceClassification')) {
      tree.children.push({
        name: 'Classifier',
        type: 'head',
        icon: '🎯',
        shape: [H, c.num_labels || 2],
        params: H * (c.num_labels || 2) + (c.num_labels || 2),
        details: { 'dropout': c.hidden_dropout_prob || 0.1, 'num_labels': c.num_labels || 2 }
      });
    } else if (headType.includes('TokenClassification')) {
      tree.children.push({
        name: 'Token Classifier',
        type: 'head',
        icon: '🎯',
        shape: [H, c.num_labels || 2],
        params: H * (c.num_labels || 2) + (c.num_labels || 2),
        details: { 'dropout': c.hidden_dropout_prob || 0.1, 'num_labels': c.num_labels || 2 }
      });
    }

    this._calcTreeParams(tree);
    return tree;
  }

  _bertLayer(i, H, A, I) {
    const attnParams = 4 * (H * H + H);
    const ffnParams = H * I + I + I * H + H;
    const normParams = 2 * 2 * H;
    return {
      name: `Layer ${i}`,
      type: 'layer',
      icon: '🧱',
      params: attnParams + ffnParams + normParams,
      details: { 'hidden_size': H, 'attention_heads': A, 'intermediate_size': I },
      children: [
        {
          name: 'Self-Attention',
          type: 'attention',
          icon: '⚡',
          params: attnParams,
          details: { 'num_heads': A, 'head_dim': H / A, 'hidden_size': H },
          children: [
            { name: 'Query (Q)', type: 'attention', icon: '❓', shape: [H, H], params: H * H + H, details: { 'weight': `${H} × ${H}`, 'bias': H } },
            { name: 'Key (K)', type: 'attention', icon: '🔑', shape: [H, H], params: H * H + H, details: { 'weight': `${H} × ${H}`, 'bias': H } },
            { name: 'Value (V)', type: 'attention', icon: '💎', shape: [H, H], params: H * H + H, details: { 'weight': `${H} × ${H}`, 'bias': H } },
            { name: 'Output (O)', type: 'attention', icon: '📤', shape: [H, H], params: H * H + H, details: { 'weight': `${H} × ${H}`, 'bias': H } }
          ]
        },
        { name: 'Attention LayerNorm + Residual', type: 'norm', icon: '📊', shape: [H], params: 2 * H, details: { 'eps': this.config.layer_norm_eps || 1e-12 } },
        {
          name: 'Intermediate (FFN)',
          type: 'ffn',
          icon: '🔀',
          params: H * I + I,
          shape: [H, I],
          details: { 'input_size': H, 'output_size': I, 'activation': this.config.hidden_act || 'gelu' }
        },
        { name: 'Output (FFN)', type: 'ffn', icon: '🔀', shape: [I, H], params: I * H + H, details: { 'input_size': I, 'output_size': H } },
        { name: 'Output LayerNorm + Residual', type: 'norm', icon: '📊', shape: [H], params: 2 * H, details: { 'eps': this.config.layer_norm_eps || 1e-12 } }
      ]
    };
  }

  // --- GPT-2 family ---
  _parseGPT2Like() {
    const c = this.config;
    const H = c.hidden_size || c.n_embd;
    const V = c.vocab_size || c.n_vocab || 50257;
    const L = c.num_hidden_layers || c.n_layer || c.num_layers;
    const A = c.num_attention_heads || c.n_head;
    const P = c.max_position_embeddings || c.n_positions || 1024;
    const I = H * 4;

    const tree = {
      name: this.architectures[0] || 'GPT2Model',
      type: 'model',
      icon: '🏛',
      params: 0,
      details: {},
      children: [
        {
          name: 'Embeddings',
          type: 'embedding',
          icon: '📋',
          details: { 'vocab_size': V, 'hidden_size': H, 'max_pos': P },
          children: [
            { name: 'Token Embedding', type: 'embedding', icon: '🔤', shape: [V, H], params: V * H, details: { 'weight': `${V} × ${H}` } },
            { name: 'Position Embedding', type: 'embedding', icon: '📍', shape: [P, H], params: P * H, details: { 'weight': `${P} × ${H}`, 'learned': true } },
            { name: 'Dropout', type: 'norm', icon: '📊', params: 0, details: { 'rate': c.embd_pdrop || 0.1 } }
          ]
        },
        {
          name: `Transformer Blocks (${L} layers)`,
          type: 'encoder',
          icon: '🔄',
          isLayerGroup: true,
          layerCount: L,
          details: { 'layers': L, 'hidden_size': H, 'attention_heads': A },
          children: Array.from({ length: L }, (_, i) => this._gpt2Layer(i, H, A, I, c))
        }
      ]
    };

    const headName = this.architectures[0] || '';
    if (headName.includes('LMHead')) {
      tree.children.push({
        name: 'LM Head',
        type: 'head',
        icon: '🎯',
        details: { 'tied_weights': true },
        children: [
          { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'wte.weight', 'output_size': V } }
        ]
      });
    }

    this._calcTreeParams(tree);
    return tree;
  }

  _gpt2Layer(i, H, A, I, c) {
    const lnParams = 2 * H;
    const attnParams = 4 * (H * H + H);
    const ffnParams = H * I + I + I * H + H;
    return {
      name: `Block ${i}`,
      type: 'layer',
      icon: '🧱',
      params: 2 * lnParams + attnParams + ffnParams,
      details: { 'hidden_size': H, 'attention_heads': A, 'ffn_size': I },
      children: [
        { name: 'LayerNorm 1', type: 'norm', icon: '📊', shape: [H], params: lnParams, details: { 'eps': c.layer_norm_epsilon || 1e-5 } },
        {
          name: 'Self-Attention',
          type: 'attention',
          icon: '⚡',
          params: attnParams,
          details: { 'num_heads': A, 'head_dim': H / A, 'combined_qkv': true },
          children: [
            { name: 'Conv1D QKV (combined)', type: 'attention', icon: '🔗', shape: [H, 3 * H], params: H * 3 * H + 3 * H, details: { 'weight': `${H} × ${3 * H}`, 'note': 'Q/K/V fused in one matrix' } },
            { name: 'Conv1D Output', type: 'attention', icon: '📤', shape: [H, H], params: H * H + H, details: { 'weight': `${H} × ${H}` } }
          ]
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'LayerNorm 2', type: 'norm', icon: '📊', shape: [H], params: lnParams, details: { 'eps': c.layer_norm_epsilon || 1e-5 } },
        {
          name: 'MLP (FFN)',
          type: 'ffn',
          icon: '🔀',
          params: ffnParams,
          details: { 'input_size': H, 'intermediate_size': I, 'activation': 'gelu' },
          children: [
            { name: 'c_fc (up)', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I + I, details: { 'weight': `${H} × ${I}` } },
            { name: 'c_proj (down)', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H + H, details: { 'weight': `${I} × ${H}` } }
          ]
        }
      ]
    };
  }

  // --- LLaMA family (with GQA support) ---
  _parseLLaMALike() {
    const c = this.config;
    const H = c.hidden_size;
    const V = c.vocab_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const KV = c.num_key_value_heads || A;
    const I = c.intermediate_size;
    const headDim = c.head_dim || Math.floor(H / A);
    const ropeTheta = c.rope_theta || 10000;
    const rmsEps = c.rms_norm_eps || 1e-6;

    const tree = {
      name: this.architectures[0] || 'LlamaModel',
      type: 'model',
      icon: '🏛',
      params: 0,
      details: {},
      children: [
        {
          name: 'Embeddings',
          type: 'embedding',
          icon: '📋',
          details: { 'vocab_size': V, 'hidden_size': H },
          children: [
            { name: 'Token Embedding', type: 'embedding', icon: '🔤', shape: [V, H], params: V * H, details: { 'weight': `${V} × ${H}`, 'dtype': c.torch_dtype || 'float32' } }
          ]
        },
        {
          name: `Transformer Layers (${L} layers)`,
          type: 'encoder',
          icon: '🔄',
          isLayerGroup: true,
          layerCount: L,
          details: { 'layers': L, 'hidden_size': H, 'attention_heads': A, 'kv_heads': KV, 'intermediate_size': I, 'gqa': KV !== A },
          children: Array.from({ length: L }, (_, i) => this._llamaLayer(i, H, A, KV, headDim, I, rmsEps, ropeTheta, c))
        }
      ]
    };

    const isTied = c.tie_word_embeddings !== undefined ? c.tie_word_embeddings : false;
    tree.children.push({
      name: 'LM Head',
      type: 'head',
      icon: '🎯',
      params: isTied ? 0 : H * V,
      details: { 'tied_weights': isTied },
      children: [
        isTied
          ? { name: 'Decoder (tied)', type: 'head', icon: '🔗', shape: [H, V], params: 0, details: { 'tied_to': 'model.embed_tokens' } }
          : { name: 'Output Projection', type: 'head', icon: '📤', shape: [H, V], params: H * V, details: { 'weight': `${H} × ${V}`, 'no_bias': true } }
      ]
    });

    this._calcTreeParams(tree);
    return tree;
  }

  _llamaLayer(i, H, A, KV, headDim, I, rmsEps, ropeTheta, c) {
    const qParams = H * (A * headDim);
    const kParams = H * (KV * headDim);
    const vParams = H * (KV * headDim);
    const oParams = (A * headDim) * H;
    const attnParams = qParams + kParams + vParams + oParams;
    const ffnParams = 3 * H * I;
    const normParams = H;
    return {
      name: `Layer ${i}`,
      type: 'layer',
      icon: '🧱',
      params: attnParams + ffnParams + 2 * normParams,
      details: { 'hidden_size': H, 'attention_heads': A, 'kv_heads': KV, 'head_dim': headDim, 'intermediate_size': I, 'gqa': KV !== A },
      children: [
        { name: 'RMSNorm 1', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        {
          name: 'Self-Attention' + (KV !== A ? ' (GQA)' : ''),
          type: 'attention',
          icon: '⚡',
          params: attnParams,
          details: { 'num_heads': A, 'num_kv_heads': KV, 'head_dim': headDim, 'rope_theta': ropeTheta, 'no_bias': true },
          children: [
            { name: 'q_proj', type: 'attention', icon: '❓', shape: [H, A * headDim], params: qParams, details: { 'weight': `${H} × ${A * headDim}`, 'bias': false } },
            { name: 'k_proj', type: 'attention', icon: '🔑', shape: [H, KV * headDim], params: kParams, details: { 'weight': `${H} × ${KV * headDim}`, 'bias': false, 'grouped': KV < A } },
            { name: 'v_proj', type: 'attention', icon: '💎', shape: [H, KV * headDim], params: vParams, details: { 'weight': `${H} × ${KV * headDim}`, 'bias': false, 'grouped': KV < A } },
            { name: 'o_proj', type: 'attention', icon: '📤', shape: [A * headDim, H], params: oParams, details: { 'weight': `${A * headDim} × ${H}`, 'bias': false } },
            { name: 'Rotary Position Embedding', type: 'norm', icon: '🌀', params: 0, details: { 'theta': ropeTheta, 'type': 'rope', 'inv_freq': `${headDim} dim` } }
          ]
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'RMSNorm 2', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': rmsEps, 'type': 'rms' } },
        {
          name: 'MLP (SwiGLU)',
          type: 'ffn',
          icon: '🔀',
          params: ffnParams,
          details: { 'gate': `${H} × ${I}`, 'up': `${H} × ${I}`, 'down': `${I} × ${H}`, 'activation': 'silu', 'no_bias': true },
          children: [
            { name: 'gate_proj', type: 'ffn', icon: '🚪', shape: [H, I], params: H * I, details: { 'weight': `${H} × ${I}`, 'bias': false } },
            { name: 'up_proj', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'weight': `${H} × ${I}`, 'bias': false } },
            { name: 'down_proj', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'weight': `${I} × ${H}`, 'bias': false } }
          ]
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } }
      ]
    };
  }

  // --- T5 family ---
  _parseT5Like() {
    const c = this.config;
    const H = c.d_model;
    const V = c.vocab_size;
    const L = c.num_layers;
    const A = c.num_heads;
    const DKV = c.d_kv || H / A;
    const I = c.d_ff || H * 4;
    const isGated = c.is_gated_act || false;
    const reluEps = c.layer_norm_epsilon || 1e-6;

    const tree = {
      name: this.architectures[0] || 'T5Model',
      type: 'model',
      icon: '🏛',
      params: 0,
      details: { 'encoder_decoder': true, 'tied_weights': true },
      children: [
        {
          name: 'Shared Embeddings',
          type: 'embedding',
          icon: '📋',
          params: V * H,
          shape: [V, H],
          details: { 'vocab_size': V, 'd_model': H, 'shared': 'encoder + decoder + lm_head' }
        },
        {
          name: `Encoder (${L} layers)`,
          type: 'encoder',
          icon: '🔄',
          isLayerGroup: true,
          layerCount: L,
          details: { 'layers': L, 'd_model': H, 'attention_heads': A },
          children: Array.from({ length: L }, (_, i) => this._t5EncLayer(i, H, A, DKV, I, isGated, reluEps, c))
        },
        {
          name: `Decoder (${L} layers)`,
          type: 'decoder',
          icon: '🔄',
          isLayerGroup: true,
          layerCount: L,
          details: { 'layers': L, 'd_model': H, 'attention_heads': A, 'cross_attention': true },
          children: Array.from({ length: L }, (_, i) => this._t5DecLayer(i, H, A, DKV, I, isGated, reluEps, c))
        },
        {
          name: 'LM Head (tied)',
          type: 'head',
          icon: '🎯',
          params: 0,
          details: { 'tied_to': 'shared.weight', 'dtype': c.dtype || 'float32' }
        }
      ]
    };

    this._calcTreeParams(tree);
    return tree;
  }

  _t5EncLayer(i, H, A, DKV, I, isGated, eps, c) {
    const attnParams = H * (A * DKV) + (A * DKV) * H;
    const ffnParams = isGated ? 3 * H * I : 2 * H * I;
    const normParams = H;
    return {
      name: `Encoder Layer ${i}`,
      type: 'layer',
      icon: '🧱',
      params: attnParams + ffnParams + 2 * normParams,
      details: { 'd_model': H, 'attention_heads': A, 'd_kv': DKV, 'd_ff': I },
      children: [
        { name: 'Self-Attention (T5 RMSNorm)', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': eps, 'type': 't5_rms' } },
        {
          name: 'Self-Attention',
          type: 'attention',
          icon: '⚡',
          params: attnParams,
          details: { 'num_heads': A, 'd_kv': DKV, 'no_bias': true, 'relative_attention': true, 'num_buckets': c.relative_attention_num_buckets || 32 },
          children: [
            { name: 'q', type: 'attention', icon: '❓', shape: [H, A * DKV], params: H * A * DKV, details: { 'weight': `${H} × ${A * DKV}`, 'bias': false } },
            { name: 'o', type: 'attention', icon: '📤', shape: [A * DKV, H], params: (A * DKV) * H, details: { 'weight': `${A * DKV} × ${H}`, 'bias': false } },
            { name: 'Relative Position Bias', type: 'norm', icon: '🌀', params: c.relative_attention_num_buckets || 32, details: { 'buckets': c.relative_attention_num_buckets || 32, 'shared_in_first_layer': true } }
          ]
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'FFN RMSNorm', type: 'norm', icon: '📊', shape: [H], params: normParams, details: { 'eps': eps, 'type': 't5_rms' } },
        {
          name: 'Dense FFN',
          type: 'ffn',
          icon: '🔀',
          params: ffnParams,
          details: { 'd_model': H, 'd_ff': I, 'gated': isGated, 'activation': c.activation_dtype || 'relu' },
          children: isGated ? [
            { name: 'wi_0', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'weight': `${H} × ${I}`, 'bias': false } },
            { name: 'wi_1', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'weight': `${H} × ${I}`, 'bias': false } },
            { name: 'wo', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'weight': `${I} × ${H}`, 'bias': false } }
          ] : [
            { name: 'wi', type: 'ffn', icon: '⬆', shape: [H, I], params: H * I, details: { 'weight': `${H} × ${I}`, 'bias': false } },
            { name: 'wo', type: 'ffn', icon: '⬇', shape: [I, H], params: I * H, details: { 'weight': `${I} × ${H}`, 'bias': false } }
          ]
        },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } }
      ]
    };
  }

  _t5DecLayer(i, H, A, DKV, I, isGated, eps, c) {
    const selfAttnParams = H * (A * DKV) + (A * DKV) * H;
    const crossAttnParams = H * (A * DKV) + (A * DKV) * H;
    const ffnParams = isGated ? 3 * H * I : 2 * H * I;
    const normParams = 3 * H;
    return {
      name: `Decoder Layer ${i}`,
      type: 'layer',
      icon: '🧱',
      params: selfAttnParams + crossAttnParams + ffnParams + normParams,
      details: { 'd_model': H, 'attention_heads': A, 'd_kv': DKV, 'd_ff': I, 'has_cross_attn': true },
      children: [
        { name: 'Self-Attn RMSNorm', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'eps': eps } },
        { name: 'Self-Attention (causal)', type: 'attention', icon: '⚡', params: selfAttnParams, details: { 'causal': true, 'num_heads': A, 'no_bias': true } },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'Cross-Attn RMSNorm', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'eps': eps } },
        { name: 'Cross-Attention', type: 'attention', icon: '🔗', params: crossAttnParams, details: { 'num_heads': A, 'no_bias': true, 'enc_dec': true } },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } },
        { name: 'FFN RMSNorm', type: 'norm', icon: '📊', shape: [H], params: H, details: { 'eps': eps } },
        { name: 'Dense FFN', type: 'ffn', icon: '🔀', params: ffnParams, details: { 'd_ff': I, 'gated': isGated } },
        { name: 'Residual', type: 'norm', icon: '➕', params: 0, details: { 'type': 'add' } }
      ]
    };
  }

  // --- DeepSeek-V3 / Kimi-K2 (MLA attention + MoE + optional VLM) ---
  _parseDeepSeekV3Like() {
    const c = this.config;
    const H = c.hidden_size;
    const V = c.vocab_size;
    const L = c.num_hidden_layers;
    const A = c.num_attention_heads;
    const KV = c.num_key_value_heads || 1;
    const qkNope = c.qk_nope_head_dim || 128;
    const qkRope = c.qk_rope_head_dim || 64;
    const vHead = c.v_head_dim || qkNope;
    const headDim = qkNope + qkRope;
    const qLoraR = c.q_lora_rank || 0;
    const kvLoraR = c.kv_lora_rank || 0;
    const I = c.intermediate_size || H * 4;
    const moeI = c.moe_intermediate_size || I;
    const numExp = c.n_routed_experts || c.num_experts || 0;
    const numExpPerTok = c.num_experts_per_tok || 0;
    const numSharedExp = c.n_shared_experts || 0;
    const sharedExpI = c.shared_expert_intermediate_size || moeI;
    const firstKDense = c.first_k_dense_replace || 0;
    const moeFreq = c.moe_layer_freq || 1;
    const rmsEps = c.rms_norm_eps || 1e-6;
    const ropeTheta = c.rope_theta || 10000;
    const mtpLayers = c.num_nextn_predict_layers || 0;
    const isVLM = c._isMultimodal || false;

    const tree = {
      name: this.architectures[0] || 'DeepseekV3ForCausalLM',
      type: 'model', icon: '🏛', params: 0,
      details: {
        'model_type': c.model_type,
        'architectures': (this.architectures || []).join(', '),
        'hidden_size': H, 'num_layers': L, 'attention_heads': A,
        'kv_heads': KV, 'head_dim': headDim,
        'q_lora_rank': qLoraR, 'kv_lora_rank': kvLoraR,
        'qk_nope_head_dim': qkNope, 'qk_rope_head_dim': qkRope, 'v_head_dim': vHead,
        'vocab_size': V, 'max_context': c.max_position_embeddings,
        'dtype': c.dtype || c.torch_dtype || 'bfloat16',
        'is_moe': numExp > 0, 'n_routed_experts': numExp,
        'experts_per_tok': numExpPerTok, 'n_shared_experts': numSharedExp,
        'moe_intermediate_size': moeI, 'shared_expert_size': sharedExpI,
        'first_k_dense_replace': firstKDense, 'moe_layer_freq': moeFreq,
        'tie_embeddings': c.tie_word_embeddings,
        'multimodal': isVLM,
        'quantization': c.quantization_config ? c.quantization_config.quant_method : 'none',
      },
      children: []
    };

    // Vision Encoder for VLM
    if (isVLM && c._visionConfig) {
      const vc = c._visionConfig;
      tree.children.push({
        name: 'Vision Encoder', type: 'vision', icon: '👁', params: this._calcVisionParams(vc),
        details: { 'hidden_size': vc.hidden_size || vc.vt_hidden_size, 'depth': vc.depth || vc.vt_num_hidden_layers, 'num_heads': vc.num_heads || vc.vt_num_attention_heads, 'patch_size': vc.patch_size, 'intermediate_size': vc.intermediate_size || vc.vt_intermediate_size, 'out_hidden_size': vc.out_hidden_size || vc.text_hidden_size, 'spatial_merge_size': vc.spatial_merge_size, 'temporal_patch_size': vc.temporal_patch_size },
        children: [
          { name: 'Patch Embed', type: 'vision', icon: '🔲', params: (vc.in_channels||3) * (vc.vt_hidden_size||vc.hidden_size) * vc.patch_size * vc.patch_size, details: { 'in_channels': vc.in_channels||3, 'patch_size': vc.patch_size } },
          { name: `ViT Blocks (${vc.depth || vc.vt_num_hidden_layers} layers)`, type: 'vision', icon: '🔄', isLayerGroup: true, layerCount: vc.depth || vc.vt_num_hidden_layers, params: this._calcVisionParams(vc) - (vc.in_channels||3) * (vc.vt_hidden_size||vc.hidden_size) * vc.patch_size * vc.patch_size, details: {}, children: [] },
